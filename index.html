<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uzi Games</title>
<meta name="description" content="A tiny studio where Uzay and his dad make games together. Our first games are coming soon.">
<link rel="canonical" href="https://uzigames.com/">
<meta name="theme-color" content="#fbf6ec">
<meta property="og:type" content="website">
<meta property="og:url" content="https://uzigames.com/">
<meta property="og:title" content="Uzi Games">
<meta property="og:description" content="A tiny studio where Uzay and his dad make games together. Our first games are coming soon.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: one centered column on squared notebook paper — a badge, the bobbing wordmark, a short hello and a big button into the Lab; a quiet footer */
:root{
  --paper:#fbf6ec;
  --grid:rgba(35,67,196,.07);
  --ink:#1d2433;
  --ink-dim:#5b6374;
  --koi:#f27a32;
  --koi-deep:#b4501a;
  --blue:#2343c4;
  --line:rgba(29,36,51,.14);
  --font-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#14181f;--grid:rgba(138,160,255,.07);--ink:#eef0f4;--ink-dim:#a3abbb;--line:rgba(238,240,244,.16);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background-color:var(--paper);color:var(--ink);font-family:var(--font-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
main{
  flex:1;width:100%;max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 48px) 0 40px;
}
.rozet{
  margin:0 0 22px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
}
.logo{
  margin:0;font-family:var(--font-display);font-weight:400;line-height:.86;
  font-size:clamp(76px,24vw,168px);letter-spacing:-.01em;
  display:flex;flex-direction:column;align-items:center;
}
.logo .s{display:flex}
.logo .s:first-child{color:var(--koi);text-shadow:0 6px 0 var(--koi-deep)}
.logo .s:last-child{font-size:.62em;color:var(--blue);margin-top:.12em}
@media (prefers-color-scheme:dark){.logo .s:last-child{color:#8aa0ff}}
.logo i{font-style:normal;display:inline-block;animation:bob 2.8s ease-in-out infinite}
.logo i:nth-child(2){animation-delay:-.7s}
.logo i:nth-child(3){animation-delay:-1.4s}
.logo i:nth-child(4){animation-delay:-2.1s}
.logo i:nth-child(5){animation-delay:-.35s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.merhaba{margin:34px 0 0;max-width:30ch;font-size:clamp(18px,4.6vw,21px);line-height:1.5;font-weight:600;text-wrap:balance}
.lab{
  margin:34px 0 0;display:inline-flex;align-items:center;gap:.45em;
  padding:18px 34px 20px;border-radius:999px;background:var(--koi);color:#1d2433;
  font-family:var(--font-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1;
  text-decoration:none;box-shadow:0 6px 0 var(--koi-deep);
  transition:transform .12s ease,box-shadow .12s ease;
}
.lab .ok{display:inline-block;transition:transform .2s ease}
.lab:hover .ok{transform:translateX(4px)}
.lab:active{transform:translateY(4px);box-shadow:0 2px 0 var(--koi-deep)}
.lab:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media (prefers-color-scheme:dark){.lab:focus-visible{outline-color:#8aa0ff}}
.lab-not{margin:16px 0 0;max-width:34ch;font-size:15px;line-height:1.5;color:var(--ink-dim);text-wrap:balance}
footer{
  width:100%;max-width:640px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:16px 0 calc(env(safe-area-inset-bottom,0px) + 20px);border-top:1.5px solid var(--line);
  font-size:14px;color:var(--ink-dim);
}
footer nav{display:flex;gap:16px}
footer a{color:var(--ink);font-weight:700;text-decoration:none;padding:8px 2px}
footer a:hover{text-decoration:underline;text-underline-offset:3px}
footer a:focus-visible{outline:2px solid var(--koi);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.logo i{animation:none}}
</style>
</head>
<body>
<main>
  <p class="rozet">Coming soon</p>
  <h1 class="logo" aria-label="Uzi Games">
    <span class="s" aria-hidden="true"><i>u</i><i>z</i><i>i</i></span>
    <span class="s" aria-hidden="true"><i>g</i><i>a</i><i>m</i><i>e</i><i>s</i></span>
  </h1>
  <p class="merhaba">Hi, I’m Uzay! My dad and I make games together. Our first games are coming soon.</p>
  <a class="lab" href="/lab/">Enter the Lab <span class="ok" aria-hidden="true">→</span></a>
  <p class="lab-not">Come and play the games we’re still testing. For friends and family, with a sign-in.</p>
</main>
<footer>
  <span>© 2026 Uzi Games</span>
  <nav><a href="/privacy/">Privacy</a><a href="/support/">Support</a><a href="/lab/">Lab</a></nav>
</footer>
</body>
</html>
