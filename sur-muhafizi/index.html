<style>
/* War table: a walnut frame holds the painted board; stats on the top rail, build tray and wave horn on the bottom rail. */
:root{
  --walnut:#1c140e;
  --plank:#2b2017;
  --plank-hi:#3e2f22;
  --bone:#f1e5cb;
  --bone-dim:#b9a888;
  --gold:#f0b23a;
  --gold-deep:#9c6a17;
  --gold-ink:#2a1a08;
  --blood:#e0604a;
  --frost:#9bdcf0;
  --shade:rgba(0,0,0,.45);
  --veil:rgba(16,10,6,.6);
  --grain:rgba(255,235,200,.018);
  --display:"Grenze Gotisch","UnifrakturCook",Georgia,serif;
  --ui:"Grenze",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--walnut)}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;background:var(--walnut);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--grain) 9px 11px);
  color:var(--bone);font-family:var(--ui);font-size:15px;
  overflow-x:hidden;overflow-y:auto;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;max-width:1180px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;flex:none}
.brand{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(23px,3.4vw,32px);line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--gold-ink);text-wrap:balance}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 8px;border-radius:999px;background:var(--plank);border:1px solid var(--plank-hi);font-size:16px;font-variant-numeric:tabular-nums}
.stat b{font-weight:700}
.stat svg{width:16px;height:16px;flex:none}
.i-heart{fill:var(--blood)}
.i-coin{fill:var(--gold);stroke:var(--gold-deep);stroke-width:1.4}
.i-coin-in{fill:none;stroke:var(--gold-deep);stroke-width:1.2}
.i-pole{stroke:var(--bone-dim);stroke-width:1.6;fill:none}
.i-pen{fill:var(--frost)}

.board{position:relative;flex:1 1 0;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{display:block;border-radius:6px;box-shadow:0 0 0 3px var(--plank-hi),0 0 0 7px var(--plank),0 12px 28px var(--shade);touch-action:manipulation;cursor:pointer}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--veil)}
.card{width:100%;max-width:340px;background:var(--plank);border:1px solid var(--plank-hi);border-radius:12px;padding:22px 20px 18px;text-align:center;box-shadow:0 18px 40px var(--shade)}
.card h2{margin:0 0 8px;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--gold);text-wrap:balance}
.card p{margin:0 0 16px;font-size:16px;line-height:1.4;color:var(--bone);text-wrap:pretty}
.ov-btns{display:flex;flex-direction:column;gap:8px}

.hint,.dock,.actions{width:100%;max-width:720px;align-self:center;flex:none}
.hint{margin:0;height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.3;color:var(--bone-dim);text-wrap:balance}
.hint.warn{color:var(--blood)}

.dock{height:74px}
.tray{height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tool{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;border-radius:10px;background:var(--plank);border:1px solid var(--plank-hi);color:var(--bone);font:inherit;cursor:pointer}
.tool .ico{width:34px;height:34px;display:block}
.tool .nm{max-width:100%;font-size:13px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .cost{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.tool .cost::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1px var(--gold-deep)}
.tool[aria-pressed="true"]{background:var(--plank-hi);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tool.poor .cost{color:var(--blood)}
.tool.poor .ico{opacity:.55}
.tool .key{position:absolute;top:3px;left:6px;font-size:11px;color:var(--bone-dim);display:none}
@media (hover:hover) and (pointer:fine){.tool .key{display:block}.tool:hover{border-color:var(--gold-deep)}}

.inspect{height:100%;display:flex;gap:6px}
.badge{flex:none;width:60px;display:grid;place-items:center;border-radius:10px;background:var(--plank-hi);border:1px solid var(--gold-deep)}
.badge canvas{width:52px;height:52px;display:block}
.act{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;background:var(--plank);border:1px solid var(--plank-hi);color:var(--bone);font:inherit;cursor:pointer}
.act span{font-size:14px;font-weight:600;line-height:1}
.act b{font-size:15px;font-weight:700;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.act.poor b{color:var(--blood)}
.act.sell b,.act.close b{color:var(--bone)}
.act:disabled{opacity:.5;cursor:default}

.actions{display:flex;gap:6px}
.go{flex:1 1 auto;min-width:0;height:46px;border:0;border-radius:10px;background:var(--gold);color:var(--gold-ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;box-shadow:inset 0 -3px 0 var(--gold-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.go:disabled{background:var(--plank-hi);color:var(--bone-dim);box-shadow:none;cursor:default}
.sq{flex:none;width:52px;height:46px;display:grid;place-items:center;border-radius:10px;background:var(--plank);border:1px solid var(--plank-hi);color:var(--bone);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.sq svg{width:18px;height:18px;fill:var(--bone)}
.plain{height:42px;border-radius:10px;background:transparent;border:1px solid var(--plank-hi);color:var(--bone);font:inherit;font-size:16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:active:not(:disabled){transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){button:active:not(:disabled){transform:none}}
</style>

    <button class="sq" id="pz" type="button" aria-label="Duraklat"></button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), board = $('board');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fineHover = matchMedia('(hover: hover) and (pointer: fine)').matches;

/* ---------- world ---------- */
const COLS = 16, ROWS = 10, MAX_WAVE = 20, BEST_KEY = 'sur-muhafizi-best';
const WAY = [[-1,1],[3,1],[3,6],[6,6],[6,2],[10,2],[10,8],[13,8],[13,4],[15,4]];
const PATH = [];
WAY.forEach((p, i) => {
  if (i === 0) { PATH.push(p.slice()); return; }
  const [a, b] = WAY[i - 1], dx = Math.sign(p[0] - a), dy = Math.sign(p[1] - b);
  let x = a, y = b;
  while (x !== p[0] || y !== p[1]) { x += dx; y += dy; PATH.push([x, y]); }
});
const END = PATH.length - 1;
const GRASS = 0, ROAD = 1, TREE = 2, ROCK = 3, KEEP = 4;
const at = (c, r) => r * COLS + c;
const inside = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
const tile = new Array(COLS * ROWS).fill(GRASS);
const pidx = new Array(COLS * ROWS).fill(-1);
PATH.forEach(([c, r], i) => { if (inside(c, r)) { tile[at(c, r)] = ROAD; pidx[at(c, r)] = i; } });
[[15,3],[15,4],[15,5]].forEach(([c, r]) => tile[at(c, r)] = KEEP);
const TREES = [[0,5],[0,8],[1,9],[5,9],[9,0],[14,0],[15,1],[15,9],[12,5]];
const ROCKS = [[8,5],[4,0],[14,6]];
TREES.forEach(([c, r]) => tile[at(c, r)] = TREE);
ROCKS.forEach(([c, r]) => tile[at(c, r)] = ROCK);

function posAt(d) {
  if (d < 0) d = 0;
  if (d >= END) return { x: PATH[END][0] + .5, y: PATH[END][1] + .5, dx: 1, dy: 0 };
  const i = Math.floor(d), t = d - i, a = PATH[i], b = PATH[i + 1];
  return { x: a[0] + (b[0] - a[0]) * t + .5, y: a[1] + (b[1] - a[1]) * t + .5, dx: b[0] - a[0], dy: b[1] - a[1] };
}

const C = {
  grassA:'#4a7335', grassB:'#56803d', grassC:'#3f662d', tuftA:'#6d9a48', tuftB:'#365a27',
  dirtEdge:'#6b4f30', dirt:'#a8875a', dirtHi:'#c2a172', pebble:'#7d6342',
  stone:'#a29a8b', stoneDk:'#5f584e', stoneHi:'#cbc3b3',
  wood:'#8a5c33', woodDk:'#4d321b', woodHi:'#a9764a',
  leaf:'#2c5426', leafHi:'#3e7334',
  gold:'#f0b23a', blood:'#d9503c', frost:'#9bdcf0', frostDk:'#3b7896',
  ink:'#1a120b', bone:'#f1e5cb', shadow:'rgba(0,0,0,.28)'
};

/* ---------- rules ---------- */
const TOWERS = {
  wall: { name:'Duvar', short:'Duvar', cost:30, road:true,
    lv:[{hp:180},{hp:400,up:45},{hp:760,up:80}],
    blurb:'Yola örülür; yerdeki düşmanlar yıkana kadar bekler. Yarasalar üstünden uçar.' },
  archer: { name:'Okçu Kulesi', short:'Okçu', cost:50, air:true,
    lv:[{dmg:11,range:2.5,rate:.6},{dmg:19,range:2.8,rate:.5,up:60},{dmg:32,range:3.1,rate:.4,up:110}],
    blurb:'Hızlı ok atar, uçanları da vurur. Çimene kurulur.' },
  frost: { name:'Buz Büyücüsü', short:'Büyücü', cost:75, air:true,
    lv:[{dmg:6,range:2.3,rate:1,slow:.35,splash:.7},{dmg:10,range:2.6,rate:.9,slow:.45,splash:.8,up:80},{dmg:16,range:2.9,rate:.8,slow:.55,splash:.95,up:130}],
    blurb:'Buz küresi çarptığı grubu yavaşlatır. Çimene kurulur.' },
  catapult: { name:'Mancınık', short:'Mancınık', cost:100, air:false,
    lv:[{dmg:34,range:3,rate:2.3,splash:.95},{dmg:56,range:3.3,rate:2.05,splash:1.05,up:110},{dmg:90,range:3.6,rate:1.8,splash:1.2,up:170}],
    blurb:'Kalabalığa taş atar, zırhı deler. Uçanlara atamaz.' },
  mine: { name:'Altın Ocağı', short:'Ocak', cost:120,
    lv:[{income:14},{income:26,up:100},{income:40,up:150}],
    blurb:'Her dalganın sonunda ek altın getirir. Çimene kurulur.' }
};
const ORDER = ['wall','archer','frost','catapult','mine'];

const FOES = {
  goblin:  { word:'goblin',  hp:38,  sp:1.55, gold:4,  lives:1,  bite:9,  r:.2,  col:'#7cb342' },
  ork:     { word:'ork',     hp:105, sp:1.05, gold:9,  lives:2,  bite:20, r:.27, col:'#557a3d' },
  kurt:    { word:'kurt',    hp:30,  sp:2.5,  gold:5,  lives:1,  bite:7,  r:.21, col:'#8a8580' },
  yarasa:  { word:'yarasa',  hp:45,  sp:1.8,  gold:7,  lives:1,  fly:true, r:.19, col:'#5f4485' },
  sovalye: { word:'şövalye', hp:210, sp:.8,   gold:15, lives:3,  bite:28, r:.27, armor:7, col:'#c4c8cf' },
  dev:     { word:'dev',     hp:700, sp:.55,  gold:90, lives:10, bite:80, r:.4,  armor:4, col:'#9a5a3c' }
};
const INTRO = { 1:'Goblinler ormandan çıktı', 2:'Orklar da yola düştü', 4:'Kurt sürüsü: çok hızlılar', 5:'Bir Dağ Devi yaklaşıyor', 6:'Yarasalar duvarın üstünden uçar', 8:'Zırhlı şövalyeler: mancınık zırhı deler', 10:'Dev geri döndü', 15:'Devler öfkeli', 20:'Son dalga!' };
const hpMul = w => 1 + .13 * (w - 1) + .011 * (w - 1) ** 2;

function waveList(w) {
  const L = [];
  const grp = (type, n, gap) => {
    if (n <= 0) return;
    if (L.length) L[L.length - 1][1] += .9;
    for (let i = 0; i < n; i++) L.push([type, gap]);
  };
  grp('goblin', 5 + Math.ceil(w * 1.2), .72);
  if (w >= 2) grp('ork', Math.floor(w * .7), 1.05);
  if (w >= 4) grp('kurt', 2 + Math.floor(w / 2), .3);
  if (w >= 6) grp('yarasa', 2 + Math.floor((w - 4) / 1.5), .55);
  if (w >= 8) grp('sovalye', 1 + Math.floor((w - 7) / 1.5), 1.3);
  if (w % 5 === 0) grp('dev', Math.max(1, Math.floor(w / 10)), 2.4);
  return L;
}

/* ---------- state ---------- */
const occ = new Array(COLS * ROWS).fill(null);
function fresh() {
  return { gold:180, lives:20, wave:0, time:0, enemies:[], towers:[], walls:[], projs:[], fx:[], texts:[],
    queue:[], alive:{}, speed:1, paused:false, over:null, endless:false,
    build:null, sel:null, ghost:null, hover:null, ptr: fineHover ? 'mouse' : 'touch',
    announce:null, flash:null, castleHit:0 };
}
let S = fresh();

/* ---------- helpers ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); }
function tri(g, a, b, c, d, e, f) { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.closePath(); }
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');

/* ---------- layout ---------- */
let T = 40, cw = 640, ch = 400, dpr = 1, portrait = false, bg = null;
const toS = (x, y) => portrait ? [y * T, x * T] : [x * T, y * T];
const sAng = (dx, dy) => portrait ? Math.atan2(dx, dy) : Math.atan2(dy, dx);

function layout() {
  const W = board.clientWidth - 16, H = board.clientHeight - 16;
  if (W <= 0 || H <= 0) return;
  const tL = Math.min(W / COLS, H / ROWS), tP = Math.min(W / ROWS, H / COLS);
  portrait = tP > tL * 1.05;
  T = Math.max(10, Math.floor(portrait ? tP : tL));
  cw = (portrait ? ROWS : COLS) * T; ch = (portrait ? COLS : ROWS) * T;
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  buildBg();
}

function castleRect() {
  const a = toS(15, 3), b = toS(16, 6);
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])];
}

function buildBg() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const g = bg.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = rng(1337);
  g.fillStyle = C.grassA; g.fillRect(0, 0, cw, ch);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const [x, y] = toS(c, r), v = rnd();
    g.globalAlpha = .5; g.fillStyle = v < .34 ? C.grassB : v < .67 ? C.grassA : C.grassC;
    g.fillRect(x, y, T + .5, T + .5);
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 70; i++) {
    const x = rnd() * cw, y = rnd() * ch, rad = T * (.6 + rnd() * 1.4);
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, rnd() < .5 ? 'rgba(160,200,95,.16)' : 'rgba(18,38,14,.2)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.lineCap = 'round'; g.lineWidth = Math.max(1, T * .035);
  for (let i = 0; i < COLS * ROWS * 4; i++) {
    const x = rnd() * cw, y = rnd() * ch, h = T * (.06 + rnd() * .07);

/* ---------- render ---------- */

      g.strokeStyle = C.gold; g.lineWidth = Math.max(1, T * .025); g.beginPath(); g.moveTo(-T * .16, 0); g.lineTo(-T * .2, -T * .04); g.moveTo(-T * .16, 0); g.lineTo(-T * .2, T * .04); g.stroke();
      g.restore();
    } else if (p.k === 'frost') {
      const [x, y] = toS(p.x, p.y);
      const gr = g.createRadialGradient(x, y, 0, x, y, T * .18);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(.35, C.frost); gr.addColorStop(1, 'rgba(155,220,240,0)');
      g.fillStyle = gr; circ(g, x, y, T * .18); g.fill();
    }
  }

  for (const f of S.fx) {
    const [x, y] = toS(f.x, f.y), u = f.t / f.life;
    if (f.k === 'ring') {
      g.globalAlpha = 1 - u; g.strokeStyle = f.col; g.lineWidth = Math.max(1.5, T * .05 * (1 - u));
      circ(g, x, y, T * f.r * (.3 + .7 * u)); g.stroke(); g.globalAlpha = 1;
    } else {
      g.globalAlpha = 1 - u * .7; g.fillStyle = f.col; circ(g, x, y, T * f.size * (1 - u * .6)); g.fill(); g.globalAlpha = 1;
    }
  }

  // banner over the keep
  {
    const [x, y] = toS(15.5, 4.5), ph = T * .55, fw = T * .4, fh = T * .22, wv = reduce ? 0 : 1;
    g.strokeStyle = C.woodDk; g.lineWidth = Math.max(1.5, T * .045); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - ph); g.stroke();
    g.fillStyle = C.blood; g.beginPath(); g.moveTo(x, y - ph);
    for (let i = 0; i <= 8; i++) { const u = i / 8; g.lineTo(x + fw * u, y - ph + Math.sin(rt * 5 + u * 4) * T * .035 * u * wv); }
    for (let i = 8; i >= 0; i--) { const u = i / 8; g.lineTo(x + fw * u - (i === 8 ? fw * .18 : 0), y - ph + fh + Math.sin(rt * 5 + u * 4) * T * .035 * u * wv); }
    g.closePath(); g.fill();
    g.fillStyle = C.gold; circ(g, x + fw * .4, y - ph + fh / 2 + Math.sin(rt * 5 + 1.6) * T * .014 * wv, T * .045); g.fill();
  }
  if (S.castleHit > 0) { const [x0, y0, w, h] = castleRect(); g.fillStyle = `rgba(224,72,50,${S.castleHit * .9})`; rr(g, x0 + T * .1, y0 + T * .1, w - T * .2, h - T * .2, T * .1); g.fill(); }

  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';

  if (S.paused && !S.over) {

    g.font = `800 ${f1}px "Grenze Gotisch", Georgia, serif`; g.lineWidth = f1 * .12; g.strokeStyle = 'rgba(20,12,6,.9)';
    g.strokeText('Mola', cw / 2, ch / 2); g.fillStyle = C.gold; g.fillText('Mola', cw / 2, ch / 2);
    const f2 = Math.max(13, Math.min(cw * .04, 18));
    g.font = `600 ${f2}px Grenze, Georgia, serif`; g.fillStyle = C.bone;
    g.fillText('Kurmaya devam edebilirsin', cw / 2, ch / 2 + f1 * .7, cw * .9);

      const f1 = Math.min(cw * .11, 50), y = ch * .2;
      g.globalAlpha = a;
      g.font = `800 ${f1}px "Grenze Gotisch", Georgia, serif`; g.lineWidth = f1 * .14; g.strokeStyle = 'rgba(20,12,6,.88)';
      g.strokeText(A.title, cw / 2, y, cw * .92); g.fillStyle = C.gold; g.fillText(A.title, cw / 2, y, cw * .92);

        g.strokeText(A.sub, cw / 2, y + f1 * .72, cw * .92); g.fillStyle = C.bone; g.fillText(A.sub, cw / 2, y + f1 * .72, cw * .92);

}

/* ---------- DOM ---------- */
const tray = $('tray'), inspect = $('inspect'), hint = $('hint'), insIco = $('insIco');
const sLives = $('sLives'), sGold = $('sGold'), sWave = $('sWave');
const bUp = $('bUp'), bUpV = $('bUpV'), bFix = $('bFix'), bFixV = $('bFixV'), bSell = $('bSell'), bSellV = $('bSellV');
const goBtn = $('go'), spdBtn = $('spd'), pzBtn = $('pz');
const ov = $('ov'), ovT = $('ovT'), ovP = $('ovP'), ovA = $('ovA'), ovB = $('ovB');
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2.5" width="3.6" height="11" rx="1"/><rect x="9.4" y="2.5" width="3.6" height="11" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>';

const toolEls = {};
ORDER.forEach((k, i) => {
  const d = TOWERS[k], b = document.createElement('button');
  b.className = 'tool'; b.type = 'button'; b.id = 'tool-' + k; b.setAttribute('aria-pressed', 'false');
  b.title = `${d.name} (${i + 1})`;
  b.innerHTML = `<span class="key">${i + 1}</span><canvas class="ico" width="68" height="68"></canvas><span class="nm">${d.short}</span><span class="cost">${d.cost}</span>`;
  b.addEventListener('click', () => pickBuild(k));
  tray.appendChild(b); toolEls[k] = b;
  const g = b.querySelector('canvas').getContext('2d');
  drawTower(g, k, 34, 36, 62, { lvl:0, ang:-Math.PI / 4, loaded:true, ready:true, icon:true, t:1 });
});

const set = (el, v) => { v = String(v); if (el._v !== v) { el._v = v; el.textContent = v; } };
const prop = (el, k, v) => { if (el[k] !== v) el[k] = v; };

function infoText(t) {
  const d = TOWERS[t.type], L = d.lv[t.lvl], n = t.lvl < 2 ? d.lv[t.lvl + 1] : null;
  const head = `${d.name} · Sv. ${t.lvl + 1}/3 — `;
  let body = '', nx = '';
  switch (t.type) {
    case 'wall': body = `dayanıklılık ${Math.ceil(t.hp)}/${t.max}`; nx = n && `${n.hp}, tam onarır`; break;
    case 'archer': body = `hasar ${L.dmg}, menzil ${fmt(L.range)}, ${fmt(1 / L.rate)} ok/sn`; nx = n && `hasar ${n.dmg}, menzil ${fmt(n.range)}`; break;
    case 'frost': body = `hasar ${L.dmg}, %${Math.round(L.slow * 100)} yavaşlatma, menzil ${fmt(L.range)}`; nx = n && `%${Math.round(n.slow * 100)}, menzil ${fmt(n.range)}`; break;
    case 'catapult': body = `alan hasarı ${L.dmg}, menzil ${fmt(L.range)}`; nx = n && `hasar ${n.dmg}, menzil ${fmt(n.range)}`; break;
    case 'mine': body = `dalga başına +${L.income} altın`; nx = n && `+${n.income}`; break;

  return head + body + (nx ? ` · sonraki: ${nx}` : ' · en üst seviye');
}
function hintText() {
  if (S.flash && S.flash.t > 0) return [S.flash.msg, S.flash.warn];
  if (S.over) return [S.over === 'win' ? 'Kale ayakta kaldı.' : 'Surlar yıkıldı.', false];
  if (S.sel) return [infoText(S.sel), false];
  if (S.build) {
    const d = TOWERS[S.build];
    if (S.ptr !== 'mouse' && S.ghost) {
      const why = whyNot(S.build, S.ghost.c, S.ghost.r);
      return [why || `${d.name}: kurmak için aynı kareye tekrar dokun.`, !!why];
    }
    return [`${d.name} · ${d.blurb}`, false];
  }
  if (S.wave === 0 && !S.towers.length) return ['Aşağıdan bir yapı seç ve haritaya kur. Hazır olunca dalgayı başlat.', false];
  if (S.wave === 0) return ['Hazır olunca dalgayı başlat. Düşmanlar soldaki mağaradan çıkar.', false];
  return [fineHover ? 'Bir kuleye tıkla: yükselt, onar ya da sat. Kısayollar: 1–5, Boşluk, P, F.' : 'Bir kuleye dokun: yükselt, onar ya da sat.', false];
}

function ui() {
  set(sLives, S.lives); set(sGold, S.gold);
  set(sWave, S.endless ? S.wave : `${S.wave}/${MAX_WAVE}`);
  for (const k of ORDER) {
    const el = toolEls[k], poor = S.gold < TOWERS[k].cost;
    if (el._p !== poor) { el._p = poor; el.classList.toggle('poor', poor); }
    const pr = String(S.build === k); if (el._pr !== pr) { el._pr = pr; el.setAttribute('aria-pressed', pr); }
  }
  const sel = S.sel;
  prop(tray, 'hidden', !!sel); prop(inspect, 'hidden', !sel);
  if (sel) {
    const d = TOWERS[sel.type], key = sel.type + sel.lvl;
    if (insIco._k !== key) {
      insIco._k = key; const g = insIco.getContext('2d'); g.clearRect(0, 0, 104, 104);
      drawTower(g, sel.type, 52, 50, 92, { lvl:sel.lvl, ang:-Math.PI / 4, loaded:true, ready:true, t:1 });
    }
    const n = sel.lvl < 2 ? d.lv[sel.lvl + 1] : null;
    set(bUpV, n ? n.up : 'Tam');
    prop(bUp, 'disabled', !n || S.gold < n.up);
    const poorUp = !!n && S.gold < n.up; if (bUp._p !== poorUp) { bUp._p = poorUp; bUp.classList.toggle('poor', poorUp); }
    const isWall = sel.type === 'wall';
    prop(bFix, 'hidden', !isWall);
    if (isWall) { const rc = repairCost(sel); set(bFixV, rc || 'Sağlam'); prop(bFix, 'disabled', !rc || S.gold < rc); }
    set(bSellV, '+' + Math.floor(sel.spent * .6));
  }
  let label, dis = false;
  if (S.over) { label = 'Oyun bitti'; dis = true; }
  else if (S.queue.length) { label = `Dalga ${S.wave} geliyor…`; dis = true; }
  else if (!S.endless && S.wave >= MAX_WAVE) { label = 'Son dalga sahada'; dis = true; }
  else if (S.enemies.length) label = `Dalga ${S.wave + 1} · Erken çağır +15`;
  else label = `Dalga ${S.wave + 1} · Başlat`;
  set(goBtn, label); prop(goBtn, 'disabled', dis);
  set(spdBtn, `${S.speed}×`);
  const pz = S.paused ? 'play' : 'pause';
  if (pzBtn._v !== pz) { pzBtn._v = pz; pzBtn.innerHTML = S.paused ? ICON_PLAY : ICON_PAUSE; pzBtn.setAttribute('aria-label', S.paused ? 'Devam et' : 'Duraklat'); }
  const [h, warn] = hintText(); set(hint, h);
  if (hint._w !== warn) { hint._w = warn; hint.classList.toggle('warn', warn); }
}

function saveBest(n) {
  try { const b = +localStorage.getItem(BEST_KEY) || 0; if (n > b) localStorage.setItem(BEST_KEY, String(n)); return Math.max(b, n); }
  catch (_) { return n; }
}
function gameOver(kind) {
  if (S.over) return;
  S.over = kind; S.build = null; S.sel = null; S.ghost = null;
  if (kind === 'lose') {
    const best = saveBest(S.wave);
    ovT.textContent = 'Kale düştü';
    ovP.textContent = `Surlar ${S.wave}. dalgada yıkıldı. En iyi rekorun: ${best}. dalga.`;
    ovA.textContent = 'Yeniden başla'; ovB.hidden = true;
  } else {
    saveBest(S.wave);
    ovT.textContent = 'Kale ayakta!';
    ovP.textContent = `${MAX_WAVE} dalganın hepsini püskürttün, ${S.lives} canın kaldı. İstersen giderek zorlaşan dalgalarla devam et.`;
    ovA.textContent = 'Sonsuz modda devam et'; ovB.textContent = 'Yeniden başla'; ovB.hidden = false;
  }
  ov.hidden = false; ovA.focus();
}
function restart() {
  S = fresh(); occ.fill(null); ov.hidden = true;
}
ovA.addEventListener('click', () => {
  if (S.over === 'win') { S.endless = true; S.over = null; ov.hidden = true; }
  else restart();
});
ovB.addEventListener('click', restart);

goBtn.addEventListener('click', startWave);
spdBtn.addEventListener('click', () => { S.speed = S.speed === 3 ? 1 : S.speed + 1; });
pzBtn.addEventListener('click', () => { if (!S.over) S.paused = !S.paused; });
bUp.addEventListener('click', () => upgrade(S.sel));
bFix.addEventListener('click', () => repair(S.sel));
bSell.addEventListener('click', () => sell(S.sel));
$('bClose').addEventListener('click', () => select(null));

function cellAt(e) {
  const r = cv.getBoundingClientRect(), sx = (e.clientX - r.left) / T, sy = (e.clientY - r.top) / T;
  return portrait ? { c:Math.floor(sy), r:Math.floor(sx) } : { c:Math.floor(sx), r:Math.floor(sy) };
}
function tap({ c, r }) {
  if (S.over) return;
  const k = inside(c, r) ? at(c, r) : -1, there = k >= 0 ? occ[k] : null;
  if (S.build) {
    if (there) { select(there); return; }
    if (k < 0) return;
    if (S.ptr !== 'mouse' && !(S.ghost && S.ghost.c === c && S.ghost.r === r)) { S.ghost = { c, r }; S.flash = null; return; }
    const why = whyNot(S.build, c, r);
    if (why) { flash(why, true); return; }
    build(S.build, c, r); S.ghost = null;
    return;
  }
  if (there) { select(S.sel === there ? null : there); return; }
  select(null);
}
let down = null;
cv.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY }; });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { S.ptr = 'mouse'; S.hover = cellAt(e); } });
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointercancel', () => { down = null; });
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 12) return;
  S.ptr = e.pointerType === 'mouse' ? 'mouse' : 'touch';
  tap(cellAt(e));
});

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!ov.hidden) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); startWave(); }
  else if (k === 'p') { if (!S.over) S.paused = !S.paused; }
  else if (k === 'f') { S.speed = S.speed === 3 ? 1 : S.speed + 1; }
  else if (k >= '1' && k <= '5') pickBuild(ORDER[+k - 1]);
  else if (k === 'escape') { S.build = null; S.sel = null; S.ghost = null; }
  else if (k === 'u') upgrade(S.sel);
  else if (k === 's') sell(S.sel);
  else if (k === 'r') repair(S.sel);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !S.over && (S.queue.length || S.enemies.length)) S.paused = true;
});

/* ---------- boot ---------- */
function snapshot() {
  return { v:1, gold:S.gold, lives:S.lives, wave:S.wave, endless:S.endless, speed:S.speed, over:S.over,
    towers:S.towers.map(t => ({ type:t.type, c:t.c, r:t.r, lvl:t.lvl, spent:t.spent, hp:t.hp })) };
}
function start(data) {
  restart();
  if (data && data.v === 1 && Array.isArray(data.towers) && !data.over) {
    S.gold = data.gold; S.lives = data.lives; S.wave = data.wave; S.endless = !!data.endless; S.speed = data.speed || 1;
    for (const s of data.towers) {
      if (!TOWERS[s.type] || !inside(s.c, s.r) || occ[at(s.c, s.r)]) continue;
      const t = build(s.type, s.c, s.r, true);
      t.lvl = s.lvl || 0; t.spent = s.spent || TOWERS[s.type].cost;
      if (t.type === 'wall') { t.max = TOWERS.wall.lv[t.lvl].hp; t.hp = Math.min(t.max, s.hp || t.max); }
    }
  }
  layout();
  new ResizeObserver(() => layout()).observe(board);
  let last = performance.now();
  const frame = now => {
    const rdt = Math.min(.05, (now - last) / 1000); last = now;
    if (!S.paused && !S.over) {
      const total = rdt * S.speed, n = Math.max(1, Math.ceil(total / .02));
      for (let i = 0; i < n && !S.over; i++) update(total / n);
    } else if (S.over) updateFx(rdt);
    if (S.flash) { S.flash.t -= rdt; if (S.flash.t <= 0) S.flash = null; }
    if (S.announce) S.announce.t += rdt;
    render(now / 1000);
    ui();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(snapshot);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
