<style>
/* Layout: chart-plotter style. The sea is a framed display; lesson card, instruments and helm sit beneath it (beside it on wide screens). */
:root{
  --bg:#0b161d;
  --panel:#122029;
  --panel-2:#182b36;
  --line:#284050;
  --text:#e7eff2;
  --muted:#94aab4;
  --port:#e5484d;
  --stbd:#2fb36d;
  --course:#e04aa8;
  --warn:#f2a93b;
  --buoy:#ff8a1f;
  --sea:#13587a;
  --wind:#9fd3ea;
  --font-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--course);outline-offset:2px}

.app{
  height:100%;display:grid;
  grid-template-areas:"lesson" "sea" "inst" "ctrl";
  grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:8px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.side{display:contents}
.lesson{grid-area:lesson}.sea{grid-area:sea}.inst{grid-area:inst}.ctrl{grid-area:ctrl}

/* Lesson card */
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.lesson-top{display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{display:block}
.lesson-title{min-width:0;flex:1;display:grid;gap:1px}
.kicker{font:600 11px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.ltitle{font:700 20px/1.1 var(--font-display);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-box{display:grid;gap:7px}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.dots i.done{background:var(--stbd)}
.dots i.cur::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--course);transition:width .15s linear}
.step{display:flex;gap:10px;align-items:flex-start;min-width:0}
.step-count{flex:none;font:700 13px/1.3 var(--font-display);color:var(--course);border:1px solid var(--course);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.step-text{margin:0;font:500 15px/1.4 var(--font-body);color:var(--text);min-width:0}
.free-box{display:grid;gap:6px}

/* Sea */
.sea{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
#sea{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,10px);opacity:0;max-width:calc(100% - 24px);width:max-content;background:rgba(8,20,28,.94);border:1px solid var(--line);color:var(--text);font:600 14px/1.35 var(--font-body);padding:8px 14px;border-radius:10px;text-align:center;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{border-color:var(--warn);color:#ffd9a0}
.toast.good{border-color:var(--stbd);color:#bff0d3}

/* Instruments */
.inst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cell{background:var(--panel);padding:7px 9px;display:grid;gap:1px;align-content:start;min-width:0}
.k{font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font:700 22px/1.1 var(--font-display);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.v.txt{font-size:17px;line-height:1.3}
.sub{font:600 11px/1.25 var(--font-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port{color:var(--port)}.stbd{color:var(--stbd)}.ok{color:var(--stbd)}.warn{color:var(--warn)}.bad{color:var(--port)}

/* Controls */
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:10px;min-width:0}
.row{display:grid;gap:4px;min-width:0}
.row-head{display:flex;align-items:center;gap:8px;min-height:28px;min-width:0}
.val{margin-left:auto;font:600 13px var(--font-body);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font:600 11px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.range-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.end{font:600 11px var(--font-body);color:var(--muted);flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:34px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#3f5f70,#9fd3ea)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#3f5f70,#9fd3ea)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--text);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:3px solid var(--panel)}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
.pill-btn{font:700 13px var(--font-body);color:var(--bg);background:var(--text);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pill-btn.active{background:#d93a5b;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:600 12px var(--font-body);color:var(--muted);background:transparent;border:0;padding:4px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
.helm{position:relative;height:60px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);touch-action:none;cursor:grab;overflow:hidden}
.helm:active{cursor:grabbing}
#helmCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chk{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--font-body);color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--course);width:16px;height:16px;margin:0}

/* Modals */
.modal{position:fixed;inset:0;z-index:30;display:flex;overflow:auto;background:rgba(4,10,14,.76);
  padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.modal-card{margin:auto;width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
.modal h2{margin:0;font:700 clamp(28px,6.5vw,36px)/1.05 var(--font-display);text-wrap:balance}
.modal p{margin:0;font:400 15px/1.55 var(--font-body);max-width:65ch}
.modal b{color:#fff;font-weight:600}
.diagram{background:#0e2c3c;border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.steps-list,.recap{margin:0;padding-left:22px;display:grid;gap:5px;font:500 14px/1.45 var(--font-body)}
.steps-list li::marker{color:var(--course);font-weight:700}
.recap li::marker{color:var(--stbd)}
.big-time{font:700 48px/1 var(--font-display)!important;font-variant-numeric:tabular-nums}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;font:700 17px/1.1 var(--font-display);background:var(--text);color:var(--bg);border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lesson-list button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);cursor:pointer}
.lesson-list button.current{border-color:var(--course)}
.li-num{flex:none;width:24px;font:700 20px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.li-body{display:grid;min-width:0}
.li-title{font:600 15px/1.25 var(--font-body)}
.li-sub{font:400 12px/1.3 var(--font-body);color:var(--muted)}
.li-tick{margin-left:auto;flex:none;font:600 12px var(--font-body);color:var(--stbd)}

/* Diagrams */
.dg{display:block;width:100%;height:auto;min-width:280px}
.dg *{vector-effect:non-scaling-stroke}
.dg text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.dg .t-strong{fill:var(--text);font-weight:600}
.dg .t-port{fill:var(--port);font-weight:600}
.dg .t-stbd{fill:var(--stbd);font-weight:600}
.dg .t-course{fill:var(--course);font-weight:600}
.dg .t-wind{fill:var(--wind);font-weight:600}
.dg .hull{fill:#f3f6f7;stroke:#8fa5b0;stroke-width:1}
.dg .boom{stroke:#cfd8dc;stroke-width:2.2;stroke-linecap:round;fill:none}
.dg .sail{fill:rgba(250,252,253,.85);stroke:#a9bcc5;stroke-width:.8}
.dg .wind{stroke:var(--wind);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .wind-head{fill:var(--wind)}
.dg .nogo{fill:rgba(229,72,77,.18);stroke:rgba(229,72,77,.7);stroke-width:1}
.dg .path{fill:none;stroke:var(--course);stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
.dg .path-solid{fill:none;stroke:var(--course);stroke-width:2.2;stroke-linecap:round}
.dg .lay{fill:none;stroke:var(--course);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.dg .buoy{fill:var(--buoy);stroke:#c45f0c;stroke-width:1}
.dg .buoy-b{fill:#ffd23f;stroke:#b8921a;stroke-width:1}
.dg .arrow{fill:none;stroke:var(--warn);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dg .arrow-head{fill:var(--warn)}
.dg .tiller{stroke:#c08a52;stroke-width:3;stroke-linecap:round}
.dg .rudder{stroke:#e7eff2;stroke-width:3.5;stroke-linecap:round}
.dg .faint{opacity:.35}
.dg .spin{fill:#d93a5b;stroke:#f3f6f7;stroke-width:1}
.dg .bad{stroke:var(--port);stroke-width:2.5;stroke-linecap:round;fill:none}
.dg .good{stroke:var(--stbd);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dg .divider{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}

/* Wide screens and landscape phones: sea left, panel right */
@media (min-aspect-ratio: 5/4){
  .app{grid-template-areas:"sea side";grid-template-columns:minmax(0,1fr) clamp(300px,32vw,380px);grid-template-rows:minmax(0,1fr);column-gap:14px}
  .side{display:flex;flex-direction:column;gap:10px;grid-area:side;overflow:auto;min-height:0}
  .inst{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  .toast,.dots i.cur::after{transition:none}
}
</style>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const hyp = Math.hypot;
const w180 = a => { a = ((a + 180) % 360 + 360) % 360; return a - 180; };
const w360 = a => ((a % 360) + 360) % 360;
const fmt1 = v => v.toFixed(1).replace('.', ',');
const f = n => (+n).toFixed(1);
const fmtTime = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const KN = 9;      // dünya birimi / (knot·saniye)
const UPM = 11;    // dünya birimi / metre
const REACH = 55;  // şamandıraya varış yarıçapı

const WIND_NAMES = [
  ['Yıldız', 'kuzeyden'], ['Poyraz', 'kuzeydoğudan'], ['Gündoğusu', 'doğudan'], ['Keşişleme', 'güneydoğudan'],
  ['Kıble', 'güneyden'], ['Lodos', 'güneybatıdan'], ['Günbatısı', 'batıdan'], ['Karayel', 'kuzeybatıdan']
];
const windName = dir => WIND_NAMES[Math.round(w360(dir) / 45) % 8];

const POINTS = { olu: 'Ölü bölge', orsa: 'Orsa', darapaz: 'Dar apaz', apaz: 'Apaz', genis: 'Geniş apaz', pupa: 'Pupa' };
const POINT_SUB = { olu: '42° altı', orsa: '~45°', darapaz: '~60°', apaz: '~90°', genis: '~135°', pupa: '~180°' };
function pointOf(twa) {
  if (twa < 42) return 'olu';
  if (twa < 58) return 'orsa';
  if (twa < 78) return 'darapaz';
  if (twa < 103) return 'apaz';
  if (twa < 152) return 'genis';
  return 'pupa';
}
const POLAR = [[0, 0], [35, 0], [42, .5], [50, .72], [60, .82], [90, 1], [120, .97], [150, .84], [180, .74]];
function polar(t) {
  for (let i = 1; i < POLAR.length; i++) {
    if (t <= POLAR[i][0]) { const a = POLAR[i - 1], b = POLAR[i]; return lerp(a[1], b[1], (t - a[0]) / (b[0] - a[0])); }
  }
  return .74;
}

/* ---------- Ders çizimleri (SVG) ---------- */
const S_HULL = 'M0,-20 C7,-14 8,4 6,20 L-6,20 C-8,4 -7,-14 0,-20 Z';
function arrowHead(x1, y1, x2, y2, cls, size) {
  size = size || 7;
  const a = Math.atan2(y2 - y1, x2 - x1);
  const p1 = [x2 - Math.cos(a - 0.45) * size, y2 - Math.sin(a - 0.45) * size];
  const p2 = [x2 - Math.cos(a + 0.45) * size, y2 - Math.sin(a + 0.45) * size];
  return `<path class="${cls}" d="M${f(x2)},${f(y2)} L${f(p1[0])},${f(p1[1])} L${f(p2[0])},${f(p2[1])} Z"/>`;
}
function svgWind(x1, y1, x2, y2, label, lx, ly) {
  return `<line class="wind" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>${arrowHead(x1, y1, x2, y2, 'wind-head', 8)}` +
    (label ? `<text x="${lx}" y="${ly}" class="t-wind">${label}</text>` : '');
}
// Tekne yukarı bakar; boom: derece, + sancak (sağ)
function svgBoat(x, y, rot, sc, boom, opts) {
  opts = opts || {};
  let s = `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"${opts.cls ? ` class="${opts.cls}"` : ''}><path class="hull" d="${S_HULL}"/>`;
  if (boom != null) {
    const bl = 22, a = boom * D2R, mx = 0, my = -7;
    const ex = mx + Math.sin(a) * bl, ey = my + Math.cos(a) * bl;
    const side = boom >= 0 ? 1 : -1;
    const qx = (mx + ex) / 2 + Math.cos(a) * 5 * side, qy = (my + ey) / 2 - Math.sin(a) * 5 * side;
    s += `<path class="sail" d="M${mx},${my} Q${f(qx)},${f(qy)} ${f(ex)},${f(ey)} Z"/><line class="boom" x1="${mx}" y1="${my}" x2="${f(ex)}" y2="${f(ey)}"/>`;
  }
  if (opts.extra) s += opts.extra;
  return s + '</g>';
}
function svgWrap(vb, label, inner) {
  return `<svg class="dg" viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;
}

function sideChanged(twa) {

  } else {

function physics(dt) {
  const b = G.boat, w = G.wind;
  // dümen girdisi
  const keyU = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);

  const uT = G.wheel ? helmPos : -helmPos;
  b.u += (uT - b.u) * Math.min(1, 10 * dt);

  // rüzgâr salınımı
  if (w.shift) {
    w.dir = w360(w.base + Math.sin(G.t * .07) * 7 + Math.sin(G.t * .19 + 1.3) * 3);
    w.spd = w.baseSpd * (1 + .12 * Math.sin(G.t * .23) + .06 * Math.sin(G.t * .61 + .4));
  } else { w.dir = w.base; w.spd = w.baseSpd; }

  const aws = hyp(ax, ay) || .0001;

  // en iyi bom açısı ve otomatik trim
  const dopt = awa > 145 ? 85 : clamp(awa - 20, 5, 85);
  if (G.auto) { const sT = clamp((88 - dopt) / 84, 0, 1); b.sheet += (sT - b.sheet) * Math.min(1, 2.5 * dt); }

  // bom
  let side = b.boomSide;

  const dmax = lerp(88, 4, b.sheet);

  const j0 = Math.floor((G.cam.y - hh) / C), j1 = Math.floor((G.cam.y + hh) / C);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = 0; k < 2; k++) {
    const r1 = hash(i, j, k * 3 + 1), r2 = hash(i, j, k * 3 + 2), r3 = hash(i, j, k * 3 + 3);
    const bob = Math.sin(G.t * .8 + r3 * 6) * 2;
    const x = (i + r1) * C + wx * bob, y = (j + r2) * C + wy * bob, s = 7 + r3 * 7;
    ctx.globalAlpha = .06 + .08 * r3;
    ctx.beginPath();
    ctx.moveTo(x - px * s, y - py * s);
    ctx.quadraticCurveTo(x - px * s * .5 + wx * s * .45, y - py * s * .5 + wy * s * .45, x, y);
    ctx.quadraticCurveTo(x + px * s * .5 + wx * s * .45, y + py * s * .5 + wy * s * .45, x + px * s, y + py * s);
    ctx.stroke();
  }

}

function drawStreaks() {
  const w = G.wind, to = (w.dir + 180) * D2R, vx = Math.sin(to), vy = -Math.cos(to);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 / G.zoom; ctx.lineCap = 'round';

    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - vx * s.len, s.y - vy * s.len); ctx.stroke();
  }

}

function drawTrail() {
  const tr = G.trail; if (tr.length < 2) return;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#ffffff';
  for (let i = 1; i < tr.length; i++) {

    ctx.globalAlpha = k * .3; ctx.lineWidth = 2 + k * 5;
    ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();

  ctx.globalAlpha = 1;

function targetMarkObj() { const i = G.targetMark; const m = i >= 0 ? G.marks[i] : null; return m && !m.done ? m : null; }

function drawLayLines() {
  if (!G.layLines) return;
  const m = targetMarkObj(); if (!m) return;
  const brg = Math.atan2(m.x - G.boat.x, -(m.y - G.boat.y)) / D2R;
  if (Math.abs(w180(brg - G.wind.dir)) > 60) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(224,74,168,.55)'; ctx.lineWidth = 1.5 / G.zoom; ctx.setLineDash([12 / G.zoom, 10 / G.zoom]);
  for (const s of [-1, 1]) {

    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + Math.sin(a) * 1600, m.y - Math.cos(a) * 1600); ctx.stroke();

}

function drawCourseLine() {
  const m = targetMarkObj(); if (!m) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(224,74,168,.85)'; ctx.lineWidth = 2 / G.zoom; ctx.setLineDash([10 / G.zoom, 8 / G.zoom]);
  ctx.lineDashOffset = -G.t * 18 / G.zoom;
  ctx.beginPath(); ctx.moveTo(G.boat.x, G.boat.y); ctx.lineTo(m.x, m.y); ctx.stroke();
  ctx.restore();
}

function drawMarks() {
  const z = G.zoom;
  G.marks.forEach((m, i) => {
    const tgt = i === G.targetMark && !m.done;
    if (tgt) {
      ctx.save(); ctx.strokeStyle = '#e04aa8'; ctx.lineWidth = 2 / z; ctx.setLineDash([8 / z, 6 / z]); ctx.lineDashOffset = -G.t * 20 / z;
      circle(ctx, m.x, m.y, REACH + Math.sin(G.t * 3) * 3); ctx.stroke(); ctx.restore();
    }
    const fin = m.l === 'B';
    ctx.fillStyle = 'rgba(0,18,28,.3)'; circle(ctx, m.x + 3, m.y + 4, 10); ctx.fill();
    ctx.fillStyle = fin ? '#ffd23f' : '#ff8a1f'; circle(ctx, m.x, m.y, 10); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = fin ? '#b8921a' : '#c45f0c'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; circle(ctx, m.x - 3, m.y - 3, 3); ctx.fill();
    if (m.done) { ctx.strokeStyle = '#2fb36d'; ctx.lineWidth = 2.5 / z; circle(ctx, m.x, m.y, 16); ctx.stroke(); }

      ctx.lineJoin = 'round'; ctx.lineWidth = 3.5 / z; ctx.strokeStyle = 'rgba(8,20,28,.9)'; ctx.strokeText(lbl, m.x, m.y - 17);
      ctx.fillStyle = '#e7eff2'; ctx.fillText(lbl, m.x, m.y - 17);

}

function hullPath(c, L, B) {
  c.beginPath(); c.moveTo(L * .5, 0);
  c.bezierCurveTo(L * .42, -B * .44, L * .02, -B * .52, -L * .5, -B * .4);
  c.lineTo(-L * .5, B * .4);
  c.bezierCurveTo(L * .02, B * .52, L * .42, B * .44, L * .5, 0);
  c.closePath();
}

function drawMainsail(c, L) {
  const b = G.boat, d = G.d, mx = L * .14, phi = Math.PI - b.boom * D2R, bl = L * .6;
  const dx = Math.cos(phi), dy = Math.sin(phi), ex = mx + dx * bl, ey = dy * bl, nx = -dy, ny = dx;
  const ar = (d.awaRel || 0) * D2R, tx = -Math.cos(ar), ty = -Math.sin(ar);
  const side = Math.sign(nx * tx + ny * ty) || 1;
  const luff = d.trim === 'file' || d.trim === 'bos';
  const depth = bl * (.05 + .09 * clamp((d.aws || 0) / 14, 0, 1)) * (d.trim === 'bos' ? .3 : 1);
  const amp = luff ? bl * (d.trim === 'bos' ? .07 : .045) : 0;
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, env = 4 * t * (1 - t);
    const off = depth * env * side + amp * Math.sin(t * Math.PI * 3.2 - G.t * 26) * env;
    pts.push([mx + dx * bl * t + nx * off, dy * bl * t + ny * off]);
  }
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) c.lineTo(p[0], p[1]);
  c.lineTo(mx, 0); c.closePath();
  c.fillStyle = 'rgba(250,252,253,.93)'; c.fill();
  c.strokeStyle = '#a3b6bf'; c.lineWidth = 1; c.stroke();
  // çıtalar
  c.strokeStyle = 'rgba(120,145,158,.6)'; c.lineWidth = .8;
  for (const ti of [4, 7, 10]) { const p = pts[ti], q = [mx + dx * bl * ti / 14, dy * bl * ti / 14]; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(lerp(p[0], q[0], .6), lerp(p[1], q[1], .6)); c.stroke(); }
  // rüzgâr ipleri
  const base = Math.atan2(dy, dx);
  for (const ti of [8, 11]) {
    const p = pts[ti]; let a = base;
    if (d.trim === 'iyi') a += Math.sin(G.t * 9 + ti) * .12;
    else if (luff) a += Math.sin(G.t * 31 + ti) * 1.1;
    else a += side * 2.1 + Math.sin(G.t * 5 + ti) * .3;
    c.strokeStyle = '#e5484d'; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(p[0] + Math.cos(a) * 7, p[1] + Math.sin(a) * 7); c.stroke();
  }
  // bom
  c.strokeStyle = '#33434d'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(mx, 0); c.lineTo(ex, ey); c.stroke();
}

function drawSpinnaker(c, L, B) {
  const bl = G.balloon, k = bl.k, col = bl.collapsed;
  const lee = Math.sign(G.boat.boom) || G.boat.boomSide;
  c.strokeStyle = '#33434d'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(L * .14, 0); c.lineTo(L * .5, -lee * L * .3 * k); c.stroke();
  const cx = L * .5 + L * .36 * k, cy = lee * L * .12 * k;
  const rx = L * .3 * k * (col ? .55 : 1), ry = L * .48 * k * (col ? .5 : 1);
  const shape = () => {
    c.beginPath();
    if (col) {
      for (let i = 0; i <= 28; i++) { const a = i / 28 * TAU, r = 1 + .14 * Math.sin(i * 3 + G.t * 12); const x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath();
    } else c.ellipse(cx, cy, rx, ry, 0, 0, TAU);

  c.save(); shape(); c.fillStyle = '#d93a5b'; c.globalAlpha = col ? .8 : 1; c.fill(); c.clip();
  c.fillStyle = '#f3f6f7'; c.fillRect(cx - rx * .15, cy - ry * 1.2, rx * .3, ry * 2.4);
  c.fillStyle = '#2a4f9a'; c.fillRect(cx + rx * .35, cy - ry * 1.2, rx, ry * 2.4);
  c.restore();
  shape(); c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1; c.stroke();
  c.strokeStyle = 'rgba(230,240,245,.55)'; c.lineWidth = .8;
  c.beginPath(); c.moveTo(cx - rx * .6, cy + ry * .75); c.lineTo(-L * .45, B * .38); c.moveTo(cx - rx * .6, cy - ry * .75); c.lineTo(-L * .45, -B * .38); c.stroke();
}

function drawBoat() {
  const b = G.boat, L = 48, B = 20, a = (b.hdg - 90) * D2R, c = ctx;
  c.save(); c.translate(b.x + 3, b.y + 5); c.rotate(a); hullPath(c, L, B); c.fillStyle = 'rgba(0,18,28,.3)'; c.fill(); c.restore();
  c.save(); c.translate(b.x, b.y); c.rotate(a);
  // dümen palası
  const ra = Math.PI - b.u * .55;
  c.strokeStyle = '#1a262d'; c.lineWidth = 3.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-L * .5, 0); c.lineTo(-L * .5 + Math.cos(ra) * 9, Math.sin(ra) * 9); c.stroke();
  // gövde
  hullPath(c, L, B); c.fillStyle = '#f3f6f7'; c.fill(); c.lineWidth = 1.4; c.strokeStyle = '#7f96a2'; c.stroke();
  c.save(); c.scale(.88, .84); hullPath(c, L, B); c.restore(); c.strokeStyle = '#1f4e79'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = '#d5dfe3'; rrect(c, -L * .42, -B * .27, L * .46, B * .54, 4); c.fill();
  // dümenci rüzgârüstünde oturur

  c.fillStyle = '#ff9f1c'; c.beginPath(); c.ellipse(-L * .2, cy, 6, 5, 0, 0, TAU); c.fill();
  c.fillStyle = '#e9b98f'; circle(c, -L * .2, cy - bs * 2, 3.4); c.fill();
  // yeke ya da dolap
  if (!G.wheel) {
    const ta = -b.u * .55;
    c.strokeStyle = '#b07a45'; c.lineWidth = 2.6;
    c.beginPath(); c.moveTo(-L * .47, 0); c.lineTo(-L * .47 + Math.cos(ta) * L * .32, Math.sin(ta) * L * .32); c.stroke();
  } else {
    c.save(); c.translate(-L * .36, 0); c.rotate(b.u * 2); c.strokeStyle = '#b07a45'; c.lineWidth = 1.6;
    circle(c, 0, 0, 5.5); c.stroke();
    for (let i = 0; i < 6; i++) { const q = i * Math.PI / 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(q) * 7.5, Math.sin(q) * 7.5); c.stroke(); }
    c.restore();
  }
  drawMainsail(c, L);
  c.fillStyle = '#22313a'; circle(c, L * .14, 0, 2.6); c.fill();
  if (G.balloon.k > 0) drawSpinnaker(c, L, B);
  c.restore();
}

function drawOffscreen() {
  const m = targetMarkObj(); if (!m) return;
  const [sx, sy] = worldToScreen(m.x, m.y), pad = 26, top = 76;
  if (sx > pad && sx < W - pad && sy > top && sy < H - pad) return;
  const cx = W / 2, cy = H / 2, dx = sx - cx, dy = sy - cy;
  const tX = dx > 0 ? (W - pad - cx) / dx : dx < 0 ? (pad - cx) / dx : Infinity;
  const tY = dy > 0 ? (H - pad - cy) / dy : dy < 0 ? (top - cy) / dy : Infinity;
  const t = Math.min(tX, tY), px = cx + dx * t, py = cy + dy * t, ang = Math.atan2(dy, dx);
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
  ctx.fillStyle = '#e04aa8'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -9); ctx.lineTo(-7, 9); ctx.closePath(); ctx.fill();
  ctx.restore();
  const lbl = (m.l ? m.l + ' · ' : '') + Math.round(hyp(m.x - G.boat.x, m.y - G.boat.y) / UPM) + ' m';
  ctx.font = '700 13px "Saira Semi Condensed", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lx = clamp(px - Math.cos(ang) * 34, 30, W - 30), ly = clamp(py - Math.sin(ang) * 22, top - 10, H - 14);
  ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(8,20,28,.9)'; ctx.strokeText(lbl, lx, ly);
  ctx.fillStyle = '#e7eff2'; ctx.fillText(lbl, lx, ly);
}

function drawWindHud() {

  ctx.fillText('K', cx, cy - r + 6);

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

const SECT = [['olu', 0, 42], ['orsa', 42, 58], ['darapaz', 58, 78], ['apaz', 78, 103], ['genis', 103, 152], ['pupa', 152, 180]];
const SECT_COL = { olu: 'rgba(229,72,77,.6)', orsa: '#1b5872', darapaz: '#21698a', apaz: '#287ca0', genis: '#2e8db3', pupa: '#3a9fc4' };
function drawDialInst() {
  const d = G.d, R = W < 420 ? 44 : 56, cx = W - R - 18, cy = R + 18, rIn = R * .66;
  ctx.save();
  circle(ctx, cx, cy, R + 9); ctx.fillStyle = 'rgba(8,20,28,.82)'; ctx.fill(); ctx.strokeStyle = '#284050'; ctx.lineWidth = 1; ctx.stroke();
  for (const [k, lo, hi] of SECT) for (const sg of [1, -1]) {
    let a0 = (d.rel + sg * lo - 90) * D2R, a1 = (d.rel + sg * hi - 90) * D2R;
    if (sg < 0) { const tmp = a0; a0 = a1; a1 = tmp; }
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.arc(cx, cy, rIn, a1, a0, true); ctx.closePath();
    const cur = k === d.point;
    ctx.fillStyle = cur ? (k === 'olu' ? '#e5484d' : '#e7eff2') : SECT_COL[k];
    ctx.fill(); ctx.strokeStyle = '#0b161d'; ctx.lineWidth = 1; ctx.stroke();
  }
  // pruva işareti
  ctx.fillStyle = '#e7eff2'; ctx.beginPath(); ctx.moveTo(cx, cy - R - 8); ctx.lineTo(cx - 5, cy - R - 1); ctx.lineTo(cx + 5, cy - R - 1); ctx.closePath(); ctx.fill();
  // ortada küçük tekne ve bom
  const s = R * .95 / 48;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2); ctx.scale(s, s);
  hullPath(ctx, 48, 20); ctx.fillStyle = '#f3f6f7'; ctx.fill();
  const phi = Math.PI - G.boat.boom * D2R;
  ctx.strokeStyle = '#e04aa8'; ctx.lineWidth = 3.2 / s * .6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(48 * .14, 0); ctx.lineTo(48 * .14 + Math.cos(phi) * 28, Math.sin(phi) * 28); ctx.stroke();
  ctx.restore();
  // rüzgâr oku
  const wa = (d.rel - 90) * D2R, ux = Math.cos(wa), uy = Math.sin(wa);
  const x1 = cx + ux * (R + 8), y1 = cy + uy * (R + 8), x2 = cx + ux * (rIn - 3), y2 = cy + uy * (rIn - 3);
  ctx.strokeStyle = '#9fd3ea'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const ha = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = '#9fd3ea'; ctx.beginPath(); ctx.moveTo(x2 + Math.cos(ha) * 3, y2 + Math.sin(ha) * 3);
  ctx.lineTo(x2 - Math.cos(ha - .5) * 8, y2 - Math.sin(ha - .5) * 8); ctx.lineTo(x2 - Math.cos(ha + .5) * 8, y2 - Math.sin(ha + .5) * 8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = seaGrad; ctx.fillRect(0, 0, W, H);
  ctx.save();
  let sx = 0, sy = 0;
  if (G.shake > 0 && !reduceMotion) { sx = Math.sin(G.t * 90) * G.shake * 10; sy = Math.cos(G.t * 73) * G.shake * 8; }
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(G.zoom, G.zoom); ctx.translate(-G.cam.x, -G.cam.y);
  drawWater(); drawStreaks(); drawLayLines(); drawCourseLine(); drawTrail(); drawMarks(); drawBoat();
  ctx.restore();
  drawOffscreen(); drawWindHud(); drawDialInst();
}

  c.strokeStyle = '#4f6b7a'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx, h - 14); c.lineTo(cx, h - 4); c.stroke();

  } else {

    c.fillStyle = '#e7eff2'; circle(c, 0, 0, 4); c.fill();

}

const stepBox = $('stepBox'), stepDots = $('stepDots'), stepCount = $('stepCount'), stepTextEl = $('stepText');
const freeBox = $('freeBox'), windDirIn = $('windDir'), windDirVal = $('windDirVal'), windSpdIn = $('windSpd'), windSpdVal = $('windSpdVal');
const iSpeed = $('iSpeed'), iVmg = $('iVmg'), iTwa = $('iTwa'), iTack = $('iTack'), iPoint = $('iPoint'), iPointSub = $('iPointSub'), iTrim = $('iTrim'), iTrimSub = $('iTrimSub');
const sheetIn = $('sheet'), sheetVal = $('sheetVal'), autoTag = $('autoTag'), autoWrap = $('autoWrap'), autoChk = $('autoChk'), balloonBtn = $('balloonBtn');
const helmLabel = $('helmLabel'), modeTiller = $('modeTiller'), modeWheel = $('modeWheel'), turnVal = $('turnVal');
const modal = $('modal'), modalCard = $('modalCard'), menuBtn = $('menuBtn'), infoBtn = $('infoBtn'), soundBtn = $('soundBtn'), sOn = $('sOn'), sOff = $('sOff');

let toastTimer = 0;
function toast(msg, cls, ms) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (cls ? ' ' + cls : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast' + (cls ? ' ' + cls : ''); }, ms || 2400);
}

const ui = {};
function setText(el, key, val) { if (ui[key] !== val) { ui[key] = val; el.textContent = val; } }
function setClass(el, key, val) { if (ui[key] !== val) { ui[key] = val; el.className = val; } }

function renderBar() {
  const L = curLesson();
  if (L) {
    lessonKicker.textContent = `Ders ${G.idx + 1} / ${LESSONS.length}`;
    lessonTitle.textContent = L.title;
    stepBox.hidden = false; freeBox.hidden = true;
    stepDots.innerHTML = L.steps.map((s, i) => `<i class="${i < G.ls.step ? 'done' : i === G.ls.step ? 'cur' : ''}"></i>`).join('');
    stepCount.textContent = `${G.ls.step + 1}/${L.steps.length}`;
    stepTextEl.textContent = stepText(L.steps[G.ls.step]);
  } else {
    lessonKicker.textContent = 'Serbest seyir';
    lessonTitle.textContent = 'Rüzgârı sen ayarla';
    stepBox.hidden = true; freeBox.hidden = false;
  }
  balloonBtn.hidden = !G.allowBalloon;
  autoWrap.hidden = G.mode !== 'free';
  autoTag.hidden = !(G.auto && G.mode === 'lesson');
  autoChk.checked = G.auto;
  sheetIn.disabled = G.auto;
  sheetIn.value = String(Math.round(G.boat.sheet * 100));
  helmLabel.textContent = G.wheel ? 'Dümen dolabı' : 'Yeke';
  modeTiller.setAttribute('aria-pressed', String(!G.wheel));
  modeWheel.setAttribute('aria-pressed', String(G.wheel));
}

let uiWait = 0;
function updateUI(dt) {
  uiWait -= dt; if (uiWait > 0) return; uiWait = .1;
  const d = G.d, b = G.boat;
  setText(iSpeed, 'spd', fmt1(b.v));
  setText(iVmg, 'vmg', 'VMG ' + fmt1(Math.abs(d.vmg)));
  setText(iTwa, 'twa', Math.round(d.twa) + '°');
  const stb = b.tackSide > 0;
  setText(iTack, 'tack', stb ? 'Sancak kontra' : 'İskele kontra');
  setClass(iTack, 'tackc', 'sub ' + (stb ? 'stbd' : 'port'));
  setText(iPoint, 'pt', POINTS[d.point]);
  setText(iPointSub, 'pts', POINT_SUB[d.point]);
  setClass(iPoint, 'ptc', 'v txt' + (d.point === 'olu' ? ' bad' : ''));
  const TR = {
    iyi: ['İyi trim', 'ok', 'ipler düz'],
    file: ['Fileliyor', 'warn', G.auto ? 'otomatik' : 'kas'],
    kasili: ['Fazla kasılı', 'warn', 'laçka et'],
    bos: ['Boşta', 'bad', 'ölü bölge']
  }[d.trim];
  setText(iTrim, 'tr', TR[0]); setClass(iTrim, 'trc', 'v txt ' + TR[1]); setText(iTrimSub, 'trs', TR[2]);
  setText(sheetVal, 'sh', 'Bom ' + Math.round(Math.abs(b.boom)) + '° · %' + Math.round(b.sheet * 100));
  if (G.auto) { const v = String(Math.round(b.sheet * 100)); if (sheetIn.value !== v) sheetIn.value = v; }
  setText(turnVal, 'turn', b.u > .08 ? 'Sancağa (sağa) dönüyor' : b.u < -.08 ? 'İskeleye (sola) dönüyor' : 'Düz');
  helm.setAttribute('aria-valuenow', String(Math.round(helmPos * 100)));
  const bl = G.balloon;
  setText(balloonBtn, 'bl', { down: 'Balon çek', hoisting: 'Çekiliyor…', up: 'Balonu indir', dousing: 'İniyor…' }[bl.state]);
  setClass(balloonBtn, 'blc', 'pill-btn' + (bl.state === 'up' || bl.state === 'hoisting' ? ' active' : ''));
  const cur = stepDots.querySelector('.cur');
  if (cur) cur.style.setProperty('--p', Math.round((G.ls.st.p || 0) * 100) + '%');
  if (G.timer && G.mode === 'lesson') setText(lessonKicker, 'kick', `Ders ${G.idx + 1} / ${LESSONS.length} · Süre ${fmtTime(G.raceT)}`);
}

/* ---------- Ders akışı ---------- */
function startStep(i) { G.ls.step = i; G.ls.st = {}; G.ls.stepStart = G.t; ui.kick = null; renderBar(); }
function completeStep() {
  Snd.ding();
  const L = curLesson();
  if (G.ls.step + 1 >= L.steps.length) lessonDone();
  else { toast('✓ Adım tamam', 'good', 1500); startStep(G.ls.step + 1); }
}
function lessonUpdate(dt) {
  const s = curStep(); if (!s) return;
  if (s.check(G.ls.st, dt)) completeStep();
}

function openModal(html) { modalCard.innerHTML = html; modal.hidden = false; modal.scrollTop = 0; }
function closeModal() { modal.hidden = true; modalCard.innerHTML = ''; }
const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };

function play() { closeModal(); G.phase = 'play'; G.started = true; Snd.init(); keepAwake(); }

function hesapNotu(t) { try { if (window.Hesap) Hesap.not(t); } catch (e) {} }

function openLesson(i) {
  G.mode = 'lesson'; G.idx = clamp(i, 0, LESSONS.length - 1); G.started = false;
  store.set(K_LAST, String(G.idx));
  hesapNotu(`${G.idx + 1}. ders: ${LESSONS[G.idx].title} · ${doneSet.size}/${LESSONS.length} bitti`);
  applySetup(LESSONS[G.idx].setup);
  startStep(0);
  showIntro();
}
function restartLesson() { applySetup(curLesson().setup); startStep(0); play(); }

function showIntro() {
  const L = curLesson(); G.phase = 'intro';
  const resume = G.started;
  openModal(
    `<div class="kicker">Ders ${G.idx + 1} / ${LESSONS.length} · ${L.sub}</div><h2>${L.title}</h2>` +
    `<div class="diagram">${DIAGRAMS[L.diagram]()}</div>` +
    L.intro.map(p => `<p>${p}</p>`).join('') +
    `<div class="kicker">Adımlar</div><ol class="steps-list">${L.steps.map(s => `<li>${stepText(s)}</li>`).join('')}</ol>` +
    `<div class="btn-row"><button class="btn" id="mGo" type="button">${resume ? 'Devam et' : 'Başla'}</button>` +
    (resume ? `<button class="btn secondary" id="mRestart" type="button">Baştan başla</button>` : '') +
    `<button class="btn secondary" id="mMenu" type="button">Dersler</button></div>`
  );
  on('mGo', play); on('mRestart', restartLesson); on('mMenu', showMenu);
}

let doneNote = '';
function lessonDone() {
  G.phase = 'done';
  doneSet.add(G.idx); store.set(K_DONE, JSON.stringify([...doneSet]));
  Snd.fanfare();
  doneNote = '';
  if (G.timer) {
    const best = parseFloat(store.get(K_BEST) || '0');
    if (!best || G.raceT < best) { store.set(K_BEST, String(G.raceT)); doneNote = best ? 'Yeni rekor!' : 'İlk rekorun kaydedildi.'; }
    else doneNote = 'Rekorun: ' + fmtTime(best) + '.';
  }
  const rekor = parseFloat(store.get(K_BEST) || '0');
  hesapNotu(G.timer
    ? `Parkur ${fmtTime(G.raceT)} · rekor ${fmtTime(rekor || G.raceT)}`
    : `${G.idx + 1}. ders bitti: ${curLesson().title} · ${doneSet.size}/${LESSONS.length} bitti`);
  showDone();
}
function showDone() {
  const L = curLesson(), next = LESSONS[G.idx + 1];
  const extra = G.timer ? `<p class="big-time">${fmtTime(G.raceT)}</p><p>Parkuru bitirdin. ${doneNote}</p>` : '';
  openModal(
    `<div class="kicker">Ders ${G.idx + 1} tamamlandı</div><h2>${L.title}</h2>${extra}` +
    `<div class="kicker">Öğrendiklerin</div><ul class="recap">${L.recap.map(r => `<li>${r}</li>`).join('')}</ul>` +
    `<div class="btn-row">` +
    (next ? `<button class="btn" id="mNext" type="button">Sonraki: ${next.title}</button>` : `<button class="btn" id="mFree" type="button">Serbest seyre çık</button>`) +
    `<button class="btn secondary" id="mAgain" type="button">Tekrar dene</button><button class="btn secondary" id="mMenu" type="button">Dersler</button></div>`
  );
  on('mNext', () => openLesson(G.idx + 1)); on('mFree', openFree); on('mAgain', restartLesson); on('mMenu', showMenu);
}

function openFree() {
  G.mode = 'free'; G.started = false;
  store.set(K_LAST, 'free');
  hesapNotu(`Serbest seyir · ${doneSet.size}/${LESSONS.length} ders bitti`);
  const s = Object.assign({}, FREE.setup, { wind: +windDirIn.value, spd: +windSpdIn.value });
  applySetup(s);
  G.ls = { step: 0, st: {}, stepStart: 0 };
  updateFreeLabels();
  renderBar();
  showFreeIntro();
}
function showFreeIntro() {
  G.phase = 'intro';
  openModal(
    `<div class="kicker">Serbest seyir</div><h2>${FREE.sub}</h2>` +
    FREE.intro.map(p => `<p>${p}</p>`).join('') +
    `<div class="btn-row"><button class="btn" id="mGo" type="button">${G.started ? 'Devam et' : 'Başla'}</button><button class="btn secondary" id="mMenu" type="button">Dersler</button></div>`
  );
  on('mGo', play); on('mMenu', showMenu);
}

function showMenu() {
  if (G.phase === 'play') G.phase = 'paused';
  const items = LESSONS.map((L, i) =>
    `<li><button type="button" data-i="${i}" class="${G.mode === 'lesson' && G.idx === i ? 'current' : ''}"><span class="li-num">${i + 1}</span><span class="li-body"><span class="li-title">${L.title}</span><span class="li-sub">${L.sub}</span></span>${doneSet.has(i) ? '<span class="li-tick">✓ Tamam</span>' : ''}</button></li>`).join('');
  openModal(
    `<div class="kicker">Rüzgâr Kaptanı · Yelken okulu</div><h2>Dersler</h2>` +
    `<p>Dersler sırayla ilerler; her biri bir öncekinin üstüne kurulur. İstediğin derse atlayabilirsin.</p>` +
    `<ol class="lesson-list">${items}<li><button type="button" data-free="1" class="${G.mode === 'free' ? 'current' : ''}"><span class="li-num">∞</span><span class="li-body"><span class="li-title">Serbest seyir</span><span class="li-sub">Rüzgârın yönünü ve gücünü sen ayarla</span></span></button></li></ol>` +
    `<div class="btn-row"><button class="btn secondary" id="mClose" type="button">Kapat</button></div>`
  );
  modalCard.querySelectorAll('[data-i]').forEach(btn => btn.addEventListener('click', () => openLesson(+btn.dataset.i)));
  modalCard.querySelector('[data-free]').addEventListener('click', openFree);
  on('mClose', () => {
    closeModal();
    if (G.phase === 'paused') G.phase = 'play';
    else if (G.phase === 'intro') { if (G.mode === 'lesson') showIntro(); else showFreeIntro(); }
    else if (G.phase === 'done') showDone();
  });
}

function updateFreeLabels() {
  const dir = +windDirIn.value, nm = windName(dir);
  windDirVal.textContent = nm[0] + ' · ' + dir + '°';
  windSpdVal.textContent = windSpdIn.value + ' kn';
}

/* ---------- Kontroller ---------- */
function adjustSheet(dv) {
  if (G.auto) { toast(G.mode === 'free' ? 'Oto trim açık. İskotayı kendin ayarlamak için kapat.' : 'Bu derste yelken otomatik ayarlanıyor.', '', 2000); return; }
  G.boat.sheet = clamp(G.boat.sheet + dv, 0, 1);
  sheetIn.value = String(Math.round(G.boat.sheet * 100));
}
function toggleBalloon() {
  if (!G.allowBalloon || G.phase !== 'play') return;
  const bl = G.balloon;
  if (bl.state === 'down') {
    if (G.d.twa < 100) { toast('Balon geniş apaz ya da pupada çekilir. Önce boca et.', 'warn', 2600); return; }
    bl.state = 'hoisting';
  } else if (bl.state === 'up' || bl.state === 'hoisting') bl.state = 'dousing';
}
function setWheel(v) { G.wheel = v; store.set(K_WHEEL, v ? '1' : '0'); helmPos = 0; ui.turn = null; renderBar(); }
function renderSound() {
  soundBtn.setAttribute('aria-pressed', String(Snd.on));
  soundBtn.setAttribute('aria-label', Snd.on ? 'Sesi kapat' : 'Sesi aç');
  if (Snd.on) { sOn.removeAttribute('hidden'); sOff.setAttribute('hidden', ''); }
  else { sOff.removeAttribute('hidden'); sOn.setAttribute('hidden', ''); }
}
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }

sheetIn.addEventListener('input', () => { if (!G.auto) G.boat.sheet = (+sheetIn.value) / 100; });
autoChk.addEventListener('change', () => { G.auto = autoChk.checked; renderBar(); });
balloonBtn.addEventListener('click', toggleBalloon);
modeTiller.addEventListener('click', () => setWheel(false));
modeWheel.addEventListener('click', () => setWheel(true));
menuBtn.addEventListener('click', showMenu);
infoBtn.addEventListener('click', () => { if (G.phase === 'play') G.phase = 'intro'; if (G.mode === 'lesson') showIntro(); else showFreeIntro(); });
soundBtn.addEventListener('click', () => { Snd.setOn(!Snd.on); store.set(K_SND, Snd.on ? '1' : '0'); renderSound(); });
windDirIn.addEventListener('input', () => { G.wind.base = +windDirIn.value; updateFreeLabels(); });
windSpdIn.addEventListener('input', () => { G.wind.baseSpd = +windSpdIn.value; updateFreeLabels(); });

function setHelmFromX(clientX) {
  const r = helm.getBoundingClientRect(), range = r.width / 2 - 28;
  helmPos = clamp((clientX - (r.left + r.width / 2)) / range, -1, 1);
}
helm.addEventListener('pointerdown', e => { helmDrag = true; try { helm.setPointerCapture(e.pointerId); } catch (_) {} setHelmFromX(e.clientX); e.preventDefault(); });
helm.addEventListener('pointermove', e => { if (helmDrag) { setHelmFromX(e.clientX); e.preventDefault(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => helm.addEventListener(ev, () => { helmDrag = false; }));

const isLeft = k => k === 'ArrowLeft' || k === 'a' || k === 'A';
const isRight = k => k === 'ArrowRight' || k === 'd' || k === 'D';
window.addEventListener('keydown', e => {
  if (!modal.hidden) return;
  const k = e.key;
  if (isLeft(k)) keys.l = true;
  else if (isRight(k)) keys.r = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') adjustSheet(.04);
  else if (k === 'ArrowDown' || k === 's' || k === 'S') adjustSheet(-.04);
  else if (k === 'b' || k === 'B') toggleBalloon();
  else return;
  e.preventDefault();
});
window.addEventListener('keyup', e => { if (isLeft(e.key)) keys.l = false; if (isRight(e.key)) keys.r = false; });
window.addEventListener('blur', () => { keys.l = keys.r = false; });
document.addEventListener('visibilitychange', () => {
  if (!Snd.ctx) return;
  if (document.hidden) Snd.ctx.suspend().catch(() => {});
  else { Snd.ctx.resume().catch(() => {}); if (G.phase === 'play') keepAwake(); }
});

/* ---------- Boyut ve döngü ---------- */
function resize() {
  const r = seaBox.getBoundingClientRect();
  const nw = Math.max(1, r.width), nh = Math.max(1, r.height);
  if (nw === W && nh === H) return;
  W = nw; H = nh; DPR = Math.min(2, window.devicePixelRatio || 1);
  sea.width = Math.round(W * DPR); sea.height = Math.round(H * DPR);
  G.zoom = clamp(Math.min(W, H) / 430, .72, 1.45);
  seaGrad = ctx.createLinearGradient(0, 0, 0, H);
  seaGrad.addColorStop(0, '#186a8f'); seaGrad.addColorStop(1, '#0e4762');
  initStreaks();
}

function step(dt) {
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt);
  const playing = G.phase === 'play';
  if (playing) {
    physics(dt);
    marksUpdate();
    trailUpdate(dt);
    if (G.timer) G.raceT += dt;
    if (G.mode === 'lesson') lessonUpdate(dt);
    if (G.phase === 'play') hints(dt);
  }
  streaksUpdate(dt);
  cameraUpdate(dt);
  updateUI(dt);
  Snd.update(dt, playing ? G.d.aws : 0, playing && (G.d.trim === 'file' || G.d.trim === 'bos'));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (W > 2 && H > 2) { step(dt); draw(); drawHelm(); }
  requestAnimationFrame(frame);
}

function start(data) {
  G.wheel = store.get(K_WHEEL) === '1';
  Snd.on = store.get(K_SND) !== '0';
  renderSound();
  resize(); resizeHelm();
  if (window.ResizeObserver) {
    new ResizeObserver(() => resize()).observe(seaBox);
    new ResizeObserver(() => resizeHelm()).observe(helm);
  } else window.addEventListener('resize', () => { resize(); resizeHelm(); });
  updateFreeLabels();
  const lastSaved = store.get(K_LAST);
  if ((data && data.mode === 'free') || (!(data && data.mode) && lastSaved === 'free')) openFree();
  else {
    const i = data && Number.isInteger(data.idx) ? data.idx : parseInt(lastSaved || '0', 10);
    openLesson(Number.isFinite(i) ? i : 0);
  }
  requestAnimationFrame(frame);
}

try { window.claude?.hot?.snapshot(() => ({ mode: G.mode, idx: G.idx })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
