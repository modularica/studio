:root {
  --ink: #1f2633;
  --muted: #6c707a;
  --paper: #f6f0e4;
  --cream: #fffaf0;
  --clay: #c4633a;
  --clay2: #b2552f;
  --line: rgba(255, 246, 232, .82);
  --ballc: #d5ee3e;
  --p0: #2563eb;
  --p1: #d63a78;
  --bad: #d64040;
  --good: #1f9d55;
  --gold: #e8a417;
  --font: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font); font-weight: 500; }
body { overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
input { font: inherit; }
#app { position: fixed; inset: 0; }
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: flex; }

/* ---------- ball ---------- */
.ball {
  width: 34px; height: 34px; border-radius: 50%; display: inline-block; position: relative;
  background: radial-gradient(circle at 35% 30%, #f0fb9b 0 18%, var(--ballc) 46%, #b6cf22 100%);
  box-shadow: 0 2px 4px rgba(0,0,0,.18);

/* tiles */

// Kelime Tenisi: sözlük, kurallar ve bot. DOM'suz; tarayıcıda ve Node testlerinde aynı dosya.
// Oyun: kelime merdiveni rallisi. Her vuruşta gelen kelimenin tek harfini değiştirip geri gönderirsin.
// Kullanılan kelime yanar; süresinde dönemeyen sayıyı kaybeder; dönüşü hiç olmayan kelime = smaç.
'use strict';

const KT = (function () {
  // On-screen keyboard rows (Turkish Q layout without q, w, x).
  const KEYS = {
    tr: ['ertyuıopğü', 'asdfghjklşi', 'zcvbnmöç'],
    en: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
  };
  const LOCALE = { tr: 'tr-TR', en: 'en-US' };
  const upper = (w, lang) => String(w).toLocaleUpperCase(LOCALE[lang] || 'en-US');
  const lower = (w, lang) => String(w).toLocaleLowerCase(LOCALE[lang] || 'en-US');

  // Shot clock in seconds: first return, shrink per shot, floor.
  const PACES = {
    rahat: { start: 10, step: 0.5, min: 5 },
    normal: { start: 7, step: 0.4, min: 3.5 },
    hizli: { start: 5, step: 0.3, min: 2.5 },
  };
  const SERVE_TIME = 10;      // seconds to pick a serve word (then one is picked for you)
  const POINTS_TO_GAME = 4;   // 15, 30, 40, game; at 40-40 the next point wins ("altın sayı")
  const TENNIS = ['0', '15', '30', '40'];

  function seeded(seed) { // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (arr, r) => arr[Math.floor(r() * arr.length)];
  function shuffle(arr, r) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  class Lexicon {
    constructor(words, lang, len) {
      const d = words[lang];
      if (!d || !d.common[len]) throw new Error('no words for ' + lang + '/' + len);
      this.lang = lang;
      this.len = len;
      this.alpha = d.alpha;
      const common = d.common[len].split(' ');
      const rare = d.rare[len] ? d.rare[len].split(' ') : [];
      this.commonSet = new Set(common);
      this.validSet = new Set(common.concat(rare));
      this.serves = d.serve[len].split(' ');
      this.buckets = new Map();
      for (const w of this.validSet) {
        for (let i = 0; i < len; i++) {
          const k = w.slice(0, i) + '_' + w.slice(i + 1);
          let b = this.buckets.get(k);
          if (!b) this.buckets.set(k, (b = []));
          b.push(w);
        }
      }
    }
    has(w) { return this.validSet.has(w); }
    isCommon(w) { return this.commonSet.has(w); }
    // Words one letter away from w, not in `used`. onlyCommon: the ones most people know.
    neighbours(w, used, onlyCommon) {
      const out = [];
      for (let i = 0; i < w.length; i++) {
        const b = this.buckets.get(w.slice(0, i) + '_' + w.slice(i + 1));
        if (!b) continue;
        for (const x of b) {
          if (x === w || (used && used.has(x))) continue;
          if (onlyCommon && !this.commonSet.has(x)) continue;
          out.push(x);
        }
      }
      return out;
    }
    // Index of the single differing letter, or -1.
    diff(a, b) {
      if (a.length !== b.length) return -1;
      let at = -1;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) { if (at >= 0) return -1; at = i; }
      }
      return at;
    }
    pickServes(n, r, avoid) {
      const pool = avoid ? this.serves.filter(w => !avoid.has(w)) : this.serves;
      return shuffle(pool.length >= n ? pool : this.serves, r).slice(0, n);
    }
    // Sort for showing: common words first, each group by fewest letters changed from `w`? keep A-Z.
    split(words) {
      const c = [], r = [];
      for (const w of words) (this.commonSet.has(w) ? c : r).push(w);
      c.sort((a, b) => a.localeCompare(b, LOCALE[this.lang]));
      r.sort((a, b) => a.localeCompare(b, LOCALE[this.lang]));
      return { common: c, rare: r };
    }
  }

  class Match {
    // opts: { lex, players: [{ name, bonus }], gamesToWin, pace, firstServer, random }
    constructor(opts) {
      this.lex = opts.lex;
      this.players = opts.players.map(p => Object.assign({ bonus: 0 }, p));
      this.gamesToWin = opts.gamesToWin || 2;
      this.paceName = PACES[opts.pace] ? opts.pace : 'normal';
      this.pace = PACES[this.paceName];
      this.r = opts.random || Math.random;
      this.games = [0, 0];
      this.points = [0, 0];
      this.server = opts.firstServer === 1 ? 1 : 0;
      this.phase = 'serve';         // serve | rally | pointOver | matchOver
      this.winner = -1;
      this.pointsPlayed = 0;
      this.history = [];
      this.served = new Set();      // serve words already used in this match
      this.stats = { smashes: [0, 0], misses: [0, 0], words: [0, 0], longest: 0, longestWords: [] };
      this.point = null;
      this.newPoint();
    }
    get receiver() { return 1 - this.server; }
    newPoint() {
      const opts = this.lex.pickServes(3, this.r, this.served);
      this.point = { word: null, used: new Set(), shots: [], turn: this.server, serveOptions: opts };
      this.phase = 'serve';
    }
    serve(word) {
      if (this.phase !== 'serve') return { ok: false, reason: 'phase' };
      if (!this.point.serveOptions.includes(word)) return { ok: false, reason: 'not-offered' };
      const pt = this.point;
      pt.word = word;
      pt.used.add(word);
      pt.shots.push({ by: this.server, word });
      this.served.add(word);
      pt.turn = this.receiver;
      this.phase = 'rally';
      return { ok: true };
    }
    // Seconds the player to move has for this shot.
    shotTime(player) {
      const p = player === undefined ? this.point.turn : player;
      const n = Math.max(0, this.point.shots.length - 1);
      return Math.max(this.pace.min, this.pace.start - this.pace.step * n) + (this.players[p].bonus || 0);
    }
    check(word) {
      if (this.phase !== 'rally') return { ok: false, reason: 'phase' };
      const cur = this.point.word;
      if (word === cur) return { ok: false, reason: 'same' };
      const at = this.lex.diff(cur, word);
      if (at < 0) return { ok: false, reason: 'one-letter' };
      if (this.point.used.has(word)) return { ok: false, reason: 'used', at };
      if (!this.lex.has(word)) return { ok: false, reason: 'unknown', at };
      return { ok: true, at };
    }
    // The player whose turn it is plays `word`.
    shot(word) {
      const c = this.check(word);
      if (!c.ok) return c;
      const pt = this.point, p = pt.turn;
      pt.word = word;
      pt.used.add(word);
      pt.shots.push({ by: p, word });
      this.stats.words[p]++;
      if (this.lex.neighbours(word, pt.used).length === 0) {
        return Object.assign({ ok: true, at: c.at }, this.endPoint(p, 'smash'));
      }
      pt.turn = 1 - p;
      return { ok: true, at: c.at };
    }
    // The player to move ran out of time.
    timeout() {
      if (this.phase !== 'rally') return null;
      return this.endPoint(1 - this.point.turn, 'time');
    }
    endPoint(winner, how) {
      const pt = this.point, loser = 1 - winner;
      const left = how === 'time' ? this.lex.split(this.lex.neighbours(pt.word, pt.used)) : { common: [], rare: [] };
      const rally = pt.shots.length;            // words played in the point, serve included
      if (rally > this.stats.longest) { this.stats.longest = rally; this.stats.longestWords = pt.shots.map(s => s.word); }
      if (how === 'smash') this.stats.smashes[winner]++;
      if (how === 'time') this.stats.misses[loser]++;
      this.points[winner]++;
      this.pointsPlayed++;
      const res = { winner, how, word: pt.word, rally, shots: pt.shots.slice(), left, gameOver: false, matchOver: false };
      if (this.points[winner] >= POINTS_TO_GAME) {
        this.games[winner]++;
        res.gameOver = true;
        res.gamePoints = this.points.slice();
        this.points = [0, 0];
        this.server = 1 - this.server;          // serve changes every game
        if (this.games[winner] >= this.gamesToWin) {
          res.matchOver = true;
          this.winner = winner;
        }
      }
      res.games = this.games.slice();
      this.phase = res.matchOver ? 'matchOver' : 'pointOver';
      this.history.push(res);
      return res;
    }
    next() { if (this.phase === 'pointOver') this.newPoint(); }
    // "15", "30", "40"; at 40-40 both are "40" and goldenPoint() is true.
    scoreText(i) { return TENNIS[Math.min(3, this.points[i])]; }
    goldenPoint() { return this.points[0] === 3 && this.points[1] === 3; }
    // Game point / match point for player i (one point from it).
    pointFor(i) {
      if (this.points[i] < POINTS_TO_GAME - 1) return null;
      return this.games[i] + 1 >= this.gamesToWin ? 'match' : 'game';
    }
  }

  // Bot. see: chance of spotting each word a person would know; think: seconds (min, max);
  // smart: chance of choosing the word that leaves the opponent the fewest returns.
  const LEVELS = {
    kolay: { see: 0.5, think: [2.4, 4.6], smart: 0.0, serve: [1.8, 3.0] },
    orta: { see: 0.72, think: [1.6, 3.6], smart: 0.5, serve: [1.4, 2.4] },
    zor: { see: 0.9, think: [1.0, 2.5], smart: 0.85, serve: [1.0, 1.8] },
  };
  class Bot {
    constructor(level, random) {
      this.level = LEVELS[level] ? level : 'orta';
      this.cfg = LEVELS[this.level];
      this.r = random || Math.random;
    }
    between([a, b]) { return a + (b - a) * this.r(); }
    // Opponent's returns (words people know) after we play w.
    pressure(lex, w, used) {
      const u = new Set(used); u.add(w);
      return lex.neighbours(w, u, true).length;
    }
    serve(match) {
      const opts = match.point.serveOptions;
      let word = pick(opts, this.r);
      if (this.r() < this.cfg.smart) {
        let best = Infinity;
        for (const w of opts) {
          const p = this.pressure(match.lex, w, new Set()) + this.r() * 0.5;
          if (p < best) { best = p; word = w; }
        }
      }
      return { word, delay: this.between(this.cfg.serve) };
    }
    // { word, delay } or { word: null } when it does not find anything (then it runs out of time).
    reply(match) {
      const lex = match.lex, pt = match.point;
      const opts = lex.neighbours(pt.word, pt.used, true);
      const seen = opts.filter(() => this.r() < this.cfg.see);
      if (!seen.length) return { word: null, delay: Infinity, options: opts.length };
      let word = pick(seen, this.r);
      if (this.r() < this.cfg.smart) {
        let best = Infinity;
        for (const w of seen) {
          const p = this.pressure(lex, w, pt.used) + this.r() * 0.5;
          if (p < best) { best = p; word = w; }
        }
      }
      let delay = this.between(this.cfg.think);
      if (opts.length <= 2) delay += 0.6 + this.r() * 0.8;   // harder to find when there are few
      return { word, delay, options: opts.length };
    }
  }

  return { KEYS, LOCALE, PACES, SERVE_TIME, POINTS_TO_GAME, LEVELS, upper, lower, seeded, shuffle, Lexicon, Match, Bot };
})();

if (typeof module !== 'undefined') module.exports = KT;

// Kelime Tenisi sesleri: hepsi WebAudio ile üretilir, ses dosyası yok.
const Sfx = (function () {
  let ctx = null, master = null, noiseBuf = null, enabled = true;

  function ensure() {
    if (!enabled) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.6;
      master.connect(ctx.destination);
      const n = Math.floor(ctx.sampleRate * 2);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, at, dur, type, vol, glideTo) {
    const c = ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, at);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + Math.min(0.01, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.02);
  }

  function noise(at, dur, vol, ftype, f0, f1, q, attack) {
    const c = ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf;
    f.type = ftype || 'bandpass';
    f.frequency.setValueAtTime(f0, at);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
    f.Q.value = q || 1;
    const a = attack || 0.005;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + a);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at, Math.random() * 1.2); s.stop(at + dur + 0.02);
  }

  function now() { const c = ensure(); return c ? c.currentTime + 0.005 : null; }

  return {
    unlock() { ensure(); },
    setEnabled(v) { enabled = !!v; if (!enabled && ctx) ctx.suspend(); else if (enabled) ensure(); },
    get enabled() { return enabled; },
    // racket on ball: short pitched "pok" + a little string noise
    hit(strength) {
      const t = now(); if (t === null) return;
      const s = strength || 1;
      tone(520 * (0.9 + 0.2 * Math.random()), t, 0.08, 'sine', 0.42 * s, 170);
      tone(1250, t, 0.03, 'triangle', 0.08 * s, 900);
      noise(t, 0.04, 0.22 * s, 'bandpass', 3200, 1800, 1.2);
    },
    bounce() {
      const t = now(); if (t === null) return;
      tone(300, t, 0.07, 'sine', 0.18, 140);
      noise(t, 0.03, 0.06, 'lowpass', 900, 500, 0.7);
    },
    serve() {
      const t = now(); if (t === null) return;
      noise(t, 0.18, 0.08, 'bandpass', 900, 2400, 1.5, 0.05);
      tone(560, t + 0.12, 0.08, 'sine', 0.38, 180);
    },
    tap() { const t = now(); if (t === null) return; tone(880, t, 0.035, 'triangle', 0.06); },
    key() { const t = now(); if (t === null) return; tone(620 + Math.random() * 60, t, 0.03, 'triangle', 0.05); },
    err() {
      const t = now(); if (t === null) return;
      tone(190, t, 0.12, 'square', 0.05, 150);
      tone(150, t + 0.09, 0.16, 'square', 0.05, 110);
    },
    tick(urgent) { const t = now(); if (t === null) return; tone(urgent ? 1500 : 1150, t, 0.035, 'square', urgent ? 0.05 : 0.03); },
    smash() {
      const t = now(); if (t === null) return;
      noise(t, 0.22, 0.16, 'bandpass', 600, 3800, 1.2, 0.08);
      tone(420, t + 0.16, 0.12, 'sine', 0.6, 120);
      noise(t + 0.16, 0.06, 0.3, 'bandpass', 2600, 1400, 1);
      tone(784, t + 0.32, 0.18, 'triangle', 0.12);
      tone(1175, t + 0.42, 0.28, 'triangle', 0.1);
    },
    miss() {
      const t = now(); if (t === null) return;
      tone(140, t, 0.22, 'sine', 0.3, 70);
      noise(t, 0.5, 0.05, 'lowpass', 700, 300, 0.7, 0.12);   // crowd "ooh"
    },
    point(good) {
      const t = now(); if (t === null) return;
      noise(t, 0.9, 0.06, 'bandpass', 700, 1100, 0.6, 0.25); // crowd
      if (good) { tone(659, t + 0.05, 0.16, 'triangle', 0.12); tone(988, t + 0.17, 0.26, 'triangle', 0.1); }
    },
    game() {
      const t = now(); if (t === null) return;
      [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, 0.22, 'triangle', 0.12));
      noise(t + 0.1, 1.1, 0.07, 'bandpass', 900, 1300, 0.5, 0.3);
    },
    match() {
      const t = now(); if (t === null) return;
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.11, 0.3, 'triangle', 0.12));
      for (let i = 0; i < 26; i++) noise(t + 0.2 + i * 0.055 + Math.random() * 0.03, 0.05, 0.08 + Math.random() * 0.05, 'bandpass', 1500 + Math.random() * 1500, null, 0.8);
    },

    ball.style.opacity = 1;
    const anim = ball.animate([
      { transform: `translate(${from.x}px, ${from.y}px) scale(1) rotate(0deg)` },
      { transform: `translate(${mid.x}px, ${mid.y}px) scale(${o.fast ? 1.25 : 1.55}) rotate(180deg)` },
      { transform: `translate(${to.x}px, ${to.y}px) scale(1) rotate(360deg)` },
    ], { duration: dur, easing: 'cubic-bezier(.35,.1,.45,1)', fill: 'forwards' });
    G.ballAt = o.out ? null : to;
    anim.onfinish = () => {
      if (!G) return;
      if (o.out) ball.style.opacity = 0; else Sfx.bounce();
      if (done) done();
    };
  }
  function hideBall() { $('#ball').style.opacity = 0; G.ballAt = null; }

  function banner(text, cls) {
    const b = $('#banner');
    b.innerHTML = `<div class="b b1 ${cls || ''}">${esc(text)}</div><div class="b b0 ${cls || ''}">${esc(text)}</div>`;
    void b.offsetWidth;
    b.classList.add('on');
    $('#court').classList.add('banner-on');
  }
  function hideBanner() { $('#banner').classList.remove('on'); $('#court').classList.remove('banner-on'); }

  // ---------- serve ----------
  function enterServe() {
    const m = G.m, s = m.server, r = 1 - s;
    G.pointBusy = false;
    G.sel = [-1, -1]; G.typed = '';
    hideBanner(); hideBall();
    renderScore(); courtInfo();
    for (const i of [0, 1]) setKeyboard(i, false);
    renderTiles(r, null);
    setMsg(r, esc(t('serveWait', { name: playerName(s) })));
    if (isBot(s)) {
      renderTiles(s, null);
      $('.bot-think', panelOf(s)).hidden = false;
      const choice = G.bots[s].serve(m);
      startClock(s, KT.SERVE_TIME, () => doServe(choice.word), false);
      G.plan = { at: choice.delay, fn: () => doServe(choice.word) };
    } else {
      setMsg(s, esc(t('serveYou')), 'turn');
      renderServeCards(s, m.point.serveOptions);
      startClock(s, KT.SERVE_TIME, () => doServe(m.point.serveOptions[Math.floor(Math.random() * 3)]));
    }
  }

  function doServe(word) {
    const m = G.m;
    if (m.phase !== 'serve' || G.pointBusy) return;
    const s = m.server;
    if (!m.serve(word).ok) return;
    stopClock();
    G.pointBusy = true;
    if (isBot(s)) $('.bot-think', panelOf(s)).hidden = true;
    renderTiles(s, word, { wait: true });
    setMsg(s, esc(t('sentBy', { name: playerName(s) })) + ' <b>' + esc(U(word)) + '</b>');
    Sfx.serve();
    courtInfo();
    G.ballAt = courtPoint(s);
    flyBall(1 - s, () => { G.pointBusy = false; enterTurn(); });
  }

  // ---------- rally ----------
  function enterTurn() {
    const m = G.m;
    if (m.phase !== 'rally') return;
    const p = m.point.turn, o = 1 - p, word = m.point.word;
    const secs = m.shotTime(p);
    G.sel[p] = -1; G.typed = '';
    setKeyboard(o, false);
    if (isBot(p)) {
      renderTiles(p, word, { land: true });
      $('.bot-think', panelOf(p)).hidden = false;
      setMsg(o, esc(t('thinking', { name: playerName(p) })));
      const rep = G.bots[p].reply(m);
      startClock(p, secs, onTimeout);
      if (rep.word && rep.delay < secs) G.plan = { at: rep.delay, fn: () => playShot(p, rep.word) };
    } else {
      renderTiles(p, word, { land: true, active: true });
      setKeyboard(p, true);
      setMsg(p, esc(G.firstShot[p] ? t('firstTurn') : t('yourTurn')), 'turn');
      if (!isBot(o)) setMsg(o, esc(t('thinking', { name: playerName(p) })));
      startClock(p, secs, onTimeout);
    }
  }

  function onTile(i, k, viaKey) {
    const m = G && G.m;
    if (!m || G.paused || m.phase !== 'rally' || m.point.turn !== i || G.pointBusy) return;
    G.sel[i] = G.sel[i] === k ? -1 : k;
    G.kbdSel = !!viaKey && G.sel[i] >= 0;
    G.typed = '';
    renderTiles(i, m.point.word, { sel: G.sel[i], active: true });
    setMsg(i, esc(G.sel[i] >= 0 ? t('pickKey') : t('yourTurn')), 'turn');
    Sfx.tap();
  }

  function onKey(i, ch, keyEl) {
    const m = G && G.m;
    if (!m || G.paused || m.phase !== 'rally' || m.point.turn !== i || G.pointBusy) return;
    Sfx.key();
    if (keyEl) { keyEl.classList.add('down'); setTimeout(() => keyEl.classList.remove('down'), 120); }
    const k = G.sel[i];
    if (k < 0) {
      setMsg(i, esc(t('pickTile')), 'err');
      const tiles = $('.tiles', panelOf(i));
      tiles.classList.remove('land'); void tiles.offsetWidth; tiles.classList.add('land');
      return;
    }
    const cur = m.point.word;
    if (cur[k] === ch) return;
    attempt(i, cur.slice(0, k) + ch + cur.slice(k + 1), k);
  }

  // Try a word for player i (from the on-screen keys or the physical keyboard).
  function attempt(i, word, at) {
    const m = G.m;
    const c = m.check(word);
    if (!c.ok) {
      if (c.reason === 'used' || c.reason === 'unknown') {
        Sfx.err();
        setMsg(i, esc(t(c.reason === 'used' ? 'errUsed' : 'errUnknown', { w: U(word) })), 'err');
        const tiles = $('.tiles', panelOf(i));
        const tile = tiles.children[at];
        if (tile) {
          tile.textContent = U(word[at]);
          tile.classList.remove('bad'); void tile.offsetWidth; tile.classList.add('bad');
          setTimeout(() => { if (G && G.m.point.word === m.point.word && G.m.point.turn === i) { tile.textContent = U(m.point.word[at]); tile.classList.remove('bad'); } }, 520);
        }
      }
      return false;
    }
    playShot(i, word, c.at);
    return true;
  }

  function playShot(p, word) {
    const m = G.m;
    const before = m.point.word;
    const r = m.shot(word);
    if (!r.ok) return;
    G.firstShot[p] = false;
    stopClock();
    G.pointBusy = true;
    if (isBot(p)) $('.bot-think', panelOf(p)).hidden = true;
    const at = G.lex.diff(before, word);
    renderTiles(p, word, { mark: at, wait: true });
    setKeyboard(p, false);
    setMsg(p, esc(t('sentBy', { name: playerName(p) })) + ' <b>' + esc(U(word)) + '</b>');
    courtInfo();
    if (r.how === 'smash') {
      Sfx.smash();
      flyBall(1 - p, () => pointOver(r), { fast: true });
    } else {
      Sfx.hit(1);
      flyBall(1 - p, () => { G.pointBusy = false; enterTurn(); });
    }
  }

  function onTimeout() {
    const m = G.m;
    if (m.phase !== 'rally' || G.pointBusy) return;
    const loser = m.point.turn;
    const r = m.timeout();
    if (!r) return;
    G.pointBusy = true;
    setKeyboard(loser, false);
    Sfx.miss();
    flyBall(loser, () => pointOver(r), { out: true });
  }

  function altsHtml(left) {
    const c = left.common.slice(0, 5), rare = left.rare.slice(0, c.length >= 3 ? 0 : 3);
    if (!c.length && !rare.length) return esc(t('none'));
    let h = '';
    if (c.length) h += esc(t('could')) + ' ' + c.map(w => `<span class="alt">${esc(U(w))}</span>`).join('');
    if (rare.length) h += (c.length ? '<br>' : esc(t('couldRare')) + ' ') + rare.map(w => `<span class="alt rare">${esc(U(w))}</span>`).join('');
    return h;
  }

  function pointOver(r) {
    const m = G.m, w = r.winner, l = 1 - w;
    stopClock();
    renderScore();
    for (const i of [0, 1]) setKeyboard(i, false);
    if (r.how === 'smash') {
      banner(t('smash'), 'smash');
      setMsg(w, esc(t('smashYou', { w: U(r.word) })), 'turn');
      setMsg(l, esc(t('smashThem', { w: U(r.word) })));
    } else {
      banner(G.mode === 'bot' && w === 0 ? t('pointYou') : t('point', { name: playerName(w) }));
      setMsg(w, esc(t('pointYou')), 'turn');
      setMsg(l, esc(t('timeUp')) + ' ' + altsHtml(r.left));
      if (isBot(l)) setMsg(w, esc(t('pointYou')) + ' ' + esc(t('timeUp')), 'turn');
    }
    Sfx.point(G.mode === 'duo' || w === 0);
    if (r.matchOver) {
      wait(2.4, () => { banner(t('game', { name: playerName(w) })); Sfx.match(); });
      wait(4.2, () => endMatch(r));
      return;
    }
    if (r.gameOver) {
      wait(2.4, () => { banner(t('game', { name: playerName(w) })); Sfx.game(); renderScore(); });
      wait(4.4, () => { m.next(); enterServe(); });
      return;
    }
    const delay = r.how === 'time' && !isBot(l) ? 4.6 : 2.8;
    G.skipTo = () => { if (G.skipTo) { G.skipTo = null; G.waits = []; m.next(); enterServe(); } };
    wait(delay, () => { if (G.skipTo) G.skipTo(); });
  }
  $('#court').addEventListener('pointerdown', e => {
    if (e.target.closest('#pauseBtn')) return;
    if (G && G.skipTo && G.m.phase === 'pointOver' && !G.paused) G.skipTo();
  });

  // ---------- physical keyboard ----------
  document.addEventListener('keydown', e => {
    if (!G || G.paused || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { pause(); return; }
    const m = G.m;
    if (m.phase === 'serve' && !isBot(m.server) && /^[1-3]$/.test(e.key)) { doServe(m.point.serveOptions[+e.key - 1]); return; }
    if (m.phase !== 'rally' || G.pointBusy) return;
    const p = m.point.turn;
    if (isBot(p)) return;
    const word = m.point.word;
    if (e.key === 'Backspace') { G.typed = G.typed.slice(0, -1); showTyped(p); e.preventDefault(); return; }
    if (/^[1-9]$/.test(e.key) && +e.key <= word.length) { onTile(p, +e.key - 1, true); return; }
    const ch = KT.lower(e.key, S.lang);
    if (ch.length !== 1 || !G.lex.alpha.includes(ch)) return;
    e.preventDefault();
    // 1-4 then a letter: change that letter. Otherwise type the whole new word.
    if (G.sel[p] >= 0 && G.kbdSel && !G.typed) { G.kbdSel = false; onKey(p, ch); return; }
    G.sel[p] = -1; G.kbdSel = false;
    G.typed += ch;
    if (G.typed.length >= word.length) {
      const typed = G.typed; G.typed = '';
      const at = G.lex.diff(word, typed);
      if (at < 0) { Sfx.err(); setMsg(p, esc(t('yourTurn')), 'err'); renderTiles(p, word, { active: true, land: true }); return; }
      if (!attempt(p, typed, at)) renderTiles(p, word, { active: true });
      return;
    }
    showTyped(p);
  });
  function showTyped(p) {
    const word = G.m.point.word, ty = G.typed;
    renderTiles(p, ty + word.slice(ty.length), { active: true, typed: ty.length || undefined });
  }

  // ---------- pause ----------
  function pause() {
    if (!G || G.paused || G.m.phase === 'matchOver') return;
    G.paused = true;
    $('#pauseSheet').hidden = false;
  }
  function resume() {
    if (!G) return;
    G.paused = false;
    G.lastTs = performance.now();
    $('#pauseSheet').hidden = true;
  }
  $('#pauseBtn').addEventListener('click', e => { e.stopPropagation(); pause(); });
  $('#resumeBtn').addEventListener('click', resume);
  $('#quitBtn').addEventListener('click', () => { $('#pauseSheet').hidden = true; toMenu(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  function toMenu() {
    stopGame();
    $('#game').classList.remove('on');
    $('#menu').classList.add('on');
    $('#endSheet').hidden = true;
    syncMenu();
  }

  // ---------- end ----------
  function endMatch(r) {
    const m = G.m, w = m.winner;
    stopClock();
    const save = loadSave();
    if (G.mode === 'bot') {
      if (w === 0) save.bot[S.level].w++; else save.bot[S.level].l++;
      save.smashes += m.stats.smashes[0];
    } else {
      save.duo++;
      save.smashes += m.stats.smashes[0] + m.stats.smashes[1];
    }
    if (m.stats.longest > save.longest) { save.longest = m.stats.longest; save.longestWords = m.stats.longestWords; }
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
    const scoreLine = S.format === 1 ? `${r.gamePoints[0]}–${r.gamePoints[1]}` : `${m.games[0]}–${m.games[1]}`;
    const mins = Math.max(1, Math.round((Date.now() - G.started) / 60000));
    labNote(G.mode === 'bot'
      ? `Bota karşı (${S.level}): ${w === 0 ? 'kazandı' : 'kaybetti'} ${scoreLine} · en uzun ralli ${m.stats.longest} · ${m.stats.smashes[0]} smaç · ${mins} dk`
      : `Maç bitti: ${playerName(0)} ${scoreLine} ${playerName(1)} · en uzun ralli ${m.stats.longest} · smaç ${m.stats.smashes[0]}–${m.stats.smashes[1]} · ${mins} dk`);

    const title = G.mode === 'bot' ? (w === 0 ? t('youWin') : t('botWins')) : t('winTitle', { name: playerName(w) });
    $('#endTitle').textContent = title;
    $('#endScore').textContent = `${playerName(0)} ${scoreLine} ${playerName(1)}`;
    const items = [];
    if (m.stats.longestWords.length) items.push(t('statLongest', { n: m.stats.longest }) + '<br>' + m.stats.longestWords.map(x => esc(U(x))).join(' → '));
    items.push(t('statSmash', { a: G.mode === 'bot' ? m.stats.smashes[0] + '–' + m.stats.smashes[1] : `${esc(playerName(0))} ${m.stats.smashes[0]} · ${esc(playerName(1))} ${m.stats.smashes[1]}` }));
    if (G.mode === 'duo') items.push(t('statWords', { a: `${esc(playerName(0))} ${m.stats.words[0]} · ${esc(playerName(1))} ${m.stats.words[1]}` }));
    $('#endStats').innerHTML = items.map(x => '<li>' + x + '</li>').join('');
    const sheet = $('#endSheet');
    sheet.classList.toggle('duo', G.mode === 'duo');
    $('#endMirror').innerHTML = `<h2>${esc(title)}</h2><p class="end-score">${esc(playerName(1))} ${scoreLine.split('–').reverse().join('–')} ${esc(playerName(0))}</p>`;
    sheet.hidden = false;
  }
  $('#againBtn').addEventListener('click', () => { const fs = G ? 1 - G.firstServer : 0; startMatch(S.mode === 'bot' ? 0 : fs); });
  $('#menuBtn').addEventListener('click', toMenu);

  // ---------- layout ----------
  function layout() {
    if (!G) return;
    const n = S.len;
    for (const i of [0, 1]) {
      const p = panelOf(i);
      if (isBot(i)) { p.style.removeProperty('--tw'); continue; }
      const W = Math.min(p.clientWidth - 20, 640), Hh = p.clientHeight - 20;
      const rowMax = Math.max(...KT.KEYS[S.lang].map(r => r.length));
      const kw = Math.max(22, Math.min(58, Math.floor(W / (rowMax + (rowMax - 1) * 0.16))));
      let tw = Math.min(104, Math.floor(W / (n + (n - 1) * 0.12)) - 4, Math.floor(Hh * 0.22));
      tw = Math.max(36, tw);
      const fixed = 30 + 46 + 9 + 8 * 4 + tw * 1.14 + 8;    // head, two-line message, clock, gaps, tiles
      const kh = Math.max(30, Math.min(Math.round(kw * 1.5), Math.floor((Hh - fixed - kw * 0.36) / 3)));
      p.style.setProperty('--tw', tw + 'px');
      p.style.setProperty('--kw', kw + 'px');
      p.style.setProperty('--kh', kh + 'px');
    }
  }
  window.addEventListener('resize', layout);

  // ---------- start ----------
  $('#rotateNote').classList.add('need');
  syncMenu();
  if (!S.seenHow && !readJSON(SAVE_KEY)) setTimeout(openHow, 400);

  if (DEBUG) {
    window.__kt = {
      KT, S, T, lexFor, startMatch, toMenu, pause, resume, attempt, playShot,
      get G() { return G; },
      set speed(v) { if (G) G.speed = v; },
      timeout() { if (G && G.clock.running) G.clock.left = 0.001; },
    };
  }
})();

</script>
</body>
</html>
