<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060d15">
<title>Uzay Hattı</title>
<meta name="description" content="Uzay limanını yönet: yolcuları Ay, Mars ve ötesine taşı. Roketi yeşilde fırlat, bilet parası 2 katı!">
<meta property="og:type" content="website">
<meta property="og:title" content="Uzay Hattı">
<meta property="og:description" content="Uzay limanını yönet: yolcuları Ay, Mars ve ötesine taşı. Roketi yeşilde fırlat, bilet parası 2 katı!">
<meta property="og:image" content="https://uzigames.com/lab/uzay-hatti/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<script src="/hesap/supabase.js"></script>
<script src="/hesap/hesap.js" data-oyun="uzay-hatti" data-kayit="uzay-hatti-v1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Martian+Mono:wght@400;600;800&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Uzay Hattı: gece kalkış terminali. Lacivert-petrol gök, tek vurgu sinyal turuncusu, sıcak beyaz metin.
     Düzen: üstte canlı sahne + mekanik kalkış panosu, altta yönetim paneli (geniş ekranda sağ sütun). */
  --ink:#060d15; --panel:#0b1721; --card:#102130; --card2:#0d1b27; --line:#1c3242; --text:#f3ebdb; --muted:#8fa3b0; --dim:#5e7281;
  --signal:#ff6a2b; --signal-hi:#ff8d57; --signal-ink:#200c02;
  --mint:#5fe3b4; --amber:#ffc34d; --gem:#b8a2ff; --danger:#ff6474;
  --flap:#0a1117; --flap-text:#ffd37a;
  --display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --mono:'Martian Mono', ui-monospace, Menlo, Consolas, monospace;
  --body:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.35}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(190px,38%) auto auto minmax(0,1fr);
  grid-template-areas:"hud" "stage" "board" "flow" "side"}

/* HUD */
#hud{grid-area:hud;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;background:linear-gradient(#0b1621,#08121b);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--display);font-size:11px;line-height:1.02;color:var(--signal);letter-spacing:.03em;display:none}
.money{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.money b{display:block;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.money small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mint);white-space:nowrap;margin-top:2px}
.coin{flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff5c9 0,#ffcf5c 38%,#d48b17 100%);box-shadow:inset 0 0 0 2px rgba(110,60,0,.35),0 0 12px rgba(255,195,77,.25)}
.gems{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 7px;border:1px solid #2b2752;background:#14122a;border-radius:999px;font-family:var(--mono);font-weight:800;font-size:13px;color:#e4dcff}
.gems svg{width:16px;height:16px}
.ibtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0e1c28;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:18px;height:18px}
.ibtn.off{color:var(--dim)}

/* Stage */
#stage{grid-area:stage;position:relative;overflow:hidden;background:#05101a;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#radio{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;background:rgba(6,14,22,.82);border:1px solid rgba(255,106,43,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:12.5px;line-height:1.35;max-width:560px;z-index:3;animation:dropin .28s ease-out}
#radio .r-from{flex:none;font-family:var(--mono);font-weight:800;font-size:9.5px;letter-spacing:.06em;color:var(--signal);background:rgba(255,106,43,.12);padding:3px 6px;border-radius:5px;margin-top:1px}
#radio .r-txt{min-height:1.35em}
@keyframes dropin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#evchip{position:absolute;left:8px;top:8px;z-index:2;display:flex;align-items:center;gap:8px;max-width:calc(100% - 128px);padding:6px 6px 6px 10px;border-radius:999px;background:rgba(32,18,6,.85);border:1px solid rgba(255,195,77,.55);font-weight:700;font-size:12.5px;color:#ffe2a6;overflow:hidden;animation:dropin .28s ease-out}
#evchip .ev-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#evchip .ev-btn{flex:none;border:0;border-radius:999px;background:var(--amber);color:#2a1a00;font-weight:800;font-size:12px;padding:6px 11px}
#evchip .ev-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:100%;transform-origin:left;transform:scaleX(var(--p,1))}
#boosts{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:1;pointer-events:none}
.boost{font-family:var(--mono);font-weight:800;font-size:10px;padding:4px 7px;border-radius:6px;background:rgba(95,227,180,.14);border:1px solid rgba(95,227,180,.45);color:var(--mint)}

/* Launch control */
#btnLaunch{position:absolute;left:8px;bottom:8px;z-index:2;width:min(200px,42%);border:0;border-radius:14px;padding:7px 10px 8px;text-align:left;
  background:linear-gradient(180deg,#ff7a3d,#f45a1c);color:var(--signal-ink);box-shadow:0 6px 0 #a83a0e,0 10px 26px rgba(255,106,43,.35);transform:translateY(0);transition:transform .06s}
#btnLaunch:active{transform:translateY(3px);box-shadow:0 3px 0 #a83a0e,0 6px 18px rgba(255,106,43,.35)}
#btnLaunch .l-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.04em}
#btnLaunch .l-top em{font-style:normal;opacity:.75}
#btnLaunch .l-cta{display:block;font-family:var(--display);font-size:19px;line-height:1;margin-top:5px;letter-spacing:.02em}
.gauge{position:relative;display:block;height:11px;margin-top:5px;border-radius:6px;background:#3d1606;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.gauge .gz{position:absolute;top:0;bottom:0;background:#d99a2b}
.gauge .pz{position:absolute;top:0;bottom:0;background:#5fe3b4}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;left:0;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff;will-change:transform}
#btnLaunch .l-timer{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:2px;background:rgba(32,12,2,.45);transform-origin:left;transform:scaleX(var(--t,1))}

/* Departure board */
#board{grid-area:board;background:#05090d;border-top:1px solid #142632;border-bottom:1px solid #142632;padding:6px 10px 7px;font-family:var(--mono);font-size:11px}
.bhead{display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--dim);margin-bottom:4px}
.bhead b{color:var(--flap-text);font-weight:800;letter-spacing:.08em}
.brow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;height:21px}
.brow .cells{display:flex;gap:1.5px}
.brow .cells i{position:relative;display:inline-block;width:1.18em;height:17px;line-height:17px;text-align:center;font-style:normal;font-weight:800;color:var(--flap-text);background:linear-gradient(#141e26 0 49%,#0b1319 51% 100%);border-radius:2px;font-size:11px}
.brow .cells i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#03070a}
.brow .inf{justify-self:end}
.brow .dot{display:none}
.brow.r-ready .st i{color:#7dffcb}
.brow.r-lock .cells i{color:#56656f}
.brow:nth-of-type(n+5){display:none}

/* Flow */
#flow{grid-area:flow;display:flex;align-items:stretch;gap:4px;padding:7px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.fchip{position:relative;flex:1;min-width:0;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:5px 6px 5px 8px;text-align:left}
.fchip span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip b{display:block;font-family:var(--mono);font-size:12px;font-weight:800;white-space:nowrap}
.fchip.bn{border-color:var(--signal);background:linear-gradient(180deg,rgba(255,106,43,.18),rgba(255,106,43,.06));animation:pulse 1.6s ease-in-out infinite}
.fchip.bn::after{content:"DARBOĞAZ";position:absolute;right:4px;top:-7px;font-family:var(--mono);font-size:7.5px;font-weight:800;letter-spacing:.06em;background:var(--signal);color:var(--signal-ink);padding:2px 4px;border-radius:4px}
.farrow{flex:none;align-self:center;width:6px;height:6px;border-top:2px solid var(--dim);border-right:2px solid var(--dim);transform:rotate(45deg);margin:0 1px}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,106,43,.18)}}

/* Side: tabs + panel */
#side{grid-area:side;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 18px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
#tabs{order:2;flex:none;display:flex;border-top:1px solid var(--line);background:#08131c}
.tab{position:relative;flex:1;border:0;background:none;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--signal);color:var(--signal-ink);font-family:var(--mono);font-size:9.5px;font-weight:800;line-height:16px}
.tab.new::after{content:"YENİ";position:absolute;top:2px;right:8%;font-family:var(--mono);font-size:7.5px;font-weight:800;color:var(--signal)}

/* Cards */
.sect{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px 0}
.sect h3{margin:0;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.03em;color:var(--text)}
.sect p{margin:0;font-size:11.5px;color:var(--muted)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:7px}
.card.hot{border-color:rgba(255,106,43,.75);box-shadow:0 0 0 1px rgba(255,106,43,.25) inset}
.card.hot::before{content:"ÖNCE BU";position:absolute;right:10px;top:-8px;font-family:var(--mono);font-weight:800;font-size:8.5px;letter-spacing:.06em;background:var(--signal);color:var(--signal-ink);padding:2px 6px;border-radius:5px}
.crow{display:flex;align-items:center;gap:10px;min-width:0}
.cico{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#0b1823;border:1px solid var(--line);color:var(--amber)}
.cico svg{width:19px;height:19px}
.cmain{flex:1;min-width:0}
.ctitle{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:14px}
.ctitle .lv{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
.cstat{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.cstat b{color:var(--text);font-weight:600}
.cdesc{font-size:12px;color:var(--muted)}
.mile{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim)}
.mile i{flex:1;height:4px;border-radius:2px;background:#0a1620;overflow:hidden}
.mile i::before{content:"";display:block;height:100%;width:var(--p,0%);background:var(--amber)}
.buy{flex:none;min-width:104px;border:0;border-radius:10px;padding:7px 10px;background:var(--signal);color:var(--signal-ink);text-align:center;box-shadow:0 3px 0 #a83a0e}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #a83a0e}
.buy b{display:block;font-family:var(--mono);font-weight:800;font-size:12.5px;white-space:nowrap}
.buy small{display:block;font-size:10.5px;font-weight:700;opacity:.85;white-space:nowrap}
.buy.meh{background:#22313c;color:#cfd9df;box-shadow:0 3px 0 #111d26}
.buy.meh small{opacity:.7}
.buy:disabled{background:#1c2c38;color:#71858f;box-shadow:0 3px 0 #0f1a22;cursor:default}
.buy:disabled:active{transform:none}
.buy.max{background:#1a2833;color:var(--muted);box-shadow:none}
.gain{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--mint);text-align:center;margin-top:3px;white-space:nowrap}
.gain.zero{color:var(--dim);font-weight:600}
.bcol{flex:none;display:flex;flex-direction:column;align-items:stretch}
.btn3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mini{border:0;border-radius:10px;padding:6px 4px 7px;background:#16293a;color:var(--text);text-align:center;box-shadow:0 3px 0 #0b1621;min-width:0}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1621}
.mini span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{display:block;font-family:var(--mono);font-weight:800;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--mint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini em.zero{color:var(--dim)}
.mini.can{background:linear-gradient(180deg,#ff7a3d,#f45a1c);color:var(--signal-ink);box-shadow:0 3px 0 #a83a0e}
.mini.can span,.mini.can em{color:rgba(32,12,2,.8)}
.mini:disabled{opacity:.6;cursor:default}
.mini.done{opacity:.5}
.rhead{display:flex;align-items:center;gap:10px}
.planet{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset -6px -5px 0 rgba(0,0,0,.35),0 0 12px var(--pc,#fff3)}
.rname{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.02em}
.rmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rstat{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rstat b{color:var(--text);font-weight:600}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:#1a2a36;color:var(--muted)}
.pill.full{background:rgba(255,106,43,.16);color:var(--signal-hi);border:1px solid rgba(255,106,43,.45)}
.pill.ok{background:rgba(95,227,180,.12);color:var(--mint)}
.card.lock{border-style:dashed;background:var(--card2)}
.card.mystery{opacity:.65}
.toggle{display:flex;gap:3px;padding:3px;border-radius:9px;background:#0a1620;border:1px solid var(--line)}
.toggle button{border:0;background:none;border-radius:7px;padding:4px 9px;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:#1f3446;color:var(--text)}
.bar{height:6px;border-radius:3px;background:#0a1620;overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--mint);border-radius:3px;transition:width .25s}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.mrow b{font-family:var(--mono);color:var(--text);font-weight:600}
.reward{font-family:var(--mono);font-size:10.5px;color:var(--gem)}
.claim{border:0;border-radius:10px;padding:9px 12px;background:var(--mint);color:#032118;font-weight:800;box-shadow:0 3px 0 #23966f}
.claim:active{transform:translateY(2px);box-shadow:0 1px 0 #23966f}
.ghost{border:1px solid var(--line);background:#0e1c28;border-radius:10px;padding:9px 12px;font-weight:700;color:var(--text)}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;border-radius:2px;background:#1a2a36}
.pips i.on{background:var(--gem)}
.gbuy{border:0;border-radius:10px;padding:7px 10px;min-width:92px;background:#2a2357;color:#efe9ff;font-weight:800;box-shadow:0 3px 0 #17123a;text-align:center}
.gbuy:active{transform:translateY(2px);box-shadow:0 1px 0 #17123a}
.gbuy:disabled{background:#1a2230;color:#6f7f8d;box-shadow:0 3px 0 #0f1720;cursor:default}
.gbuy b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:12px}
.gbuy svg{width:12px;height:12px}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sv{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#0b1823;display:grid;place-items:center;color:var(--dim);padding:6px}
.sv svg{width:62%;height:62%}
.sv.got{background:radial-gradient(circle at 50% 40%,#1d2f45,#0d1b27);border-color:#2c4660;color:var(--amber)}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.xbtn{border:1px solid var(--line);background:#0e1c28;border-radius:10px;padding:8px 6px;text-align:center}
.xbtn b{display:block;font-size:11.5px;font-weight:800}
.xbtn span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.xbtn em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--gem);margin-top:2px}
.xbtn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.note{font-size:11.5px;color:var(--muted)}
.warn{font-size:11.5px;color:var(--signal-hi)}

/* Modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(2,6,10,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mcard{width:min(400px,100%);max-height:calc(100% - 20px);overflow:auto;background:#0f1f2c;border:1px solid #27445a;border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mcard h2{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;text-wrap:balance}
#mBody{font-size:13.5px;color:#d7d0c2}
#mBody p{margin:0 0 8px}
#mBody .big{font-family:var(--display);font-size:28px;color:var(--mint);margin:6px 0 2px}
#mBody ol{margin:0 0 6px;padding-left:20px}
#mBody li{margin-bottom:5px}
#mBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#mBtns button{flex:1;min-width:120px}
.mbtn{border:0;border-radius:11px;padding:11px 12px;font-weight:800;background:var(--signal);color:var(--signal-ink);box-shadow:0 3px 0 #a83a0e}
.mbtn.sec{background:#1c2f3e;color:var(--text);box-shadow:0 3px 0 #0e1a24}
.mbtn.gem{background:#3a2f7a;color:#f0eaff;box-shadow:0 3px 0 #1d1745}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:#1d2e3c;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#7e919d;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--signal)}

<script>
/* ===== EKONOMI (pure functions, shared by game + simulation) ===== */
var ECON = (function () {
  var CFG = {
    A0: 0.5, Astep: 0.25, Acost0: 8, Agrowth: 1.12,
    C0: 0.4, Cstep: 0.2, Ccost0: 12, Cgrowth: 1.12,
    mEvery: 25,
    boardTime: 1.2, autoWait: 2.0, padClear: 0.8, maxWait: 5,
    seatGrowth: 1.14, seatCostK: 0.5,
    speedGrowth: 1.6, speedCostK: 1.2, speedMax: 15, speedStep: 0.92,
    fleetCostK: [8, 50], fleetMax: 3,
    shareBase: 1.6,
    offlineBaseH: 12
  };
  var ROUTES = [
    { id: 'ay',     name: 'Ay',      dat: "Ay'a",      price: 4,     trip: 6,  seats: 4,  value: 6,     color: '#d8d1c0' },
    { id: 'mars',   name: 'Mars',    dat: "Mars'a",    price: 30,    trip: 9,  seats: 6,  value: 500,   color: '#ff6a45' },
    { id: 'venus',  name: 'Venüs',   dat: "Venüs'e",   price: 220,   trip: 12, seats: 8,  value: 1e4,   color: '#f1c24f' },
    { id: 'europa', name: 'Europa',  dat: "Europa'ya", price: 1600,  trip: 16, seats: 10, value: 2.2e5, color: '#8fd4ff' },
    { id: 'saturn', name: 'Satürn',  dat: "Satürn'e",  price: 1.2e4, trip: 20, seats: 12, value: 5e6,   color: '#e9b37b' },
    { id: 'titan',  name: 'Titan',   dat: "Titan'a",   price: 9e4,   trip: 25, seats: 14, value: 1.2e8, color: '#ffa04a' },
    { id: 'neptun', name: 'Neptün',  dat: "Neptün'e",  price: 7e5,   trip: 30, seats: 16, value: 2e9,   color: '#5a86ff' },
    { id: 'pluton', name: 'Plüton',  dat: "Plüton'a",  price: 6e6,   trip: 36, seats: 18, value: 4e10,  color: '#f4b3c6' }
  ];
  function mm(L) { return Math.pow(2, Math.floor(L / CFG.mEvery)); }
  function mult(s, boost) {
    var r = s.research || {};
    var b = boost || {};
    return {
      ticket: (1 + 0.25 * (r.konfor || 0)) * (1 + 0.05 * ((s.souvenirs || []).length)) * (1 + 0.1 * (s.stars || 0)) * (b.ticket || 1),
      demand: (1 + 0.3 * (r.reklam || 0)) * (b.demand || 1),
      checkin: (1 + 0.3 * (r.checkin || 0)),
      trip: (1 - 0.06 * (r.motor || 0)) / (b.speed || 1),
      autoWait: Math.max(0.5, CFG.autoWait - 0.3 * (r.otopilot || 0)),
      autoMult: 1 + 0.1 * (r.otopilot || 0)
    };
  }
  function arrival(s, L, m) { L = L || s.lvA; m = m || mult(s); return (CFG.A0 + CFG.Astep * (L - 1)) * mm(L) * m.demand; }
  function checkin(s, L, m) { L = L || s.lvC; m = m || mult(s); return (CFG.C0 + CFG.Cstep * (L - 1)) * mm(L) * m.checkin; }
  function seats(i, L) { var R = ROUTES[i]; return Math.round(R.seats * (1 + 0.5 * (L - 1)) * mm(L)); }
  function trip(i, L, m) { var R = ROUTES[i]; return Math.max(3.6, R.trip * Math.pow(CFG.speedStep, L - 1) * (m ? m.trip : 1)); }
  function cap(s, i, m, rt) {
    rt = rt || s.routes[i]; m = m || mult(s);
    var K = seats(i, rt.seats), T = trip(i, rt.speed, m), w = m.autoWait;
    return Math.min(rt.fleet * K / (T + CFG.boardTime + w), K / (CFG.boardTime + w + CFG.padClear));
  }
  function shares(s) {
    var tot = 0, out = [];
    for (var i = 0; i < ROUTES.length; i++) { var w = s.routes[i].u ? Math.pow(CFG.shareBase, i) : 0; out.push(w); tot += w; }
    for (var j = 0; j < out.length; j++) out[j] = tot ? out[j] / tot : 0;
    return out;
  }
  // steady-state flow (passive, no tapping). Demand split by shares; overflow
  // rebooks to routes with free seats, most expensive first (never wastes a passenger
  // while any rocket has room).
  function flow(s, boost) {
    var m = mult(s, boost);
    var A = arrival(s, s.lvA, m), C = checkin(s, s.lvC, m);
    var Fin = Math.min(A, C), sh = shares(s);
    var caps = [], x = [], F = 0, i;
    for (i = 0; i < ROUTES.length; i++) {
      if (!s.routes[i].u) { caps.push(0); x.push(0); continue; }
      var c = cap(s, i, m); caps.push(c); F += c;
      x.push(Math.min(Fin * sh[i], c));
    }
    var used = 0; for (i = 0; i < x.length; i++) used += x[i];
    var over = Math.max(0, Fin - used);
    for (i = ROUTES.length - 1; i >= 0 && over > 1e-12; i--) {
      if (!s.routes[i].u) continue;
      var add = Math.min(over, caps[i] - x[i]); x[i] += add; over -= add;
    }
    var income = 0, carried = 0, per = [];
    for (i = 0; i < ROUTES.length; i++) {
      if (!s.routes[i].u) { per.push(null); continue; }
      income += x[i] * ROUTES[i].price * m.ticket * m.autoMult;
      carried += x[i];
      per.push({ cap: caps[i], demand: Fin * sh[i], carried: x[i], share: sh[i], full: x[i] >= caps[i] * 0.999 });
    }
    var bn = 'A', lo = A;
    if (C < lo * 0.999) { bn = 'C'; lo = C; }
    if (F < lo * 0.999) { bn = 'F'; lo = F; }
    return { A: A, C: C, F: F, Fin: Fin, bottleneck: bn, income: income, carried: carried, lost: over, per: per, m: m };
  }
  function geoCost(base, g, L, n) { return base * Math.pow(g, L - 1) * (Math.pow(g, n) - 1) / (g - 1); }
  function geoMax(base, g, L, money, cap) {
    var first = base * Math.pow(g, L - 1);
    if (money < first) return 0;
    var n = Math.floor(Math.log(money * (g - 1) / first + 1) / Math.log(g));
    if (cap != null) n = Math.min(n, cap);
    return Math.max(0, n);
  }
  var cost = {
    A: function (L, n) { return geoCost(CFG.Acost0, CFG.Agrowth, L, n || 1); },
    C: function (L, n) { return geoCost(CFG.Ccost0, CFG.Cgrowth, L, n || 1); },
    seats: function (i, L, n) { return geoCost(ROUTES[i].value * CFG.seatCostK, CFG.seatGrowth, L, n || 1); },
    speed: function (i, L, n) { return geoCost(ROUTES[i].value * CFG.speedCostK, CFG.speedGrowth, L, n || 1); },
    fleet: function (i, f) { return ROUTES[i].value * CFG.fleetCostK[f - 1]; },
    unlock: function (i) { return i === 0 ? 0 : ROUTES[i].value; }
  };
  var maxBuy = {
    A: function (L, money) { return geoMax(CFG.Acost0, CFG.Agrowth, L, money); },
    C: function (L, money) { return geoMax(CFG.Ccost0, CFG.Cgrowth, L, money); },
    seats: function (i, L, money) { return geoMax(ROUTES[i].value * CFG.seatCostK, CFG.seatGrowth, L, money); },
    speed: function (i, L, money) { return geoMax(ROUTES[i].value * CFG.speedCostK, CFG.speedGrowth, L, money, CFG.speedMax - L); }
  };
  function starsFor(runEarned) { return runEarned < 1e8 ? 0 : Math.floor(3 * Math.pow(runEarned / 1e8, 0.4)); }
  return { CFG: CFG, ROUTES: ROUTES, mm: mm, mult: mult, arrival: arrival, checkin: checkin, seats: seats, trip: trip, cap: cap, shares: shares, flow: flow, cost: cost, maxBuy: maxBuy, geoCost: geoCost, starsFor: starsFor };
})();
if (typeof module !== 'undefined') module.exports = ECON;

</script>

var FLAPS = [], FLAP_CH = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ0123456789';
function flapSet(el, text, len) {
  text = upTR(text || '');
  while (text.length < len) text += ' ';
  text = text.slice(0, len);
  if (!el._cells) {
    el._cells = []; el.textContent = '';
    for (var i = 0; i < len; i++) { var s = document.createElement('i'); s.textContent = ' '; el.appendChild(s); el._cells.push({ el: s, tgt: ' ', n: 0 }); }
  }
  for (var j = 0; j < len; j++) {
    var c = el._cells[j], ch = text[j];
    if (c.tgt !== ch) { c.tgt = ch; c.n = 1 + ((Math.random() * 2) | 0); if (FLAPS.indexOf(c) < 0) FLAPS.push(c); }
  }
}
function flapTick() {
  for (var k = FLAPS.length - 1; k >= 0; k--) {
    var c = FLAPS[k];
    if (c.n > 0) { c.n--; c.el.textContent = FLAP_CH[(Math.random() * FLAP_CH.length) | 0]; }
    else { c.el.textContent = c.tgt === ' ' ? ' ' : c.tgt; FLAPS.splice(k, 1); SFX.flap(); }
  }
}
function routeStatus(i) {
  if (!S.routes[i].u) return { st: nextRoute() === i ? 'YAKINDA' : '-------', inf: '', cls: 'r-lock' };
  var rs = RT.rockets[i] || [], K = E.seats(i, S.routes[i].seats), pr = padRocket(i);
  if (pr) {
    if (pr.st === 'ready') return { st: 'HAZIR', inf: '%' + Math.round(10 * pr.load / K) * 10, cls: 'r-ready' };
    if (pr.st === 'land') return { st: 'İNİŞ', inf: '', cls: '' };
    return { st: 'BİNİŞ', inf: '%' + Math.round(10 * pr.load / K) * 10, cls: '' };
  }
  var best = Infinity, launching = false;
  rs.forEach(function (r) {
    if (r.st === 'launch') launching = true;
    if (r.st === 'away') best = Math.min(best, r.away + LAND_T);
    if (r.st === 'launch') best = Math.min(best, (LAUNCH_T - r.t) + Math.max(0.4, r.trip - LAUNCH_T - LAND_T) + LAND_T);
  });
  if (launching && best > 3) return { st: 'KALKIŞ', inf: fmtClock(best), cls: '' };
  if (isFinite(best)) return { st: 'UÇUŞTA', inf: fmtClock(best), cls: '' };
  return { st: 'BEKLER', inf: '', cls: '' };
}
function updateBoard() {
  var rows = document.querySelectorAll('#board .brow'), list = [], i;
  for (i = ROUTES.length - 1; i >= 0; i--) if (S.routes[i].u) list.push(i);

  for (var k = 0; k < rows.length; k++) {
    var row = rows[k], ri = list[k];
    var dest = row.querySelector('.dest'), st = row.querySelector('.st'), inf = row.querySelector('.inf');
    if (ri == null) { flapSet(dest, '', 7); flapSet(st, '', 7); flapSet(inf, '', 5); row.className = 'brow r-lock'; continue; }
    var s = routeStatus(ri);

  var body = [h('p', { text: 'Sen yokken ' + fmtTime(res.sec) + ' geçti. Roketler çalışmaya devam etti:' }), h('div', { class: 'big', text: '+' + fmt(res.gain) }), h('p', { class: 'note', text: fmt(res.pax) + ' yolcu taşındı.' + (res.capped ? ' (Çevrimdışı kazanç ' + (CFG.offlineBaseH + 6 * S.research.gece) + ' saatte durur; Gece Vardiyası araştırması uzatır.)' : '') })];
  if (S.exp && Date.now() >= S.exp.end) body.push(h('p', { class: 'reward', text: 'Keşif sondası da döndü, Bilim sekmesinde seni bekliyor.' }));
  showModal('Hoş geldin, Kaptan!', body, [{ label: 'Topla' }]);
}
function start(hotData) {
  var src = (hotData && hotData.v === 1) ? hotData : loadLocal(), fresh = !src;
  S = sanitize(src);
  RT.bootSavedAt = fresh ? 0 : S.savedAt;
  initRockets(); fillMissions();
  SC.cv = $('#scene'); SC.cx = SC.cv.getContext('2d');
  resizeScene();
  if (window.ResizeObserver) new ResizeObserver(function () { resizeScene(); }).observe($('#stage'));
  else window.addEventListener('resize', resizeScene);
  SC.cv.addEventListener('pointerdown', onCanvasTap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { SC.bgKey = ''; LB.gw = 0; });
  setupLaunchUI();
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { audioUnlock(); SFX.tab(); selectTab(b.dataset.tab); if (b.dataset.tab === 'rota') guideStart('rota'); }); });
  document.querySelectorAll('.fchip').forEach(function (b) {
    b.addEventListener('click', function () {
      audioUnlock(); var k = b.dataset.k;
      if (k === 'F') { selectTab('rota'); guideStart('rota'); } else { selectTab('liman'); }
      renderPanel();
      var el = k === 'F' ? $('#panel .card:not(.lock)') : $('#card-' + k);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
    });
  });
  $('#btnMenu').addEventListener('click', function () { audioUnlock(); settingsModal(); });
  $('#btnSound').addEventListener('click', function () { var on = !(S.settings.sfx || S.settings.music); S.settings.sfx = on; S.settings.music = on; audioUnlock(); applyAudioSettings(); markDirty(); updateHUD(); });
  $('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) closeModal(); });
  $('#radio').addEventListener('click', function () { RCUR = null; $('#radio').hidden = true; });
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { if (!AU.ctx || AU.ctx.state !== 'running') audioUnlock(); }, { passive: true }); });
  document.addEventListener('keydown', function (e) {
    var gs = GD.step, gm = gs ? (gs.mode || 'modal') : '', isSp = e.code === 'Space' || e.key === ' ';
    if (gs && gm !== 'tip' && $('#modal').hidden) {
      if (e.key === 'Escape') { e.preventDefault(); endTour(); return; }
      if (gm === 'modal') { if ((e.key === 'Enter' || isSp) && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); guideNext(); } return; }
      if (gm === 'action' && !gs.space) { if (isSp) e.preventDefault(); return; }
    }
    if (isSp && $('#modal').hidden && !RT.paused) { e.preventDefault(); audioUnlock(); tapLaunch(); }
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { saveLocal(); cloudSave(true); } });
  window.addEventListener('pagehide', function () { saveLocal(); });
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') { try { window.claude.hot.snapshot(function () { return snapshot(); }); } catch (e) {} }
  if (!fresh) {
    var away = (Date.now() - S.savedAt) / 1000;
    if (away > 5) { var res = catchUp(away); if (away > 60 && res.gain > 0) welcomeBack(res); }
  }
  selectTab('liman');
  saveLocal();
  window.__UZ = { S: function () { return S; }, RT: RT, E: E, add: addMoney, catchUp: catchUp, ev: startEvent, flow: flowNow, GD: GD, guide: guideStart, sim: function (sec) { for (var t = 0; t < sec; t += 0.05) { GT += 0.05; invalidate(); tickEconomy(0.05); } } };
  requestAnimationFrame(frame);
  setTimeout(cloudInit, 0);
}
var hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(function (d) { start(d && d.v === 1 ? d : null); }); } catch (e) { start(null); } }
else start(hot && hot.data && hot.data.v === 1 ? hot.data : null);
})();
</script>
</body>
</html>
