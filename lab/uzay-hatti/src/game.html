<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060d15">
<title>Uzay Hattı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Martian+Mono:wght@400;600;800&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Uzay Hattı: gece kalkış terminali. Lacivert-petrol gök, tek vurgu sinyal turuncusu, sıcak beyaz metin.
     Düzen: üstte canlı sahne, altta gezegen kartları (geniş ekranda sağ sütun). Az yazı, az sayı. */
  --ink:#060d15; --panel:#0b1721; --card:#102130; --card2:#0d1b27; --line:#1c3242; --text:#f3ebdb; --muted:#8fa3b0; --dim:#5e7281;
  --signal:#ff6a2b; --signal-hi:#ff8d57; --signal-ink:#200c02;
  --mint:#5fe3b4; --amber:#ffc34d; --gem:#b8a2ff; --danger:#ff6474;
  --display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --mono:'Martian Mono', ui-monospace, Menlo, Consolas, monospace;
  --body:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.35}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(220px,46%) minmax(0,1fr);
  grid-template-areas:"hud" "stage" "side"}

/* HUD */
#hud{grid-area:hud;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;background:linear-gradient(#0b1621,#08121b);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--display);font-size:11px;line-height:1.02;color:var(--signal);letter-spacing:.03em;display:none}
.money{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.money b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.coin{flex:none;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff5c9 0,#ffcf5c 38%,#d48b17 100%);box-shadow:inset 0 0 0 2px rgba(110,60,0,.35),0 0 12px rgba(255,195,77,.25)}
.gems{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 7px;border:1px solid #2b2752;background:#14122a;border-radius:999px;font-family:var(--mono);font-weight:800;font-size:13px;color:#e4dcff}
.gems svg{width:16px;height:16px}
.ibtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0e1c28;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:18px;height:18px}
.ibtn.off{color:var(--dim)}

/* Stage */
#stage{grid-area:stage;position:relative;overflow:hidden;background:#05101a;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
@keyframes dropin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#evchip{position:absolute;left:8px;top:8px;z-index:2;display:flex;align-items:center;gap:8px;max-width:calc(100% - 128px);padding:6px 6px 6px 10px;border-radius:999px;background:rgba(32,18,6,.85);border:1px solid rgba(255,195,77,.55);font-weight:700;font-size:12.5px;color:#ffe2a6;overflow:hidden;animation:dropin .28s ease-out}
#evchip .ev-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#evchip .ev-btn{flex:none;border:0;border-radius:999px;background:var(--amber);color:#2a1a00;font-weight:800;font-size:12px;padding:6px 11px}
#evchip .ev-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:100%;transform-origin:left;transform:scaleX(var(--p,1))}
#boosts{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:1;pointer-events:none}
.boost{font-family:var(--mono);font-weight:800;font-size:10px;padding:4px 7px;border-radius:6px;background:rgba(95,227,180,.14);border:1px solid rgba(95,227,180,.45);color:var(--mint)}

/* Launch control */
#btnLaunch{position:absolute;left:8px;bottom:8px;z-index:2;width:min(210px,46%);border:0;border-radius:14px;padding:8px 11px 9px;text-align:left;
  background:linear-gradient(180deg,#ff7a3d,#f45a1c);color:var(--signal-ink);box-shadow:0 6px 0 #a83a0e,0 10px 26px rgba(255,106,43,.35);transform:translateY(0);transition:transform .06s}
#btnLaunch:active{transform:translateY(3px);box-shadow:0 3px 0 #a83a0e,0 6px 18px rgba(255,106,43,.35)}
#btnLaunch .l-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--mono);font-weight:800;font-size:10.5px;letter-spacing:.04em}
#btnLaunch .l-top em{font-style:normal;opacity:.75}
#btnLaunch .l-cta{display:block;font-family:var(--display);font-size:21px;line-height:1;margin-top:6px;letter-spacing:.02em}
.gauge{position:relative;display:block;height:13px;margin-top:6px;border-radius:7px;background:#3d1606;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.gauge .gz{position:absolute;top:0;bottom:0;background:#d99a2b}
.gauge .pz{position:absolute;top:0;bottom:0;background:#5fe3b4}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;left:0;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff;will-change:transform}
#btnLaunch .l-timer{position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:2px;background:rgba(32,12,2,.45);transform-origin:left;transform:scaleX(var(--t,1))}

/* Side: tabs + panel */
#side{grid-area:side;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 18px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
#tabs{order:2;flex:none;display:flex;border-top:1px solid var(--line);background:#08131c}
.tab{position:relative;flex:1;border:0;background:none;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim)}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--signal);color:var(--signal-ink);font-family:var(--mono);font-size:9.5px;font-weight:800;line-height:16px}
.tab.new::after{content:"YENİ";position:absolute;top:2px;right:8%;font-family:var(--mono);font-size:7.5px;font-weight:800;color:var(--signal)}

/* Planet cards (Liman) */
.rcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 3px 11px;display:flex;flex-direction:column}
.rcard.next{border-style:dashed;background:var(--card2);padding-bottom:6px}
.rcard.term{padding-top:8px}
.rhd{display:flex;align-items:center;gap:9px;min-height:30px;padding-bottom:6px}
.rnm{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.rbar{flex:1;min-width:28px;height:9px;border-radius:5px;background:#0a1620;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.rbar i{display:block;height:100%;width:0;background:var(--rc,var(--mint));border-radius:5px;transition:width .3s}
.next .rbar i{background:var(--amber)}
.rseat{flex:none;font-family:var(--mono);font-size:12px;font-weight:800;min-width:30px;text-align:right;white-space:nowrap}
.rst{flex:none;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 9px;border-radius:999px;background:#0a1620;white-space:nowrap}
.rst.ready{background:var(--signal);color:var(--signal-ink)}
.rst.wait{background:rgba(255,195,77,.14);color:var(--amber)}
.rst.away{color:var(--dim)}
.urow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(28,50,66,.8);border-radius:4px}
.urow.pop{animation:upop .45s ease}
@keyframes upop{30%{background:rgba(95,227,180,.14)}}
.uico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#0b1823;border:1px solid var(--line);color:var(--amber)}
.uico svg{width:19px;height:19px}
.ulab{flex:1;min-width:0}
.ulab b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ulab em{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ubadge{flex:none;width:26px;height:26px;animation:bob 1.3s ease-in-out infinite}
.ubadge svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-3px)}}
.ubuy{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;min-width:98px;border:0;border-radius:11px;padding:10px 11px;background:var(--signal);color:var(--signal-ink);box-shadow:0 3px 0 #a83a0e}
.ubuy .coin{width:16px;height:16px}
.ubuy b{font-family:var(--mono);font-weight:800;font-size:13px;white-space:nowrap}
.ubuy:active{transform:translateY(2px);box-shadow:0 1px 0 #a83a0e}
.ubuy:disabled{background:#1c2c38;color:#7d909a;box-shadow:0 3px 0 #0f1a22;cursor:default}
.ubuy:disabled:active{transform:none}
.ubuy:disabled .coin{opacity:.55}
.ubuy.done{background:none;box-shadow:none;color:var(--mint)}
.ubuy.done .coin{display:none}
.ubuy.big{min-width:108px}
.nmeta{flex:1;min-width:0}
.nmeta .rnm{display:block;white-space:normal}
.nmeta span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.save{display:flex;align-items:center;gap:9px;padding:2px 0 2px}
.save>span:last-child{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.hintline{margin:6px 6px 0;text-align:center;font-size:13.5px;color:var(--muted)}
.planet{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset -6px -5px 0 rgba(0,0,0,.35),0 0 12px var(--pc,#fff3)}

/* Cards (Görevler, Bilim) */
.sect{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px 0}
.sect h3{margin:0;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.03em;color:var(--text)}
.sect p{margin:0;font-size:11.5px;color:var(--muted)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:7px}
.crow{display:flex;align-items:center;gap:10px;min-width:0}
.cmain{flex:1;min-width:0}
.ctitle{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:14px}
.cstat{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.cstat b{color:var(--text);font-weight:600}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:#1a2a36;color:var(--muted)}
.toggle{display:flex;gap:3px;padding:3px;border-radius:9px;background:#0a1620;border:1px solid var(--line)}
.toggle button{border:0;background:none;border-radius:7px;padding:4px 9px;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:#1f3446;color:var(--text)}
.bar{height:6px;border-radius:3px;background:#0a1620;overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--mint);border-radius:3px;transition:width .25s}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.mrow b{font-family:var(--mono);color:var(--text);font-weight:600}
.reward{font-family:var(--mono);font-size:10.5px;color:var(--gem)}
.claim{border:0;border-radius:10px;padding:9px 12px;background:var(--mint);color:#032118;font-weight:800;box-shadow:0 3px 0 #23966f}
.claim:active{transform:translateY(2px);box-shadow:0 1px 0 #23966f}
.ghost{border:1px solid var(--line);background:#0e1c28;border-radius:10px;padding:9px 12px;font-weight:700;color:var(--text)}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;border-radius:2px;background:#1a2a36}
.pips i.on{background:var(--gem)}
.gbuy{border:0;border-radius:10px;padding:7px 10px;min-width:92px;background:#2a2357;color:#efe9ff;font-weight:800;box-shadow:0 3px 0 #17123a;text-align:center}
.gbuy:active{transform:translateY(2px);box-shadow:0 1px 0 #17123a}
.gbuy:disabled{background:#1a2230;color:#6f7f8d;box-shadow:0 3px 0 #0f1720;cursor:default}
.gbuy b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:12px}
.gbuy svg{width:12px;height:12px}
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sv{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#0b1823;display:grid;place-items:center;color:var(--dim);padding:6px}
.sv svg{width:62%;height:62%}
.sv.got{background:radial-gradient(circle at 50% 40%,#1d2f45,#0d1b27);border-color:#2c4660;color:var(--amber)}
.exp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.xbtn{border:1px solid var(--line);background:#0e1c28;border-radius:10px;padding:8px 6px;text-align:center}
.xbtn b{display:block;font-size:11.5px;font-weight:800}
.xbtn span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.xbtn em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--gem);margin-top:2px}
.xbtn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.note{font-size:11.5px;color:var(--muted)}
.warn{font-size:11.5px;color:var(--signal-hi)}

/* Modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(2,6,10,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mcard{width:min(400px,100%);max-height:calc(100% - 20px);overflow:auto;background:#0f1f2c;border:1px solid #27445a;border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mcard h2{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;text-wrap:balance}
#mBody{font-size:13.5px;color:#d7d0c2}
#mBody p{margin:0 0 8px}
#mBody .big{font-family:var(--display);font-size:28px;color:var(--mint);margin:6px 0 2px}
#mBody ol{margin:0 0 6px;padding-left:20px}
#mBody li{margin-bottom:5px}
#mBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#mBtns button{flex:1;min-width:120px}
.mbtn{border:0;border-radius:11px;padding:11px 12px;font-weight:800;background:var(--signal);color:var(--signal-ink);box-shadow:0 3px 0 #a83a0e}
.mbtn.sec{background:#1c2f3e;color:var(--text);box-shadow:0 3px 0 #0e1a24}
.mbtn.gem{background:#3a2f7a;color:#f0eaff;box-shadow:0 3px 0 #1d1745}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:#1d2e3c;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#7e919d;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--signal)}
.sw[aria-pressed="true"]::after{transform:translateX(20px);background:#fff}
.found{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:#0b1823;border:1px solid #2c4660;margin:8px 0}
.found .sv{width:62px;flex:none}
.licon{display:inline-block;width:19px;height:19px;vertical-align:-5px;margin:0 2px}
.licon svg{width:100%;height:100%}

#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{padding:8px 13px;border-radius:999px;background:#13283a;border:1px solid #2c4660;font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:dropin .25s ease-out;white-space:nowrap}

/* Rehber */
#guide{position:fixed;inset:0;z-index:24;pointer-events:none}
#guide .g-shade{position:fixed;border-radius:14px;box-shadow:0 0 0 220vmax rgba(2,7,12,.7);transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease}
#guide .g-ring{position:fixed;border-radius:14px;border:2.5px solid var(--signal);box-shadow:0 0 0 4px rgba(255,106,43,.22),0 0 24px rgba(255,106,43,.55);transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease;animation:gring 1.3s ease-in-out infinite}
@keyframes gring{50%{box-shadow:0 0 0 9px rgba(255,106,43,.1),0 0 30px rgba(255,106,43,.75)}}
#guide .g-block{position:fixed;pointer-events:auto}
#guide.tip .g-shade,#guide.tip .g-block{display:none}
#guide .g-bub{position:fixed;left:0;top:0;pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 12px 10px;border-radius:16px;background:#f7efdf;color:#13202b;box-shadow:0 16px 44px rgba(0,0,0,.5),0 0 0 2px rgba(255,106,43,.6)}
#guide .g-bub.nudge{animation:gnudge .32s ease}
@keyframes gnudge{25%{translate:-6px 0}75%{translate:6px 0}}
#guide .g-ava{flex:none;width:42px;height:42px;margin-top:1px}
#guide .g-ava svg{width:100%;height:100%}
#guide .g-body{flex:1;min-width:0}
#guide .g-title{display:block;font-family:var(--display);font-weight:400;font-size:15px;line-height:1.15;color:#c2410c;margin-bottom:3px;letter-spacing:.01em}
#guide .g-text{margin:0;font-size:14.5px;line-height:1.4;font-weight:500}
#guide .g-foot{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:34px}
#guide .g-dots{flex:1;display:flex;gap:4px;align-items:center}
#guide .g-dots i{width:6px;height:6px;border-radius:3px;background:#d8ccb4}
#guide .g-dots i.on{width:16px;background:var(--signal)}
#guide .g-wait{font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#c2410c;animation:gblink 1.1s ease-in-out infinite;white-space:nowrap}
@keyframes gblink{50%{opacity:.4}}
#guide .g-skip{border:0;background:none;color:#5f6b75;font-weight:700;font-size:13px;padding:8px 6px}
#guide .g-next{border:0;border-radius:11px;padding:9px 16px;background:var(--signal);color:var(--signal-ink);font-weight:800;font-size:14px;box-shadow:0 3px 0 #a83a0e;white-space:nowrap}
#guide .g-next:active{transform:translateY(2px);box-shadow:0 1px 0 #a83a0e}
#guide .g-arrow{position:absolute;width:14px;height:14px;background:#f7efdf;transform:rotate(45deg)}
#guide .g-arrow.up{top:-7px;box-shadow:-2px -2px 0 0 rgba(255,106,43,.6)}
#guide .g-arrow.down{bottom:-7px;box-shadow:2px 2px 0 0 rgba(255,106,43,.6)}
#guide.tip .g-bub{padding:9px 10px 8px;gap:8px}
#guide.tip .g-ava{width:32px;height:32px}
#guide.tip .g-text{font-size:13.5px}
#guide.tip .g-foot{margin-top:6px;min-height:0;justify-content:flex-end}
#guide.tip .g-dots{display:none}
#guide.tip .g-next{padding:6px 12px;font-size:12.5px}
#guide.action .g-text{font-weight:600}

@media (min-width:420px){ .brand{display:block} }
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1.45fr) minmax(370px,1fr);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"hud hud" "stage side"}
  #side{border-left:1px solid var(--line)}

    ready: function () { return S.routes[0].auto || S.money >= E.cost.auto(0); } },
  { k: 'mars', cond: function () { return S.flags.guides.seats && (S.money >= 0.35 * E.cost.unlock(1) || S.stats.routeL[0] >= 20); } },
  { k: 'fleet', cond: function () { return S.routes[1].u && S.flags.guides.newRoute && RT.sinceMars >= 30; } },
  { k: 'gorev', cond: function () { return S.flags.guides.fleet && RT.sinceMars >= 60; }, on: function () { fillMissions(); } },
  { k: 'events', tour: false, cond: function () { return S.flags.guides.gorev; }, on: function () { RT.nextEventAt = GT + 45; } },
  { k: 'bilim', cond: function () { return rv('gorev') && S.crystals > 0; } },
  { k: 'kesif', cond: function () { return S.flags.guides.bilim && S.routes[2].u; } },
  { k: 'bulk', cond: function () { return S.routes[2].u; } },
  { k: 'prestige', cond: function () { return rv('gorev') && E.starsFor(S.stats.runEarned) >= 1; } }
];
function progressTick() {
  if (GD.tour || GD.queue.length || !$('#modal').hidden || GT < GD.cool) return;
  var g = S.flags.guides;
  if (!g.intro) { guideStart('intro'); return; }
  if (!g.launch) { if (readyList.length) guideStart('launch'); return; }
  if (rv('mars') && nextRoute() === 1 && !g.unlock && S.money >= E.cost.unlock(1)) { guideStart('unlock'); return; }
  if (rv('gorev') && !g.claim && S.missions.some(mDone)) { guideStart('claim'); return; }
  if (rv('bilim') && !g.expDone && S.exp && Date.now() >= S.exp.end) { guideStart('expDone'); return; }
  for (var n = 0; n < FEATS.length; n++) {
    var F = FEATS[n], tour = F.tour !== false && !!TOURS[F.k];
    if (!rv(F.k)) {
      if (!F.cond()) continue;
      reveal(F.k); if (F.on) F.on();
      if (tour && (!F.ready || F.ready())) guideStart(F.k);
      return;
    }
    if (tour && !g[F.k]) { if (!F.ready || F.ready()) guideStart(F.k); return; }
  }
}
function guideListModal() {
  var rows = GUIDE_LIST.filter(guideAvail).map(function (id) {
    return h('div', { class: 'setrow' }, h('span', { text: TOURS[id].name }), h('button', { class: 'ghost', text: 'Göster', onclick: function () { closeModal(); guideStart(id, true); } }));
  });
  rows.push(h('div', { class: 'setrow', style: 'border:0' }, h('span', { text: 'Kısa özet (yazılı)' }), h('button', { class: 'ghost', text: 'Oku', onclick: function () { closeModal(); helpModal(); } })));
  showModal('Rehberler', [h('p', { class: 'note', text: 'Hangi konuyu göstereyim? Yeni şeyler açıldıkça bu liste uzar.' })].concat(rows), [{ label: 'Kapat', cls: 'sec' }]);
}

/* ================= main loop ================= */
var lastT = 0, accUI = 0, accSlow = 0, accSave = 0;
function frame(t) {
  var dt = lastT ? (t - lastT) / 1000 : 0.016; lastT = t;
  if (dt > 2.5) {
    var res = catchUp(dt);
    if (dt > 60 && res.gain > 0) toast('Sen yokken otomatik pilotlar +' + fmt(res.gain) + ' kazandı');
    dt = 0.016;
  }
  dt = Math.min(dt, 0.1);
  var rdt = dt, paused = RT.paused;
  if (paused) dt = 0;
  else { GT += dt; S.stats.play += dt; if (S.routes[1].u) RT.sinceMars += dt; }
  invalidate();
  if (!paused) { tickEconomy(dt); updateEvent(dt); }
  if (SC.G) drawScene(dt);
  updateLaunchUI();
  accUI += rdt;
  if (accUI > 0.2) {
    accUI = 0;
    var sk = structKey(); if (sk !== lastStruct) { lastStruct = sk; UI.dirty = true; }
    if (UI.dirty) renderPanel(); else refreshPanel();
    updateHUD();
  }
  accSlow += rdt;
  if (accSlow > 1) {
    accSlow = 0;
    if (rv('gorev')) fillMissions();
    progressTick();
    maybeEvent();
    if (S.exp && Date.now() >= S.exp.end && !S.exp.told) { S.exp.told = 1; if (S.flags.guides.expDone) toast('Keşif sondası döndü! Bilim sekmesine bak.'); }
  }
  guideTick(rdt);
  if (RT.saveSoon != null) { RT.saveSoon -= rdt; if (RT.saveSoon <= 0) { RT.saveSoon = null; saveLocal(); } }
  accSave += rdt; if (accSave > 30) { accSave = 0; saveLocal(); cloudSave(false); }
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function welcomeBack(res) {
  var body = [h('p', { text: 'Sen yokken ' + fmtTime(res.sec) + ' geçti. Otomatik pilotlu roketler uçmaya devam etti:' }), h('div', { class: 'big', text: '+' + fmt(res.gain) })];
  if (res.capped) body.push(h('p', { class: 'note', text: 'Roketler en fazla ' + (CFG.offlineBaseH + 6 * S.research.gece) + ' saat kendi kendine uçar.' }));
  if (S.exp && Date.now() >= S.exp.end) body.push(h('p', { class: 'reward', text: 'Keşif sondası da döndü, Bilim sekmesinde seni bekliyor.' }));
  showModal('Hoş geldin, Kaptan!', body, [{ label: 'Topla' }]);
}
function start(hotData) {
  var src = (hotData && hotData.v === 2) ? hotData : loadLocal(), fresh = !src || src.v !== 2;
  S = sanitize(src);
  RT.bootSavedAt = fresh ? 0 : S.savedAt;
  initRockets();
  if (rv('gorev')) fillMissions();
  if (rv('events')) RT.nextEventAt = 60;
  SC.cv = $('#scene'); SC.cx = SC.cv.getContext('2d');
  resizeScene();
  if (window.ResizeObserver) new ResizeObserver(function () { resizeScene(); }).observe($('#stage'));
  else window.addEventListener('resize', resizeScene);
  SC.cv.addEventListener('pointerdown', onCanvasTap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { SC.bgKey = ''; LB.gw = 0; });
  setupLaunchUI();
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { audioUnlock(); SFX.tab(); selectTab(b.dataset.tab); }); });
  $('#btnMenu').addEventListener('click', function () { audioUnlock(); settingsModal(); });
  $('#btnSound').addEventListener('click', function () { var on = !(S.settings.sfx || S.settings.music); S.settings.sfx = on; S.settings.music = on; audioUnlock(); applyAudioSettings(); markDirty(); updateHUD(); });
  $('#modal').addEventListener('click', function (e) { if (e.target === $('#modal')) closeModal(); });
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { if (!AU.ctx || AU.ctx.state !== 'running') audioUnlock(); }, { passive: true }); });
  document.addEventListener('keydown', function (e) {
    var gs = GD.step, gm = gs ? GD.mode : '', isSp = e.code === 'Space' || e.key === ' ';
    if (gs && gm !== 'tip' && $('#modal').hidden) {
      if (e.key === 'Escape') { e.preventDefault(); endTour(); return; }
      if (gm === 'modal') { if ((e.key === 'Enter' || isSp) && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); guideNext(); } return; }
      if (gm === 'action' && !gs.space) { if (isSp) e.preventDefault(); return; }
    }
    if (isSp && $('#modal').hidden && !RT.paused) { e.preventDefault(); audioUnlock(); tapLaunch(); }
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { saveLocal(); cloudSave(true); } });
  window.addEventListener('pagehide', function () { saveLocal(); });
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') { try { window.claude.hot.snapshot(function () { return snapshot(); }); } catch (e) {} }
  if (!fresh) {
    var away = (Date.now() - S.savedAt) / 1000;
    if (away > 5) {
      var res = catchUp(away);
      if (away > 60 && res.gain > 0) welcomeBack(res);
      else if (away > 600 && rv('oto') && !res.anyAuto) setTimeout(function () { toast('İpucu: otomatik pilotlu roketler sen yokken de uçar.'); }, 1500);
    }
  }
  selectTab('liman');
  saveLocal();
  progressTick();
  window.__UZ = { S: function () { return S; }, RT: RT, E: E, add: addMoney, catchUp: catchUp, ev: startEvent, flow: flowNow, GD: GD, guide: guideStart, progress: progressTick, ready: function () { return readyList; }, launch: tapLaunch, gt: function () { return GT; }, needle: needle,
    sim: function (sec) { for (var t = 0; t < sec; t += 0.05) { GT += 0.05; invalidate(); tickEconomy(0.05); } } };
  requestAnimationFrame(frame);
  setTimeout(cloudInit, 0);
}
var hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') { try { hot.ready(function (d) { start(d && d.v === 2 ? d : null); }); } catch (e) { start(null); } }
else start(hot && hot.data && hot.data.v === 2 ? hot.data : null);
})();
</script>
