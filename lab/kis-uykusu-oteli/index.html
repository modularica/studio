<style>
/* Layout idea: the whole screen is a cross-section of a snowy hill drawn on
   one canvas; HUD chips float on top, sheets slide up from the bottom. */
:root {
  --paper: #FBF8F2;
  --paper-2: #F2ECE1;
  --ink: #2C2A27;
  --ink-soft: #6A645D;
  --falu: #A9473B;
  --pine: #3E5A4B;
  --mustard: #D7A23F;
  --line: rgba(44, 42, 39, 0.13);
  --good: #6F9468;
  --bad: #C2553D;
  --display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #1F2B43; color: var(--ink); font-family: var(--body); }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#insetProbe { position: fixed; visibility: hidden; pointer-events: none; padding: var(--st) var(--sr) var(--sb) var(--sl); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

/* HUD */
.hud { position: fixed; top: calc(var(--st) + 10px); left: calc(var(--sl) + 10px); right: calc(var(--sr) + 10px); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 5; }
.hud[hidden] { display: none; }
.chip { pointer-events: auto; background: rgba(251, 248, 242, 0.94); border-radius: 999px; padding: 7px 12px; display: flex; align-items: center; gap: 7px; font: 600 16px/1 var(--display); box-shadow: 0 2px 10px rgba(20, 20, 30, 0.12); white-space: nowrap; }
.chip svg { flex: none; }
.season { flex-direction: column; align-items: stretch; gap: 4px; border-radius: 16px; padding: 7px 12px 8px; min-width: 118px; }
.season .sub { gap: 6px; }
.season .sub .bar { flex: 1; }
.season .row { display: flex; align-items: center; gap: 7px; }
.season small { font: 500 12px/1 var(--display); color: var(--ink-soft); }
.bar { height: 5px; min-width: 30px; border-radius: 3px; background: rgba(44, 42, 39, 0.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: var(--pine); border-radius: 3px; transition: width 0.2s linear; }
.money b { font-variant-numeric: tabular-nums; min-width: 2ch; }
.money.bump { animation: bump 0.25s ease; }
@keyframes bump { 50% { transform: scale(1.12); } }
.stars { gap: 2px; padding: 7px 10px; }
.stars small { margin-left: 6px; font: 500 13px/1 var(--display); color: var(--ink-soft); }
.spacer { flex: 1; }
.mini { display: none; }
@media (max-width: 520px) {
  .hud { gap: 6px; left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px); }
  .chip { padding: 7px 10px; gap: 5px; }
  .full { display: none; }
  .mini { display: inline-flex; align-items: center; gap: 3px; }
  .stars small { margin-left: 4px; }
}
.iconbtn { pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(251, 248, 242, 0.94); box-shadow: 0 2px 10px rgba(20, 20, 30, 0.12); display: grid; place-items: center; cursor: pointer; }

/* bottom: hints and the summer bar */
.bottom { position: fixed; left: calc(var(--sl) + 12px); right: calc(var(--sr) + 12px); bottom: calc(var(--sb) + 12px); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; z-index: 6; }
.hint { pointer-events: auto; max-width: 520px; background: var(--paper); border-radius: 16px; padding: 12px 16px; font: 500 16px/1.35 var(--body); box-shadow: 0 6px 24px rgba(20, 20, 30, 0.22); text-wrap: pretty; animation: rise 0.25s ease; }
.hint b { font-family: var(--display); font-weight: 600; }
.hint[hidden] { display: none; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.summerbar { pointer-events: auto; display: flex; gap: 10px; width: 100%; max-width: 520px; }
.summerbar[hidden] { display: none; }
body.tray .bottom { bottom: calc(var(--sb) + 92px); }
.summerbar .btn { flex: 1; }

.btn { font: 600 17px/1.1 var(--display); padding: 14px 18px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; box-shadow: 0 3px 12px rgba(20, 20, 30, 0.14); }
.btn.primary { background: var(--falu); border-color: transparent; color: #FFF8F0; }
.btn.green { background: var(--pine); border-color: transparent; color: #F4F1EA; }
.btn.small { font-size: 15px; padding: 9px 13px; min-height: 40px; border-radius: 12px; box-shadow: none; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }

/* season banner */
.banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; z-index: 7; color: #FFFDF8; text-shadow: 0 2px 16px rgba(20, 25, 40, 0.45); }
.banner[hidden] { display: none; }
.banner h2 { margin: 0; font: 600 clamp(38px, 9vw, 64px)/1 var(--display); letter-spacing: 0.01em; }
.banner p { margin: 8px 0 0; font: 600 18px/1.2 var(--display); }
.banner.show { animation: banner 2.2s ease forwards; }
@keyframes banner { 0% { opacity: 0; transform: translateY(12px); } 15%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }

/* menu */
.menu { position: fixed; inset: 0; z-index: 8; display: grid; place-items: start center; padding: calc(var(--st) + 28px) 16px calc(var(--sb) + 16px); overflow: auto; }
.menu[hidden] { display: none; }
.card { width: min(440px, 100%); background: rgba(251, 248, 242, 0.95); border-radius: 26px; padding: 22px 22px 18px; box-shadow: 0 12px 40px rgba(10, 15, 30, 0.35); display: flex; flex-direction: column; gap: 12px; }
.card h1 { margin: 0; font: 600 clamp(32px, 8vw, 42px)/1 var(--display); text-wrap: balance; color: var(--ink); }
.card .lede { margin: 0; font: 500 16px/1.4 var(--body); color: var(--ink-soft); text-wrap: pretty; }
.card .hero { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 92px; }
.card .row2 { display: flex; gap: 10px; }
.card .row2 .btn { flex: 1; }
.card .foot { margin: 2px 0 0; font: 500 13px/1.4 var(--body); color: var(--ink-soft); text-align: center; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 9; background: rgba(20, 22, 30, 0.32); display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap[hidden] { display: none; }
.sheet { width: min(560px, 100%); max-height: min(82%, 720px); overflow: auto; background: var(--paper); border-radius: 24px 24px 0 0; padding: 20px 18px calc(var(--sb) + 18px); box-shadow: 0 -10px 40px rgba(10, 15, 30, 0.25); animation: sheet 0.22s ease; display: flex; flex-direction: column; gap: 14px; touch-action: pan-y; }
@media (min-width: 700px) and (min-height: 600px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; padding-bottom: 20px; } }
@keyframes sheet { from { transform: translateY(30px); opacity: 0.4; } }
.sheet h2 { margin: 0; font: 600 26px/1.1 var(--display); text-wrap: balance; }
.sheet h3 { margin: 4px 0 0; font: 600 15px/1 var(--display); color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
.sheet p { margin: 0; font: 500 16px/1.4 var(--body); text-wrap: pretty; }
.sheet .muted { color: var(--ink-soft); font-size: 14px; }
.sheet .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet .actions .btn { flex: 1 1 140px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--paper-2); }
.item .ic { flex: none; width: 52px; height: 52px; border-radius: 14px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.item .ic canvas { width: 48px; height: 48px; }
.item .ic.pair canvas { width: 30px; height: 30px; }
.item .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .tx b { font: 600 17px/1.15 var(--display); }
.item .tx span { font: 500 14px/1.3 var(--body); color: var(--ink-soft); }
.item .btn { flex: none; }
.item.locked { opacity: 0.6; }
.price { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--paper-2); }
.res .ic { width: 42px; height: 42px; flex: none; }
.res .ic canvas { width: 42px; height: 42px; }
.res .nm { flex: 1; min-width: 0; font: 600 16px/1.2 var(--display); }
.res .nm small { display: block; font: 500 13px/1.3 var(--body); color: var(--ink-soft); }
.res .hearts { display: flex; gap: 1px; }
.res .got { font: 600 16px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; display: inline-flex; gap: 4px; align-items: center; justify-content: flex-end; }
.total { display: flex; gap: 10px; }
.total div { flex: 1; background: var(--paper-2); border-radius: 14px; padding: 10px 12px; font: 600 22px/1 var(--display); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.total small { font: 500 13px/1 var(--body); color: var(--ink-soft); margin-left: auto; }
.news { background: #E8EFE3; border-radius: 14px; padding: 12px 14px; font: 600 16px/1.35 var(--display); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 10px; font: 500 15px/1.4 var(--body); }
.steps li b { flex: none; width: 82px; font: 600 15px/1.4 var(--display); }
@media (prefers-reduced-motion: reduce) { .banner.show, .sheet, .hint, .money.bump { animation: none; } .banner.show { opacity: 1; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="Kış Uykusu Oteli oyun alanı"></canvas>
<div id="insetProbe"></div>

<div id="hud" class="hud" hidden>
  <div class="chip season" id="seasonChip">
    <div class="row"><span id="seasonIcon"></span><span id="seasonText">Sonbahar</span></div>
    <div class="row sub"><small id="yearText">Yıl 1</small><div class="bar"><i id="seasonBar"></i></div></div>
  </div>
  <div class="chip money" id="moneyChip" title="Fındık"><span id="nutIcon"></span><b id="money">0</b></div>
  <div class="chip stars" id="starsChip" role="button" tabindex="0" aria-label="Otelin yıldızları"><span id="stars"></span><small id="fame"></small></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="pauseBtn" aria-label="Duraklat"></button>
</div>

<div id="bottom" class="bottom">
  <div id="hint" class="hint" hidden></div>
  <div id="summerBar" class="summerbar" hidden>
    <button class="btn" id="shopBtn" type="button">Dükkân</button>
    <button class="btn primary" id="startBtn" type="button">Sonbaharı başlat</button>
  </div>
</div>

<div id="banner" class="banner" hidden><h2 id="bannerTitle"></h2><p id="bannerSub"></p></div>

<div id="menu" class="menu">
  <div class="card">
    <div class="hero" id="menuHero"></div>
    <h1>Kış Uykusu Oteli</h1>
    <p class="lede">Ormanın hayvanları kışı senin otelinde uyuyarak geçiriyor. Onları sıcak ve sessiz tut, baharda fındıkla ödesinler, sen de oteli büyüt.</p>
    <button class="btn primary" id="playBtn" type="button">Oyna</button>
    <div class="row2">
      <button class="btn small" id="helpBtn" type="button">Nasıl oynanır</button>
      <button class="btn small" id="soundBtn" type="button">Ses açık</button>
    </div>
    <button class="btn small ghost" id="newBtn" type="button" hidden>Yeni otel kur</button>
    <p class="foot">İki kişi aynı ekranda oynayabilir: biri sobaya, öteki misafirlere baksın.<br>Uzi Games</p>
  </div>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Game data: guests, rooms, helpers, upgrades and the economy.
// All player-facing text is Turkish; code and comments stay English.
// ---------------------------------------------------------------------------

const COLS = 4;
const ROWS = 5;

// Guests. price = hazelnuts paid for a perfect sleep in a level-1 room.
// toss: how often the blanket slips. cold/heat/noise: how strongly each
// problem drains sleep. snore: how often this guest starts snoring.
const SPECIES = {
  fare: {
    name: 'Fındık faresi', room: 'yuva', price: 12,
    toss: 0.5, cold: 0.8, heat: 1.0, noise: 0.5, snore: 0, blanket: true, food: ['findik'],
    note: 'Dünyanın en uykucu hayvanı. Kolay kolay uyanmaz.',
  },
  kirpi: {
    name: 'Kirpi', room: 'yuva', price: 15,
    toss: 1.3, cold: 1.3, heat: 0.8, noise: 1.0, snore: 0, blanket: true, food: ['bocek'],
    note: 'Üşümeyi hiç sevmez. Battaniyesine göz kulak ol.',
  },
  kurbaga: {
    name: 'Kurbağa', room: 'havuz', price: 22,
    toss: 0.7, cold: 0.4, heat: 1.8, noise: 0.8, snore: 0, blanket: true, food: ['sinek'],
    note: 'Serin çamuru sever. Soba fazla yanarsa bunalır.',
  },
  ayi: {
    name: 'Ayı', room: 'magara', price: 45,
    toss: 0.8, cold: 0.6, heat: 1.2, noise: 0.6, snore: 1.0, blanket: true, food: ['bal', 'balik'],
    note: 'En iyi ödeyen misafir. Ama çok horlar, yanındakiler uyanır.',
  },
  porsuk: {
    name: 'Porsuk', room: 'oda', price: 32,
    toss: 1.0, cold: 1.0, heat: 1.0, noise: 1.5, snore: 0.45, blanket: true, food: ['solucan'],
    note: 'Sese çok hassas. Arada bir kendisi de horlar.',
  },
  yarasa: {
    name: 'Yarasa', room: 'tunek', price: 38,
    toss: 0, cold: 0.9, heat: 1.6, noise: 1.6, snore: 0, blanket: false, food: ['guve'],
    note: 'Kanatlarına sarılıp baş aşağı uyur. Sesi ve sıcağı sevmez.',
  },
};
const SPECIES_ORDER = ['fare', 'kirpi', 'kurbaga', 'ayi', 'porsuk', 'yarasa'];

// What guests dream about in winter. The tray at the bottom offers these.
const FOODS = { findik: 'Fındık', bocek: 'Böcek', sinek: 'Sinek', bal: 'Bal', balik: 'Balık', solucan: 'Solucan', guve: 'Güve' };
const FOOD_ORDER = ['findik', 'bocek', 'sinek', 'bal', 'balik', 'solucan', 'guve'];

// Room types. fame = hearts needed before this room can be built.
const ROOMS = {
  yuva:   { name: 'Yaprak yuvası', cost: 20, fame: 0,  species: ['fare', 'kirpi'] },
  havuz:  { name: 'Çamur havuzu',  cost: 35, fame: 8,  species: ['kurbaga'] },
  magara: { name: 'Ayı mağarası',  cost: 70, fame: 25, species: ['ayi'] },
  oda:    { name: 'Saman odası',   cost: 55, fame: 55, species: ['porsuk'] },
  tunek:  { name: 'Yarasa tüneği', cost: 60, fame: 100, species: ['yarasa'] },
};
const ROOM_ORDER = ['yuva', 'havuz', 'magara', 'oda', 'tunek'];

// Room levels: better rooms pay more and drain sleep less.
const LEVELS = [
  null,
  { name: 'Sade',  pay: 1.0,  drain: 1.0 },
  { name: 'Rahat', pay: 1.35, drain: 0.85 },
  { name: 'Lüks',  pay: 1.75, drain: 0.7 },
];
function upgradeCost(type, lvl) {
  const base = ROOMS[type].cost;
  return lvl === 1 ? Math.round(base * 1.2) : Math.round(base * 2.5);
}
function digCost(dugCount) { return 10 + 5 * dugCount; }

// Hotel stars come from total hearts (fame).
const STAR_AT = [0, 8, 25, 55, 100];
function starsFor(fame) {
  let s = 0;
  for (const t of STAR_AT) if (fame >= t) s++;
  return s;
}

// Helpers work on their own during winter.
const STAFF = {
  sincap: {
    name: 'Sincap kat görevlisi', max: 3, cost: [100, 170, 260],
    note: 'Düşen battaniyeleri kendisi örter. 3 tane alabilirsin.',
  },
  baykus: {
    name: 'Baykuş bekçi', max: 1, cost: [150],
    note: 'Ağaçkakanları kovar.',
  },
  geyik: {
    name: 'Ren geyiği', max: 1, cost: [200],
    note: 'Soba sönmeye yüz tutunca odun atar.',
  },
};
const STAFF_ORDER = ['sincap', 'baykus', 'geyik'];

// One-time upgrades.
const UPGRADES = {
  ilan:  { name: 'Orman ilanı',     cost: 50,  note: 'Her sonbahar 3 misafir daha gelir, daha uzun bekler.' },
  duvar: { name: 'Kalın duvarlar',  cost: 90,  note: 'Soba daha yavaş soğur.' },
  yosun: { name: 'Yosun yalıtımı',  cost: 120, note: 'Ağaçkakan ve horlama sesi daha az duyulur.' },
  ninni: { name: 'Ninni kutusu',    cost: 140, note: 'Kışın ninni çalar. Herkes daha derin uyur.' },
};
const UPGRADE_ORDER = ['ilan', 'duvar', 'yosun', 'ninni'];

// Tuning for one winter.
const TUNE = {
  autumnGap: 2.6,        // seconds between arrivals
  patience: 22,          // seconds a guest waits in the queue
  patienceIlan: 6,
  noRoomWait: 5,         // a guest without a matching room leaves after this
  queueMax: 6,
  winterLen: (year) => (year === 1 ? 60 : year < 5 ? 80 : 90),
  springLen: 3.6,

  // Stove: temperature 0..100, comfortable between ZONE[0] and ZONE[1].
  ZONE: [35, 72],
  tempStart: 58,
  decay: 1.45,           // degrees per second
  decayDuvar: 0.65,
  logHeat: 18,           // degrees added by one log, over logTime seconds
  logTime: 1.2,
  logCooldown: 0.3,

  // Sleep drains (points per second at strength 1).
  coldDrain: 4.0,
  heatDrain: 4.0,
  blanketDrain: 3.0,
  woodDrain: 6.0,
  snoreDrain: 3.0,
  regen: 1.2,
  regenNinni: 1.0,
  ninniDrain: 0.9,
  yosunNoise: 0.6,

  blanketRate: 1 / 22,   // per guest per second, times species.toss
  blanketRateY1: 1 / 28,
  snoreRate: 1 / 22,
  snoreLen: 18,
  snoreRest: 10,         // after being rolled over, no snoring for this long
  wpFrom: 2,             // woodpeckers appear from this year
  wpGap: (year) => Math.max(9, 18 - year),
  wpLen: 14,
  wpFalloff: [1, 0.65, 0.4, 0.22, 0.1],
  ayazFrom: 4,
  ayazLen: 12,
  ayazDecay: 2.2,

  // Helpers.
  sincapDelay: 1.0,
  sincapSpeed: 1.7,      // cells per second
  sincapTuck: 0.6,
  baykusDelay: 2.5,
  baykusFly: 1.0,
  geyikBelow: 48,
  geyikCooldown: 3.2,

  // Fun in winter: nuts falling with the snow, dreams, the northern lights.
  dropGap: [4.0, 7.0],   // seconds between falling nuts
  dropFall: [5.5, 7.0],  // seconds a nut takes to reach the ground
  goldChance: 0.08,
  peaceFill: 5,          // per second while nobody needs anything
  peaceDrain: 2,         // per second while something is wrong
  peaceFix: 5,           // a fix
  peaceQuick: 10,        // a fix within quickT seconds
  peaceFeed: 8,          // a dream come true
  quickT: 2,
  auroraLen: 7,
  auroraGap: 0.45,       // nuts rain this often under the northern lights
  auroraFall: 3.2,
  auroraGold: 0.15,
  auroraRegen: 3,
  dreamFirst: (year) => (year === 1 ? 13 : 6),
  dreamGap: (n) => Math.max(5, 12 - n * 0.5),
  dreamLen: 10,
  dreamSleep: 25,
  dreamTip: 0.2,
};
const dropValue = (year, gold) => (gold ? 3 : 1) * (1 + Math.floor((year - 1) / 4));

function guestsWanted(save) {
  return 2 + starsFor(save.fame) + Math.floor(save.year / 2) + (save.upgrades.ilan ? 3 : 0);
}

function heartsFor(sleep, woke) {
  if (woke) return 0;
  return sleep >= 85 ? 3 : sleep >= 55 ? 2 : 1;
}
function payFor(sp, lvl, sleep, woke) {
  if (woke) return { pay: 0, tip: 0 };
  const base = SPECIES[sp].price * LEVELS[lvl].pay;
  const pay = Math.round(base * (0.4 + 0.6 * sleep / 100));
  const tip = heartsFor(sleep, woke) === 3 ? Math.round(base * 0.25) : 0;
  return { pay, tip };
}

// ---------------------------------------------------------------------------
// Simulation. Pure logic, no DOM: the page and the balance tests both run it.
// One year = autumn (guests arrive) -> winter (they sleep, you keep them
// asleep) -> spring (they pay) -> summer (you build).
// ---------------------------------------------------------------------------

function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const cellRC = (i) => ({ r: Math.floor(i / COLS), c: i % COLS });
const cellIdx = (r, c) => r * COLS + c;
function neighbours(i) {
  const { r, c } = cellRC(i), out = [];
  if (c > 0) out.push(i - 1);
  if (c < COLS - 1) out.push(i + 1);
  if (r > 0) out.push(i - COLS);
  if (r < ROWS - 1) out.push(i + COLS);
  return out;
}

function newSave() {
  const grid = [];
  for (let i = 0; i < COLS * ROWS; i++) grid.push({ dug: false, room: null, lvl: 1 });
  for (const c of [0, 1, 2]) { grid[c].dug = true; grid[c].room = 'yuva'; }
  return {
    v: 1, year: 1, money: 20, fame: 0, grid,
    upgrades: {}, staff: { sincap: 0, baykus: 0, geyik: 0 },
    seen: {}, total: { guests: 0, hearts: 0, nuts: 0, woke: 0 },
  };
}

// Repairs a save loaded from storage so a broken or old one never crashes.
function cleanSave(s) {
  const d = newSave();
  if (!s || typeof s !== 'object' || s.v !== 1 || !Array.isArray(s.grid) || s.grid.length !== COLS * ROWS) return d;
  const num = (v, def) => (typeof v === 'number' && isFinite(v) ? v : def);
  const out = {
    v: 1,
    year: Math.max(1, Math.floor(num(s.year, 1))),
    money: Math.max(0, Math.floor(num(s.money, 20))),
    fame: Math.max(0, Math.floor(num(s.fame, 0))),
    grid: s.grid.map((g) => {
      const dug = !!(g && g.dug);
      const room = dug && g && ROOMS[g.room] ? g.room : null;
      const lvl = room ? Math.min(3, Math.max(1, Math.floor(num(g.lvl, 1)))) : 1;
      return { dug, room, lvl };
    }),
    upgrades: {}, staff: { sincap: 0, baykus: 0, geyik: 0 },
    seen: s.seen && typeof s.seen === 'object' ? { ...s.seen } : {},
    total: { ...d.total, ...(s.total && typeof s.total === 'object' ? s.total : {}) },
  };
  for (const k of UPGRADE_ORDER) if (s.upgrades && s.upgrades[k]) out.upgrades[k] = true;
  for (const k of STAFF_ORDER) out.staff[k] = Math.min(STAFF[k].max, Math.max(0, Math.floor(num(s.staff && s.staff[k], 0))));
  return out;
}

// Where squirrel k waits: on the snow by the cabin door (grid units; y -1.02 is the ground line).
const SQ_HOME = (k) => ({ x: 2.72 - k * 0.24, y: -1.02 });

const dugCount = (save) => save.grid.filter((g) => g.dug).length;
function canDig(save, i) {
  const g = save.grid[i];
  if (g.dug) return false;
  if (cellRC(i).r === 0) return true;
  return neighbours(i).some((n) => save.grid[n].dug);
}
const roomUnlocked = (save, type) => save.fame >= ROOMS[type].fame;

class Game {
  constructor(save, seed) {
    this.save = save;
    this.rand = makeRng(seed == null ? (Date.now() & 0xffffffff) : seed);
    this.events = [];
    this.phase = 'summer';
    this.run = null;
  }

  emit(type, data) { this.events.push(Object.assign({ type }, data || {})); }
  takeEvents() { const e = this.events; this.events = []; return e; }
  pick(arr) { return arr[Math.floor(this.rand() * arr.length)]; }

  unlockedSpecies() {
    return SPECIES_ORDER.filter((sp) => roomUnlocked(this.save, SPECIES[sp].room));
  }

  // ---- autumn -------------------------------------------------------------

  startAutumn() {
    const s = this.save;
    const count = {};
    let rooms = 0;
    for (const g of s.grid) if (g.room) { count[g.room] = (count[g.room] || 0) + 1; rooms++; }
    const n = Math.min(guestsWanted(s), rooms + 1);
    const left = { ...count };
    const plan = [];
    const unl = this.unlockedSpecies();
    const missing = unl.filter((sp) => !count[SPECIES[sp].room]);
    if (s.year === 1) plan.push('fare', 'kirpi', 'fare');
    else {
      for (let k = 0; k < n; k++) {
        const types = Object.keys(left).filter((t) => left[t] > 0);
        if (missing.length && k > 0 && (types.length === 0 || this.rand() < 0.12)) {
          plan.push(this.pick(missing));
          continue;
        }
        if (!types.length) break;
        let roll = this.rand() * types.reduce((a, t) => a + left[t], 0), t = types[0];
        for (const x of types) { roll -= left[x]; if (roll < 0) { t = x; break; } }
        left[t]--;
        plan.push(this.pick(ROOMS[t].species));
      }
    }
    this.phase = 'autumn';
    this.run = {
      year: s.year, t: 0, plan, nextAt: 1.0, queue: [], guests: [], nextId: 1,
      left: 0, endT: 0,
    };
    this.emit('autumn', { count: plan.length });
  }

  roomGuest(i) { return this.run ? this.run.guests.find((g) => g.cell === i && !g.gone) : null; }

  freeRoomFor(sp) {
    const type = SPECIES[sp].room;
    return this.save.grid.findIndex((g, i) => g.room === type && !this.roomGuest(i));
  }

  placeGuest(id, cell) {
    if (this.phase !== 'autumn') return 'phase';
    const run = this.run, q = run.queue.find((x) => x.id === id);
    if (!q) return 'gone';
    const g = this.save.grid[cell];
    if (!g || !g.room) return 'noRoomHere';
    if (g.room !== SPECIES[q.sp].room) return 'wrongRoom';
    if (this.roomGuest(cell)) return 'occupied';
    run.queue.splice(run.queue.indexOf(q), 1);
    run.guests.push({
      id: q.id, sp: q.sp, cell, sleep: 100, blanket: true, offT: 0,
      snore: 0, rest: 6 + this.rand() * 8, woke: false, gone: false, drain: 0, by: null, dream: null,
    });
    this.emit('placed', { id, cell, sp: q.sp });
    return 'ok';
  }

  leaveQueue(q, why) {
    const run = this.run;
    run.queue.splice(run.queue.indexOf(q), 1);
    run.left++;
    this.emit('left', { id: q.id, sp: q.sp, why });
  }

  updateAutumn(dt) {
    const run = this.run, s = this.save;
    run.t += dt;
    if (run.plan.length && run.t >= run.nextAt && run.queue.length < TUNE.queueMax) {
      const sp = run.plan.shift();
      const patience = TUNE.patience + (s.upgrades.ilan ? TUNE.patienceIlan : 0) + (s.year === 1 ? 20 : 0);
      run.queue.push({ id: run.nextId++, sp, wait: 0, patience, noRoomT: 0 });
      run.nextAt = run.t + TUNE.autumnGap;
      this.emit('arrive', { id: run.nextId - 1, sp });
    }
    for (const q of run.queue.slice()) {
      q.wait += dt;
      if (this.freeRoomFor(q.sp) < 0) {
        q.noRoomT += dt;
        if (q.noRoomT > TUNE.noRoomWait) { this.leaveQueue(q, 'noRoom'); continue; }
      } else q.noRoomT = 0;
      if (q.wait > q.patience) this.leaveQueue(q, 'patience');
    }
    if (!run.plan.length && !run.queue.length) {
      run.endT += dt;
      if (run.endT > 1.0) this.startWinter();
    }
  }

  // ---- winter -------------------------------------------------------------

  startWinter() {
    const run = this.run, s = this.save;
    this.phase = 'winter';
    run.t = 0;
    run.len = TUNE.winterLen(s.year);
    run.temp = TUNE.tempStart;
    run.heat = [];
    run.logCd = 0;
    run.wps = [];
    run.wpId = 1;
    run.nextWp = s.year >= TUNE.wpFrom ? 6 + this.rand() * 6 : Infinity;
    run.ayazAt = s.year >= TUNE.ayazFrom ? 22 + this.rand() * 25 : Infinity;
    run.ayaz = 0;
    run.coldFlag = false;
    run.hotFlag = false;
    run.squirrels = [];
    for (let k = 0; k < s.staff.sincap; k++) run.squirrels.push({ x: SQ_HOME(k).x, y: SQ_HOME(k).y, state: 'idle', target: null, t: 0, k });
    run.owl = s.staff.baykus ? { state: 'perch', target: null, t: 0, col: 3 } : null;
    run.deer = s.staff.geyik ? { cd: 0, t: 0 } : null;
    // the fun part: falling nuts, dreams and the northern lights
    run.drops = []; run.dropId = 1; run.nextDrop = 2.5 + this.rand() * 2; run.caught = 0;
    run.peace = 0; run.aurora = 0; run.auroras = 0;
    run.dreams = 0; run.dreamTip = 0; run.nextDream = TUNE.dreamFirst(s.year) + this.rand() * 3;
    run.foods = FOOD_ORDER.filter((f) => run.guests.some((g) => SPECIES[g.sp].food.includes(f)));
    this.emit('winter', { len: run.len });
    if (!run.guests.length) run.t = run.len;
  }

  noiseMult() { return this.save.upgrades.yosun ? TUNE.yosunNoise : 1; }

  addLog(by) {
    if (this.phase !== 'winter') return false;
    const run = this.run;
    if (by !== 'geyik') {
      if (run.logCd > 0) return false;
      run.logCd = TUNE.logCooldown;
    }
    if (by !== 'geyik' && run.temp + this.pendingHeat() < TUNE.ZONE[0] + 5) this.peaceBonus(false, { cabin: true });
    run.heat.push(TUNE.logHeat);
    this.emit('log', { by: by || 'player' });
    return true;
  }

  pendingHeat() { return this.run.heat.reduce((a, b) => a + b, 0); }

  // Fixing something fills the northern-lights bar; a quick fix fills it more.
  peaceBonus(quick, where) {
    const run = this.run;
    if (run.aurora > 0) return;
    run.peace = Math.min(100, run.peace + (quick ? TUNE.peaceQuick : TUNE.peaceFix));
    if (quick) this.emit('quick', where);
  }

  // How many things need the player right now.
  issueCount() {
    const run = this.run, T = TUNE;
    let n = run.wps.length + (run.temp < T.ZONE[0] || run.temp > T.ZONE[1] ? 1 : 0);
    for (const g of run.guests) if (!g.gone && ((!g.blanket && SPECIES[g.sp].blanket) || g.snore > 0)) n++;
    return n;
  }

  catchDrop(id) {
    if (this.phase !== 'winter') return 0;
    const run = this.run, d = run.drops.find((x) => x.id === id);
    if (!d) return 0;
    run.drops.splice(run.drops.indexOf(d), 1);
    const v = dropValue(this.save.year, d.gold);
    run.caught += v;
    this.emit('caught', { id, x: d.x, p: d.p, ph: d.ph, v, gold: d.gold });
    return v;
  }

  feed(cell, item) {
    if (this.phase !== 'winter') return 'phase';
    const run = this.run, g = this.roomGuest(cell);
    if (!g || g.woke || !g.dream) return 'none';
    if (g.dream.item !== item) return 'wrong';
    g.dream = null;
    g.sleep = Math.min(100, g.sleep + TUNE.dreamSleep);
    const tip = Math.max(1, Math.round(SPECIES[g.sp].price * LEVELS[this.save.grid[cell].lvl].pay * TUNE.dreamTip));
    run.dreamTip += tip; run.dreams++;
    if (run.aurora <= 0) run.peace = Math.min(100, run.peace + TUNE.peaceFeed);
    this.emit('fed', { cell, item, tip, sp: g.sp });
    return 'ok';
  }

  tapRoom(cell) {
    if (this.phase !== 'winter') return false;
    const g = this.roomGuest(cell);
    if (!g || g.woke) return false;
    let did = false, quick = false;
    if (!g.blanket) { quick = g.offT <= TUNE.quickT; g.blanket = true; g.offT = 0; this.emit('tucked', { cell, by: 'player' }); did = true; }
    if (g.snore > 0) { quick = quick || TUNE.snoreLen - g.snore <= TUNE.quickT; g.snore = 0; g.rest = TUNE.snoreRest; this.emit('rolled', { cell }); did = true; }
    if (did) this.peaceBonus(quick, { cell });
    return did;
  }

  shoo(id, by) {
    const run = this.run;
    if (this.phase !== 'winter') return false;
    const wp = run.wps.find((w) => w.id === id);
    if (!wp) return false;
    run.wps.splice(run.wps.indexOf(wp), 1);
    this.emit('shoo', { id, col: wp.col, by: by || 'player' });
    if (!by || by === 'player') this.peaceBonus(wp.t <= TUNE.quickT, { col: wp.col });
    return true;
  }

  updateWinter(dt) {
    const run = this.run, s = this.save, T = TUNE;
    run.t += dt;
    run.logCd = Math.max(0, run.logCd - dt);

    // Stove.
    if (run.t >= run.ayazAt && !run.ayazDone) {
      run.ayaz = T.ayazLen; run.ayazDone = true; this.emit('ayaz');
    } else if (!run.ayazDone && run.ayazAt - run.t < 3 && !run.ayazWarned) {
      run.ayazWarned = true; this.emit('ayazWarn');
    }
    if (run.ayaz > 0) { run.ayaz -= dt; if (run.ayaz <= 0) this.emit('ayazEnd'); }
    const decay = T.decay * (s.year === 1 ? 0.75 : 1) * (s.upgrades.duvar ? T.decayDuvar : 1) * (run.ayaz > 0 ? T.ayazDecay : 1) * (run.aurora > 0 ? 0.5 : 1);
    run.temp -= decay * dt;
    for (let k = run.heat.length - 1; k >= 0; k--) {
      const add = Math.min(run.heat[k], T.logHeat * dt / T.logTime);
      run.temp += add;
      run.heat[k] -= add;
      if (run.heat[k] <= 0.001) run.heat.splice(k, 1);
    }
    run.temp = Math.max(0, Math.min(100, run.temp));
    if (run.temp < T.ZONE[0] && !run.coldFlag) { run.coldFlag = true; this.emit('cold'); }
    if (run.temp > T.ZONE[0] + 3) run.coldFlag = false;
    if (run.temp > T.ZONE[1] && !run.hotFlag) { run.hotFlag = true; this.emit('hot'); }
    if (run.temp < T.ZONE[1] - 3) run.hotFlag = false;

    // Woodpeckers.
    const awake = run.guests.filter((g) => !g.gone);
    const calm = run.aurora > 0;
    if (s.year >= T.wpFrom && awake.length && !calm) {
      run.nextWp -= dt;
      const maxWp = 1 + Math.floor(s.year / 5);
      if (run.nextWp <= 0 && run.t < run.len - 4) {
        run.nextWp = T.wpGap(s.year) * (0.7 + 0.6 * this.rand());
        if (run.wps.length < maxWp) {
          const used = new Set(run.wps.map((w) => w.col));
          let cols = [...new Set(awake.map((g) => cellRC(g.cell).c))].filter((c) => !used.has(c));
          if (!cols.length) cols = [0, 1, 2, 3].filter((c) => !used.has(c));
          if (cols.length) {
            const wp = { id: run.wpId++, col: this.pick(cols), t: 0 };
            run.wps.push(wp);
            this.emit('wp', { id: wp.id, col: wp.col });
          }
        }
      }
    }
    for (const wp of run.wps.slice()) {
      wp.t += dt;
      if (wp.t > T.wpLen) { run.wps.splice(run.wps.indexOf(wp), 1); this.emit('wpGone', { id: wp.id, col: wp.col }); }
    }

    // Guests: blankets slip, some start snoring.
    const bRate = s.year === 1 ? T.blanketRateY1 : T.blanketRate;
    for (const g of awake) {
      const sp = SPECIES[g.sp];
      g.rest -= dt;
      if (!calm && sp.blanket && g.blanket && this.rand() < bRate * sp.toss * dt) {
        g.blanket = false; g.offT = 0; this.emit('blanket', { cell: g.cell, sp: g.sp });
      }
      if (!g.blanket) g.offT += dt;
      if (!calm && sp.snore && g.snore <= 0 && g.rest <= 0 && this.rand() < T.snoreRate * sp.snore * dt) {
        g.snore = T.snoreLen; this.emit('snore', { cell: g.cell, sp: g.sp });
      }
      if (g.snore > 0) {
        g.snore -= dt;
        if (g.snore <= 0) { g.snore = 0; g.rest = T.snoreRest * 0.5; }
      }
    }

    // Sleep.
    const nm = this.noiseMult();
    const ninni = !!s.upgrades.ninni;
    for (const g of awake) {
      const sp = SPECIES[g.sp], { r, c } = cellRC(g.cell);
      let d = 0;
      if (run.temp < T.ZONE[0]) d += T.coldDrain * (T.ZONE[0] - run.temp) / T.ZONE[0] * sp.cold;
      if (run.temp > T.ZONE[1]) d += T.heatDrain * (run.temp - T.ZONE[1]) / (100 - T.ZONE[1]) * sp.heat;
      if (!g.blanket && sp.blanket) d += T.blanketDrain * (0.5 + 0.5 * sp.cold);
      for (const wp of run.wps) if (wp.col === c) d += T.woodDrain * T.wpFalloff[r] * sp.noise * nm;
      for (const n of neighbours(g.cell)) {
        const o = this.roomGuest(n);
        if (o && o.snore > 0 && !o.woke) d += T.snoreDrain * sp.noise * nm;
      }
      d *= LEVELS[s.grid[g.cell].lvl].drain * (ninni ? T.ninniDrain : 1);
      g.drain = d;
      if (d > 0.05) g.sleep -= d * dt;
      else g.sleep += (T.regen + (ninni ? T.regenNinni : 0) + (calm ? T.auroraRegen : 0)) * dt;
      g.sleep = Math.max(0, Math.min(100, g.sleep));
      if (g.sleep <= 0) {
        g.woke = true; g.gone = true; g.snore = 0; g.dream = null;
        this.emit('woke', { cell: g.cell, sp: g.sp, id: g.id });
      }
    }

    this.updateStaff(dt);
    this.updateFun(dt, awake);
    if (run.t >= run.len) this.startSpring();
  }

  updateFun(dt, awake) {
    const run = this.run, T = TUNE;
    // nuts falling with the snow (a downpour under the northern lights)
    run.nextDrop -= dt;
    if (run.nextDrop <= 0 && run.t < run.len - 1.5) {
      const a = run.aurora > 0;
      run.nextDrop = a ? T.auroraGap : T.dropGap[0] + this.rand() * (T.dropGap[1] - T.dropGap[0]);
      const fall = a ? T.auroraFall : T.dropFall[0] + this.rand() * (T.dropFall[1] - T.dropFall[0]);
      run.drops.push({ id: run.dropId++, x: 0.05 + this.rand() * 0.9, p: 0, v: 1 / fall, gold: this.rand() < (a ? T.auroraGold : T.goldChance), ph: this.rand() * 6 });
    }
    for (const d of run.drops.slice()) { d.p += d.v * dt; if (d.p >= 1) run.drops.splice(run.drops.indexOf(d), 1); }
    // dreams
    if (run.aurora <= 0) run.nextDream -= dt;
    if (run.nextDream <= 0) {
      run.nextDream = T.dreamGap(awake.length) * (0.8 + 0.4 * this.rand());
      const cand = awake.filter((g) => !g.dream && g.sleep > 25 && (g.blanket || !SPECIES[g.sp].blanket) && g.snore <= 0);
      if (cand.length && run.t < run.len - 6) {
        const g = this.pick(cand);
        g.dream = { item: this.pick(SPECIES[g.sp].food), t: 0 };
        this.emit('dream', { cell: g.cell, item: g.dream.item, sp: g.sp });
      }
    }
    for (const g of awake) {
      if (!g.dream) continue;
      g.dream.t += dt;
      if (g.dream.t > T.dreamLen) { g.dream = null; this.emit('dreamGone', { cell: g.cell }); }
    }
    // the northern lights
    if (run.aurora > 0) {
      run.aurora -= dt;
      if (run.aurora <= 0) { run.aurora = 0; this.emit('auroraEnd'); }
    } else if (awake.length) {
      run.peace += (this.issueCount() ? -T.peaceDrain : T.peaceFill) * dt;
      run.peace = Math.max(0, Math.min(100, run.peace));
      if (run.peace >= 100 && run.t < run.len - 3) {
        run.peace = 0; run.aurora = T.auroraLen; run.auroras++; run.nextDrop = 0.2;
        this.emit('aurora');
      }
    }
  }

  updateStaff(dt) {
    const run = this.run, T = TUNE;
    // Squirrels tuck in fallen blankets.
    for (const sq of run.squirrels) {
      if (sq.state === 'idle' || sq.state === 'home') {
        let best = null, bd = Infinity;
        for (const g of run.guests) {
          if (g.gone || g.blanket || g.offT < T.sincapDelay || g.by != null) continue;
          const { r, c } = cellRC(g.cell), dd = Math.abs(c - sq.x) + Math.abs(r - sq.y);
          if (dd < bd) { bd = dd; best = g; }
        }
        if (best) { best.by = sq.k; sq.target = best.id; sq.state = 'go'; }
        else if (sq.state === 'idle') sq.state = 'home';
      }
      if (sq.state === 'go') {
        const g = run.guests.find((x) => x.id === sq.target);
        if (!g || g.gone) { sq.state = 'idle'; sq.target = null; continue; }
        const { r, c } = cellRC(g.cell);
        if (this.moveTo(sq, c, r, T.sincapSpeed * dt)) {
          if (!g.blanket) { sq.state = 'tuck'; sq.t = 0; } else { g.by = null; sq.state = 'idle'; sq.target = null; }
        }
      } else if (sq.state === 'tuck') {
        sq.t += dt;
        if (sq.t >= T.sincapTuck) {
          const g = run.guests.find((x) => x.id === sq.target);
          if (g && !g.gone && !g.blanket) { g.blanket = true; g.offT = 0; this.emit('tucked', { cell: g.cell, by: 'sincap' }); }
          if (g) g.by = null;
          sq.state = 'idle'; sq.target = null;
        }
      } else if (sq.state === 'home') {
        if (this.moveTo(sq, SQ_HOME(sq.k).x, SQ_HOME(sq.k).y, T.sincapSpeed * dt)) sq.state = 'rest';
      }
      if (sq.state === 'rest') {
        // Resting at the entrance until a blanket needs tucking.
        if (run.guests.some((g) => !g.gone && !g.blanket && g.offT >= T.sincapDelay && g.by == null)) sq.state = 'idle';
      }
    }
    // The owl chases woodpeckers.
    const owl = run.owl;
    if (owl) {
      owl.t += dt;
      if (owl.state === 'perch') {
        const wp = run.wps.find((w) => w.t >= T.baykusDelay);
        if (wp) { owl.state = 'fly'; owl.target = wp.id; owl.col = wp.col; owl.t = 0; }
      } else if (owl.state === 'fly' && owl.t >= T.baykusFly) {
        this.shoo(owl.target, 'baykus');
        owl.state = 'back'; owl.t = 0;
      } else if (owl.state === 'back' && owl.t >= T.baykusFly) {
        owl.state = 'perch'; owl.t = 0;
      }
      if (owl.state === 'fly' && !run.wps.some((w) => w.id === owl.target)) { owl.state = 'back'; owl.t = 0; }
    }
    // The reindeer feeds the stove.
    const deer = run.deer;
    if (deer) {
      deer.cd -= dt; deer.t += dt;
      if (deer.cd <= 0 && run.temp + this.pendingHeat() < T.geyikBelow) {
        this.addLog('geyik'); deer.cd = T.geyikCooldown; deer.t = 0;
      }
    }
  }

  moveTo(o, x, y, step) {
    const dx = x - o.x, dy = y - o.y, d = Math.hypot(dx, dy);
    if (d <= step) { o.x = x; o.y = y; return true; }
    o.x += dx / d * step; o.y += dy / d * step;
    return false;
  }

  // ---- spring -------------------------------------------------------------

  startSpring() {
    const run = this.run, s = this.save;
    this.phase = 'spring';
    run.t = 0;
    run.wps = [];
    run.drops = [];
    const rows = [];
    let pay = 0, tip = 0, hearts = 0;
    for (const g of run.guests) {
      const lvl = s.grid[g.cell].lvl;
      const h = heartsFor(g.sleep, g.woke), p = payFor(g.sp, lvl, g.sleep, g.woke);
      rows.push({ id: g.id, sp: g.sp, cell: g.cell, sleep: Math.round(g.woke ? 0 : g.sleep), hearts: h, pay: p.pay, tip: p.tip, woke: g.woke });
      pay += p.pay; tip += p.tip; hearts += h;
    }
    const caught = run.caught || 0, dreamTip = run.dreamTip || 0;
    const starsBefore = starsFor(s.fame);
    const unlockedBefore = ROOM_ORDER.filter((t) => roomUnlocked(s, t));
    s.money += pay + tip + caught + dreamTip;
    s.fame += hearts;
    s.total.guests += rows.length;
    s.total.hearts += hearts;
    s.total.nuts += pay + tip + caught + dreamTip;
    s.total.woke += rows.filter((x) => x.woke).length;
    s.year += 1;
    const unlocked = ROOM_ORDER.filter((t) => roomUnlocked(s, t) && !unlockedBefore.includes(t));
    run.results = {
      year: run.year, rows, pay, tip, hearts, left: run.left,
      caught, dreamTip, dreams: run.dreams || 0, auroras: run.auroras || 0,
      starsBefore, starsAfter: starsFor(s.fame), unlocked,
    };
    this.emit('spring', { results: run.results });
  }

  updateSpring(dt) {
    this.run.t += dt;
    if (this.run.t >= TUNE.springLen) { this.phase = 'summary'; this.emit('summary', { results: this.run.results }); }
  }

  toSummer() {
    if (this.phase !== 'summary' && this.phase !== 'spring') return;
    this.phase = 'summer';
    this.emit('summer');
  }

  // ---- summer: building ---------------------------------------------------

  dig(i) {
    const s = this.save, cost = digCost(dugCount(s));
    if (this.phase !== 'summer' || !canDig(s, i)) return 'no';
    if (s.money < cost) return 'money';
    s.money -= cost; s.grid[i].dug = true;
    this.emit('dug', { cell: i, cost });
    return 'ok';
  }

  build(i, type) {
    const s = this.save, g = s.grid[i], R = ROOMS[type];
    if (this.phase !== 'summer' || !g.dug || g.room || !R) return 'no';
    if (!roomUnlocked(s, type)) return 'locked';
    if (s.money < R.cost) return 'money';
    s.money -= R.cost; g.room = type; g.lvl = 1;
    this.emit('built', { cell: i, type, cost: R.cost });
    return 'ok';
  }

  upgradeRoom(i) {
    const s = this.save, g = s.grid[i];
    if (this.phase !== 'summer' || !g.room || g.lvl >= 3) return 'no';
    const cost = upgradeCost(g.room, g.lvl);
    if (s.money < cost) return 'money';
    s.money -= cost; g.lvl++;
    this.emit('upgraded', { cell: i, lvl: g.lvl, cost });
    return 'ok';
  }

  demolish(i) {
    const s = this.save, g = s.grid[i];
    if (this.phase !== 'summer' || !g.room) return 'no';
    const back = Math.round(ROOMS[g.room].cost / 2);
    s.money += back; g.room = null; g.lvl = 1;
    this.emit('demolished', { cell: i, back });
    return 'ok';
  }

  itemCost(id) {
    if (STAFF[id]) { const n = this.save.staff[id]; return n >= STAFF[id].max ? null : STAFF[id].cost[n]; }
    if (UPGRADES[id]) return this.save.upgrades[id] ? null : UPGRADES[id].cost;
    return null;
  }

  buy(id) {
    const s = this.save, cost = this.itemCost(id);
    if (this.phase !== 'summer' || cost == null) return 'no';
    if (s.money < cost) return 'money';
    s.money -= cost;
    if (STAFF[id]) s.staff[id]++; else s.upgrades[id] = true;
    this.emit('bought', { id, cost });
    return 'ok';
  }

  // ---- loop ---------------------------------------------------------------

  update(dt) {
    if (this.phase === 'autumn') this.updateAutumn(dt);
    else if (this.phase === 'winter') this.updateWinter(dt);
    else if (this.phase === 'spring') this.updateSpring(dt);
  }
}

// ---------------------------------------------------------------------------
// Drawing. A cross-section of a snowy hill: a red cabin on top (reception and
// stove), burrow rooms below. Flat Nordic shapes, no outlines, muted colours.
// ---------------------------------------------------------------------------

const FONT = '"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif';

const PAL = {
  ink: '#2C2A27', inkSoft: '#5B5650',
  snow: '#F4F4F0', snowBlue: '#DDE6EB',
  falu: '#A9473B', faluDark: '#86362D', trim: '#F1ECE2',
  roof: '#3D3B39', roofSnow: '#F2F3F0',
  pine: '#3E5A4B', pineDark: '#2E4539', pineLight: '#577564',
  birch: '#EFEBE3', birchMark: '#3A3733',
  soil: ['#C3AB8C', '#B59D80', '#A68F74', '#977F68', '#88715D'],
  soilTop: '#CDB698', pebble: 'rgba(70,50,35,0.14)',
  hollow: '#B9A184', hollowDark: '#A68D71',
  room: '#F3E2C1', roomFloor: '#E2CBA2', roomGlow: 'rgba(255,214,140,0.55)',
  mustard: '#D7A23F', nut: '#A86F3A', nutCap: '#7C5030',
  good: '#6F9468', warn: '#D7A23F', bad: '#C2553D', cold: '#6F95B5',
  heart: '#C9523F',
  blankets: [['#AE4639', '#F1E9DC'], ['#4E6E8A', '#F1E9DC'], ['#C08A3A', '#F7F0E2'], ['#5E7E5C', '#F1E9DC']],
};

const SEASON_LOOK = {
  autumn: { skyTop: '#E5C6A3', skyBot: '#F5E8D6', hill1: '#D4B396', hill2: '#C29E80', ground: '#B8834F', groundTop: '#C9934F', crown: ['#D08A3B', '#C2672F', '#DDA54A'], dark: 0 },
  winter: { skyTop: '#1F2B43', skyBot: '#4A5B78', hill1: '#3B4A63', hill2: '#33405A', ground: '#EEF1F2', groundTop: '#F8F8F5', crown: null, dark: 1 },
  spring: { skyTop: '#BCD7D8', skyBot: '#EEF2E3', hill1: '#B3C8B4', hill2: '#9DB79F', ground: '#8DAE68', groundTop: '#9FBE75', crown: ['#A9C77A', '#93B867', '#C3D98E'], dark: 0 },
  summer: { skyTop: '#A7CBDD', skyBot: '#F2EEDD', hill1: '#A6BEA8', hill2: '#8EAA92', ground: '#7C9F5C', groundTop: '#8DB06A', crown: ['#6E9858', '#5D8A4C', '#86AC66'], dark: 0 },
};

// ---- small helpers --------------------------------------------------------

function rrPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function archPath(ctx, x, y, w, h, rTop, rBot) {
  const rt = Math.min(rTop, w / 2, h / 2), rb = Math.min(rBot, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rt, y);
  ctx.arcTo(x + w, y, x + w, y + h, rt);
  ctx.arcTo(x + w, y + h, x, y + h, rb);
  ctx.arcTo(x, y + h, x, y, rb);
  ctx.arcTo(x, y, x + w, y, rt);
  ctx.closePath();
}
function ell(ctx, x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2); }
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
function fillEll(ctx, x, y, rx, ry, col, rot) { ctx.fillStyle = col; ell(ctx, x, y, rx, ry, rot); ctx.fill(); }
function fillCirc(ctx, x, y, r, col) { ctx.fillStyle = col; circ(ctx, x, y, r); ctx.fill(); }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);

// ---- layout ---------------------------------------------------------------

const LAY = {};
function computeLayout(w, h, inset) {
  const top = inset.top + 66, bottom = inset.bottom + 84;
  const pad = Math.max(12, inset.left + 8, inset.right + 8);
  const availW = w - pad * 2, availH = h - top - bottom;
  let surfH = Math.max(120, Math.min(250, availH * 0.25));
  let cellH = (availH - surfH) / (ROWS + 0.2);
  let cellW = Math.min(availW / COLS, cellH * 1.6);
  if (cellW < cellH * 0.82) { cellH = cellW / 0.82; }
  // Give spare height back to the sky so the hill sits on the bottom bar.
  const gridH = cellH * (ROWS + 0.2);
  surfH = Math.max(surfH, availH - gridH);
  Object.assign(LAY, {
    w, h, top, bottom, pad, cellW, cellH, surfH, inset,
    gridW: cellW * COLS,
    gridX: Math.round((w - cellW * COLS) / 2),
    groundY: Math.round(top + surfH),
  });
  LAY.gridY = LAY.groundY + cellH * 0.2;
  const cabW = Math.min(cellW * 1.25, surfH * 0.95, 190);
  const cabH = Math.min(surfH * 0.62, cabW * 0.8);
  LAY.cabin = { x: LAY.gridX + cellW * 3.5 - cabW / 2 + Math.min(cellW * 0.12, 18), y: LAY.groundY - cabH, w: cabW, h: cabH };
  const maxX = w - 4 - cabW * 1.1;
  if (LAY.cabin.x > maxX) LAY.cabin.x = maxX;
  LAY.slotW = Math.min(cellW * 0.66, Math.max(36, (LAY.cabin.x - 10) / TUNE.queueMax));
  LAY.guestS = Math.min(LAY.slotW * 0.92, cellW * 0.6);
  LAY.treeH = Math.min(surfH * 0.86, cellW * 2.0);
}
function cellRect(i) {
  const { r, c } = cellRC(i);
  return { x: LAY.gridX + c * LAY.cellW, y: LAY.gridY + r * LAY.cellH, w: LAY.cellW, h: LAY.cellH };
}
function innerRect(i) {
  const R = cellRect(i), ix = R.w * 0.07, iy = R.h * 0.1;
  return { x: R.x + ix, y: R.y + iy, w: R.w - ix * 2, h: R.h - iy * 2 };
}
function cellAt(x, y) {
  const c = Math.floor((x - LAY.gridX) / LAY.cellW), r = Math.floor((y - LAY.gridY) / LAY.cellH);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
  return cellIdx(r, c);
}
function queueSlot(k) {
  return { x: LAY.cabin.x - LAY.slotW * (k + 0.55), y: LAY.groundY - 2 };
}
function treeX(c) { return LAY.gridX + (c + 0.5) * LAY.cellW - (c === 2 ? LAY.cellW * 0.08 : 0); }
function wpPos(col) {
  if (col === 3) { const C = LAY.cabin; return { x: C.x + C.w * 0.08, y: C.y + C.h * 0.38, side: -1 }; }
  return { x: treeX(col) + Math.max(3, LAY.treeH * 0.035), y: LAY.groundY - LAY.treeH * 0.3, side: 1 };
}
function gridToPx(x, y) { return { x: LAY.gridX + (x + 0.5) * LAY.cellW, y: LAY.gridY + (y + 0.82) * LAY.cellH }; }

// ---- background (cached per season and size) -----------------------------

const bgCache = { key: '', canvas: null };
function drawBackground(ctx, season, dpr) {
  const key = season + '|' + LAY.w + '|' + LAY.h + '|' + dpr;
  if (bgCache.key !== key) {
    const cv = bgCache.canvas || document.createElement('canvas');
    cv.width = Math.round(LAY.w * dpr); cv.height = Math.round(LAY.h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintBackground(c, season);
    bgCache.canvas = cv; bgCache.key = key;
  }
  ctx.drawImage(bgCache.canvas, 0, 0, LAY.w, LAY.h);
}

function paintBackground(ctx, season) {
  const L = SEASON_LOOK[season], { w, h, groundY } = LAY;
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, L.skyTop); g.addColorStop(1, L.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, groundY + 2);

  if (season === 'winter') {
    for (let k = 0; k < 90; k++) {
      const x = hash(k) * w, y = hash(k + 50) * groundY * 0.8, r = 0.5 + hash(k + 99) * 1.1;
      fillCirc(ctx, x, y, r, `rgba(255,255,240,${0.35 + hash(k + 7) * 0.5})`);
    }
    // moon
    const mx = w * 0.16, my = LAY.top + (groundY - LAY.top) * 0.12, mr = Math.min(22, LAY.surfH * 0.12);
    fillCirc(ctx, mx, my, mr * 1.9, 'rgba(240,235,210,0.08)');
    fillCirc(ctx, mx, my, mr, '#EFE9D2');
    fillCirc(ctx, mx + mr * 0.42, my - mr * 0.18, mr * 0.86, L.skyTop);
  } else if (season === 'summer' || season === 'spring') {
    const sx = w * 0.84, sy = LAY.top + LAY.surfH * 0.18, sr = Math.min(26, LAY.surfH * 0.13);
    fillCirc(ctx, sx, sy, sr * 1.8, 'rgba(255,240,200,0.35)');
    fillCirc(ctx, sx, sy, sr, season === 'summer' ? '#F3D27A' : '#F2DFA0');
  } else {
    const sx = w * 0.82, sy = groundY - LAY.surfH * 0.55, sr = Math.min(30, LAY.surfH * 0.15);
    fillCirc(ctx, sx, sy, sr * 1.9, 'rgba(240,170,110,0.25)');
    fillCirc(ctx, sx, sy, sr, '#EBA36A');
  }

  // distant hills with tiny pines
  const hills = (base, amp, col, seed) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, groundY + 1);
    for (let x = 0; x <= w + 20; x += 20) {
      const y = base - amp * (0.5 + 0.5 * Math.sin(x * 0.006 + seed) * Math.cos(x * 0.0023 + seed * 2));
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, groundY + 1); ctx.closePath(); ctx.fill();
  };
  hills(groundY - LAY.surfH * 0.18, LAY.surfH * 0.28, L.hill1, 1.3);
  for (let k = 0; k < Math.floor(w / 26); k++) {
    const x = k * 26 + hash(k + 3) * 14, ph = 8 + hash(k + 11) * 10;
    const base = groundY - LAY.surfH * 0.12 - hash(k + 21) * LAY.surfH * 0.05;
    ctx.fillStyle = L.hill2;
    ctx.beginPath(); ctx.moveTo(x - ph * 0.32, base); ctx.lineTo(x, base - ph); ctx.lineTo(x + ph * 0.32, base); ctx.fill();
  }
  hills(groundY - LAY.surfH * 0.06, LAY.surfH * 0.1, L.hill2, 4.1);

  // soil
  const soilTop = groundY;
  ctx.fillStyle = PAL.soilTop; ctx.fillRect(0, soilTop, w, LAY.gridY - soilTop + 1);
  for (let r = 0; r < ROWS; r++) {
    ctx.fillStyle = PAL.soil[r];
    const y0 = LAY.gridY + r * LAY.cellH;
    ctx.fillRect(0, y0, w, LAY.cellH + 1);
  }
  ctx.fillStyle = PAL.soil[ROWS - 1];
  ctx.fillRect(0, LAY.gridY + ROWS * LAY.cellH, w, h);
  // pebbles
  const n = Math.floor(w * (h - soilTop) / 1400);
  for (let k = 0; k < n; k++) {
    const x = hash(k * 3.1) * w, y = soilTop + 6 + hash(k * 7.7) * (h - soilTop);
    const rx = 1.5 + hash(k * 1.9) * 3.5;
    fillEll(ctx, x, y, rx, rx * 0.65, PAL.pebble);
  }
}

// ---- sky life: aurora, weather particles ---------------------------------

function drawAurora(ctx, t, k) {
  const { w, top, surfH } = LAY;
  const y0 = top + surfH * 0.05;
  k = k == null ? 1 : k;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, k);
  const bands = k > 1.5 ? 4 : 2;
  for (let band = 0; band < bands; band++) {
    ctx.beginPath();
    for (let x = 0; x <= w; x += 12) {
      const y = y0 + surfH * (0.16 + band * 0.1) + Math.sin(x * 0.008 + t * 0.35 + band * 2) * surfH * 0.07 + Math.sin(x * 0.021 - t * 0.2) * surfH * 0.03;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = surfH * Math.max(0.03, 0.09 - (band % 2) * 0.03) * (k > 1.5 ? 1.4 : 1);
    const boost = k > 1.5 ? 3.2 : 1 + k * 0.6;
    ctx.strokeStyle = ['rgba(120,210,170,', 'rgba(130,190,200,', 'rgba(180,150,230,', 'rgba(140,230,190,'][band] + (0.11 * boost).toFixed(3) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

const weather = [];
function updateWeather(season, dt) {
  const target = season === 'winter' ? 70 : season === 'autumn' ? 16 : season === 'spring' ? 10 : 6;
  while (weather.length < target) weather.push(newFlake(season, true));
  if (weather.length > target) weather.length = target;
  for (const f of weather) {
    f.t += dt;
    f.x += (f.vx + Math.sin(f.t * f.wob) * f.sway) * dt;
    f.y += f.vy * dt;
    if (f.y > LAY.groundY + 4 || f.x < -20 || f.x > LAY.w + 20 || f.season !== season) Object.assign(f, newFlake(season, false));
  }
}
function newFlake(season, anywhere) {
  const s = LAY.surfH;
  return {
    season, t: Math.random() * 10,
    x: Math.random() * LAY.w, y: anywhere ? Math.random() * LAY.groundY : -10,
    vx: season === 'autumn' ? -8 - Math.random() * 10 : 0,
    vy: season === 'winter' ? 14 + Math.random() * 18 : season === 'autumn' ? 20 + Math.random() * 16 : 10 + Math.random() * 8,
    sway: season === 'winter' ? 8 : 18, wob: 1 + Math.random() * 2,
    r: season === 'winter' ? 1 + Math.random() * 1.8 : 2.5 + Math.random() * 2.5,
    col: season === 'autumn' ? ['#C9733A', '#D9A148', '#B05A34'][Math.floor(Math.random() * 3)] : season === 'spring' ? '#F3E6EA' : '#FBF3C8',
    rot: Math.random() * 6, big: s,
  };
}
function drawWeather(ctx, season) {
  for (const f of weather) {
    if (season === 'winter') fillCirc(ctx, f.x, f.y, f.r, 'rgba(250,252,255,0.85)');
    else if (season === 'summer') {
      if (f.y > LAY.groundY - LAY.surfH * 0.7) fillCirc(ctx, f.x, f.y, 1.6, 'rgba(255,248,200,0.8)');
    } else fillEll(ctx, f.x, f.y, f.r, f.r * 0.5, f.col, f.rot + f.t);
  }
}

// ---- ground, trees ----------------------------------------------------------

function drawGround(ctx, season) {
  const L = SEASON_LOOK[season], { w, groundY } = LAY;
  const th = season === 'winter' ? 9 : 6;
  ctx.fillStyle = L.ground;
  ctx.beginPath(); ctx.moveTo(0, groundY + th);
  for (let x = 0; x <= w + 16; x += 16) ctx.lineTo(x, groundY - 2 - Math.sin(x * 0.07) * 1.5 - (season === 'winter' ? 2 : 0));
  ctx.lineTo(w, groundY + th); ctx.closePath(); ctx.fill();
  ctx.fillStyle = L.groundTop;
  ctx.fillRect(0, groundY - 3, w, 3);
  if (season === 'spring') {
    for (let k = 0; k < w / 40; k++) fillEll(ctx, hash(k + 4) * w, groundY + 1, 10 + hash(k) * 14, 3, 'rgba(245,245,240,0.8)');
  }
}

function drawPine(ctx, x, base, H, season) {
  const W = H * 0.42;
  ctx.fillStyle = '#5B4636'; ctx.fillRect(x - H * 0.03, base - H * 0.2, H * 0.06, H * 0.2);
  for (let k = 0; k < 4; k++) {
    const yb = base - H * (0.12 + k * 0.2), wk = W * (1 - k * 0.2);
    ctx.fillStyle = k % 2 ? PAL.pine : PAL.pineDark;
    ctx.beginPath(); ctx.moveTo(x - wk / 2, yb); ctx.lineTo(x, yb - H * 0.34); ctx.lineTo(x + wk / 2, yb); ctx.closePath(); ctx.fill();
    if (season === 'winter') {
      ctx.fillStyle = PAL.roofSnow;
      ctx.beginPath(); ctx.moveTo(x - wk * 0.18, yb - H * 0.22); ctx.lineTo(x, yb - H * 0.34); ctx.lineTo(x + wk * 0.18, yb - H * 0.22); ctx.quadraticCurveTo(x, yb - H * 0.2, x - wk * 0.18, yb - H * 0.22); ctx.fill();
    }
  }
}

function drawBirch(ctx, x, base, H, season, seed) {
  const tw = Math.max(4, H * 0.07);
  const L = SEASON_LOOK[season];
  // bare branches
  ctx.strokeStyle = '#4A4440'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.2, tw * 0.28);
  for (let k = 0; k < 5; k++) {
    const by = base - H * (0.45 + k * 0.1), dir = k % 2 ? 1 : -1, len = H * (0.2 - k * 0.025);
    ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + dir * len, by - len * 0.7); ctx.stroke();
    if (season === 'winter') { ctx.strokeStyle = PAL.roofSnow; ctx.lineWidth = Math.max(1, tw * 0.18); ctx.beginPath(); ctx.moveTo(x + dir * len * 0.3, by - len * 0.26); ctx.lineTo(x + dir * len, by - len * 0.75); ctx.stroke(); ctx.strokeStyle = '#4A4440'; ctx.lineWidth = Math.max(1.2, tw * 0.28); }
  }
  if (L.crown) {
    for (let k = 0; k < 7; k++) {
      const a = hash(seed * 9 + k), b = hash(seed * 5 + k + 2);
      fillEll(ctx, x + (a - 0.5) * H * 0.42, base - H * (0.62 + b * 0.3), H * 0.13, H * 0.1, L.crown[k % 3]);
    }
  }
  ctx.fillStyle = PAL.birch;
  rrPath(ctx, x - tw / 2, base - H * 0.95, tw, H * 0.95, tw / 2); ctx.fill();
  ctx.fillStyle = PAL.birchMark;
  for (let k = 0; k < 7; k++) {
    const y = base - H * (0.1 + k * 0.12) - hash(seed + k) * H * 0.04;
    ctx.fillRect(x - tw / 2 + (k % 2 ? tw * 0.45 : 0), y, tw * 0.55, Math.max(1.2, H * 0.012));
  }
}

function drawTrees(ctx, season) {
  const H = LAY.treeH, base = LAY.groundY;
  // decoration outside the hotel, wide screens only
  for (let k = 1; k < 6; k++) {
    const xl = LAY.gridX - k * LAY.cellW * 0.75, xr = LAY.cabin.x + LAY.cabin.w + k * LAY.cellW * 0.7;
    const hh = H * (0.7 + hash(k) * 0.3);
    if (xl > -40) (k % 2 ? drawPine : (c, a, b, d, e) => drawBirch(c, a, b, d, e, k + 10))(ctx, xl, base, hh, season);
    if (xr < LAY.w + 40) (k % 2 ? (c, a, b, d, e) => drawBirch(c, a, b, d, e, k + 20) : drawPine)(ctx, xr, base, hh, season);
  }
  drawPine(ctx, treeX(0), base, H, season);
  drawBirch(ctx, treeX(1), base, H * 1.02, season, 1);
  drawPine(ctx, treeX(2), base, H * 0.92, season);
}

// ---- cabin, stove and thermometer -------------------------------------------

function drawCabin(ctx, season, st) {
  const C = LAY.cabin, { x, y, w, h } = C, t = st.t;
  const winter = season === 'winter';
  // chimney + smoke
  const chx = x + w * 0.7, chy = y - h * 0.32;
  ctx.fillStyle = '#5A514B'; ctx.fillRect(chx - w * 0.05, chy, w * 0.1, h * 0.3);
  const fire = st.fire;
  for (let k = 0; k < 5; k++) {
    const p = ((t * 0.35 + k / 5) % 1);
    const a = (1 - p) * (0.15 + fire * 0.35);
    fillCirc(ctx, chx + Math.sin(p * 5 + k) * w * 0.06 + p * w * 0.12, chy - p * h * 0.9, w * (0.04 + p * 0.07), `rgba(235,235,235,${a})`);
  }
  // body
  ctx.fillStyle = PAL.falu; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  for (let k = 1; k < 9; k++) ctx.fillRect(x + (w / 9) * k, y, 1, h);
  ctx.fillStyle = PAL.trim;
  ctx.fillRect(x, y, w * 0.045, h); ctx.fillRect(x + w * 0.955, y, w * 0.045, h);
  // roof (sod roof with snow in winter)
  const ov = w * 0.1, rh = h * 0.42;
  ctx.fillStyle = PAL.roof;
  ctx.beginPath(); ctx.moveTo(x - ov, y + 2); ctx.lineTo(x + w / 2, y - rh); ctx.lineTo(x + w + ov, y + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = winter ? PAL.roofSnow : season === 'autumn' ? '#8E8A4E' : '#7E9B57';
  ctx.beginPath(); ctx.moveTo(x - ov, y + 1); ctx.lineTo(x + w / 2, y - rh - 4); ctx.lineTo(x + w + ov, y + 1); ctx.lineTo(x + w + ov - 4, y - 4); ctx.lineTo(x + w / 2, y - rh + 3); ctx.lineTo(x - ov + 4, y - 4); ctx.closePath(); ctx.fill();
  // window with the stove
  const wx = x + w * 0.4, wy = y + h * 0.18, ww = w * 0.48, wh = h * 0.56;
  ctx.fillStyle = PAL.trim; ctx.fillRect(wx - 3, wy - 3, ww + 6, wh + 6);
  ctx.fillStyle = winter ? '#F6DFB0' : '#EEDCB9'; ctx.fillRect(wx, wy, ww, wh);
  const glow = ctx.createRadialGradient(wx + ww / 2, wy + wh * 0.75, 2, wx + ww / 2, wy + wh * 0.75, ww * 0.8);
  glow.addColorStop(0, `rgba(255,150,60,${0.25 + fire * 0.45})`); glow.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = glow; ctx.fillRect(wx, wy, ww, wh);
  // stove
  const sw = ww * 0.46, sh = wh * 0.62, sx = wx + ww / 2 - sw / 2, sy = wy + wh - sh;
  ctx.fillStyle = '#2F2D2B'; rrPath(ctx, sx, sy, sw, sh, sw * 0.12); ctx.fill();
  ctx.fillRect(sx + sw * 0.4, wy, sw * 0.2, sy - wy);
  const fx = sx + sw * 0.2, fy = sy + sh * 0.3, fw = sw * 0.6, fh = sh * 0.48;
  ctx.fillStyle = '#4A2A1C'; rrPath(ctx, fx, fy, fw, fh, 3); ctx.fill();
  for (let k = 0; k < 3; k++) {
    const fl = (0.35 + fire * 0.75) * (0.8 + 0.2 * Math.sin(t * 9 + k * 2));
    ctx.fillStyle = k === 1 ? '#F5C659' : '#E7743A';
    ctx.beginPath();
    const cx = fx + fw * (0.25 + k * 0.25), bot = fy + fh - 1;
    ctx.moveTo(cx - fw * 0.13, bot); ctx.quadraticCurveTo(cx, bot - fh * fl * 1.1, cx + fw * 0.13, bot); ctx.fill();
  }
  // window cross
  ctx.fillStyle = PAL.trim; ctx.fillRect(wx, wy + wh * 0.28 - 1.5, ww, 3);
  // door
  const dw = w * 0.2, dh = h * 0.62;
  ctx.fillStyle = PAL.faluDark; rrPath(ctx, x + w * 0.1, y + h - dh, dw, dh, dw * 0.25); ctx.fill();
  fillCirc(ctx, x + w * 0.1 + dw * 0.78, y + h - dh * 0.45, Math.max(1.5, w * 0.012), PAL.mustard);
  // sign with a moon
  const gx = x + w * 0.2, gy = y - h * 0.06, gr = Math.max(7, w * 0.07);
  fillCirc(ctx, gx, gy, gr, PAL.trim);
  fillCirc(ctx, gx - gr * 0.12, gy, gr * 0.55, PAL.mustard);
  fillCirc(ctx, gx + gr * 0.12, gy - gr * 0.14, gr * 0.48, PAL.trim);
  // woodpile
  for (let k = 0; k < 3; k++) for (let j = 0; j < 3 - k; j++) {
    const lx = x + w + ov * 0.2 + j * w * 0.07 + k * w * 0.035, ly = y + h - w * 0.035 - k * w * 0.06;
    if (lx + w * 0.04 < LAY.w) { fillCirc(ctx, lx, ly, w * 0.033, '#8C6440'); fillCirc(ctx, lx, ly, w * 0.016, '#C8A276'); }
  }
  if (winter) drawThermometer(ctx, st);
}

function drawThermometer(ctx, st) {
  const C = LAY.cabin;
  const th = C.h * 0.95, tw = Math.max(9, C.w * 0.085);
  const x = C.x - tw * 1.35, y = C.y + C.h - th - 2;
  const z0 = TUNE.ZONE[0] / 100, z1 = TUNE.ZONE[1] / 100;
  const bulb = tw * 0.95, tubeH = th - bulb * 1.4, ty = y;
  ctx.fillStyle = PAL.trim; rrPath(ctx, x - 3, ty - 3, tw + 6, tubeH + bulb * 1.2 + 6, (tw + 6) / 2); ctx.fill();
  const yAt = (v) => ty + tubeH * (1 - v);
  ctx.fillStyle = 'rgba(111,149,181,0.35)'; ctx.fillRect(x, yAt(z0), tw, tubeH * z0);
  ctx.fillStyle = 'rgba(111,148,104,0.45)'; ctx.fillRect(x, yAt(z1), tw, tubeH * (z1 - z0));
  ctx.fillStyle = 'rgba(194,85,61,0.32)'; rrPath(ctx, x, ty, tw, tubeH * (1 - z1), tw / 2); ctx.fill();
  const v = st.temp / 100;
  const col = st.temp < TUNE.ZONE[0] ? PAL.cold : st.temp > TUNE.ZONE[1] ? PAL.bad : PAL.good;
  ctx.fillStyle = col;
  ctx.fillRect(x + tw * 0.28, yAt(v), tw * 0.44, tubeH * v + bulb * 0.3);
  fillCirc(ctx, x + tw / 2, ty + tubeH + bulb * 0.45, bulb * 0.62, col);
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(x - 2, yAt(z0) - 0.75, tw + 4, 1.5);
  ctx.fillRect(x - 2, yAt(z1) - 0.75, tw + 4, 1.5);
}

// ---- rooms ------------------------------------------------------------------

function drawTunnels(ctx, save) {
  const G = save.grid, cw = LAY.cellW, ch = LAY.cellH;
  ctx.fillStyle = PAL.hollowDark;
  for (let i = 0; i < G.length; i++) {
    if (!G[i].dug) continue;
    const { r, c } = cellRC(i), R = cellRect(i);
    if (c < COLS - 1 && G[i + 1].dug) ctx.fillRect(R.x + R.w * 0.8, R.y + R.h * 0.56, R.w * 0.4, R.h * 0.3);
    if (r < ROWS - 1 && G[i + COLS].dug) {
      ctx.fillRect(R.x + R.w * 0.72, R.y + R.h * 0.7, R.w * 0.13, R.h * 0.5);
    }
  }
  // entrance from the cabin
  const ex = LAY.gridX + cw * 3.5;
  ctx.fillRect(ex - cw * 0.07, LAY.groundY - 2, cw * 0.14, LAY.gridY - LAY.groundY + ch * 0.32);
  if (!G[3].dug) ctx.fillRect(LAY.gridX + cw * 2.8, LAY.gridY + ch * 0.56, cw * 0.77, ch * 0.3);
  // ladder rungs
  ctx.fillStyle = 'rgba(120,85,55,0.45)';
  for (let i = 0; i < G.length; i++) {
    const { r } = cellRC(i), R = cellRect(i);
    if (G[i].dug && r < ROWS - 1 && G[i + COLS].dug) for (let k = 0; k < 4; k++) ctx.fillRect(R.x + R.w * 0.72, R.y + R.h * (0.8 + k * 0.1), R.w * 0.13, 1.5);
  }
}

function drawCell(ctx, save, i, st) {
  const g = save.grid[i], R = cellRect(i), I = innerRect(i);
  const winter = st.season === 'winter';
  if (!g.dug) {
    drawSoilDecor(ctx, i);
    if (st.season === 'summer' && st.canDig[i]) {
      ctx.save();
      ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(60,40,25,0.35)';
      archPath(ctx, I.x + 4, I.y + 4, I.w - 8, I.h - 8, I.w * 0.3, 10); ctx.stroke();
      ctx.restore();
      drawShovel(ctx, I.x + I.w / 2, I.y + I.h * 0.45, Math.min(I.w, I.h) * 0.3);
    }
    return;
  }
  const rTop = Math.min(I.w, I.h) * 0.45, rBot = Math.min(I.w, I.h) * 0.14;
  if (!g.room) {
    ctx.fillStyle = PAL.hollow; archPath(ctx, I.x, I.y, I.w, I.h, rTop, rBot); ctx.fill();
    ctx.fillStyle = PAL.hollowDark; ctx.fillRect(I.x + rBot * 0.5, I.y + I.h * 0.84, I.w - rBot, I.h * 0.16 - rBot * 0.3);
    if (st.season === 'summer') drawPlus(ctx, I.x + I.w / 2, I.y + I.h * 0.48, Math.min(I.w, I.h) * 0.2);
    return;
  }
  // lit room
  ctx.save();
  archPath(ctx, I.x, I.y, I.w, I.h, rTop, rBot); ctx.clip();
  ctx.fillStyle = PAL.room; ctx.fillRect(I.x, I.y, I.w, I.h);
  if (winter || g.lvl >= 2) {
    const gl = ctx.createRadialGradient(I.x + I.w / 2, I.y + I.h * 0.45, 2, I.x + I.w / 2, I.y + I.h * 0.45, I.w * 0.7);
    gl.addColorStop(0, winter ? 'rgba(255,220,150,0.55)' : 'rgba(255,225,165,0.35)'); gl.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = gl; ctx.fillRect(I.x, I.y, I.w, I.h);
  }
  ctx.fillStyle = PAL.roomFloor; ctx.fillRect(I.x, I.y + I.h * 0.82, I.w, I.h * 0.2);
  drawRoomFurniture(ctx, g, I, i);
  ctx.restore();
}

function drawRoomFurniture(ctx, g, I, i) {
  const fx = I.x + I.w / 2, fy = I.y + I.h * 0.86, s = Math.min(I.w, I.h);
  if (g.lvl >= 3) {
    // framed picture of a fjord
    const pw = s * 0.24, ph = s * 0.17, px = I.x + I.w * 0.66, py = I.y + I.h * 0.24;
    ctx.fillStyle = '#8A6A4A'; ctx.fillRect(px - 2, py - 2, pw + 4, ph + 4);
    ctx.fillStyle = '#CFE0E6'; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#6E8D7A'; ctx.beginPath(); ctx.moveTo(px, py + ph); ctx.lineTo(px + pw * 0.35, py + ph * 0.35); ctx.lineTo(px + pw * 0.6, py + ph * 0.75); ctx.lineTo(px + pw * 0.8, py + ph * 0.5); ctx.lineTo(px + pw, py + ph); ctx.fill();
    // rug
    ctx.fillStyle = '#C9B7D0'; rrPath(ctx, I.x + I.w * 0.12, fy - 1, I.w * 0.76, s * 0.07, 3); ctx.fill();
    ctx.fillStyle = '#F4EFE6'; for (let k = 0; k < 6; k++) ctx.fillRect(I.x + I.w * (0.17 + k * 0.12), fy, I.w * 0.05, s * 0.05);
  }
  if (g.lvl >= 2) {
    const lx = I.x + I.w * 0.2, ly = I.y + I.h * 0.18;
    ctx.strokeStyle = '#5A4A3E'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(lx, I.y); ctx.lineTo(lx, ly); ctx.stroke();
    fillCirc(ctx, lx, ly + s * 0.05, s * 0.14, 'rgba(255,210,130,0.35)');
    ctx.fillStyle = '#3E3A36'; rrPath(ctx, lx - s * 0.035, ly, s * 0.07, s * 0.1, 2); ctx.fill();
    fillCirc(ctx, lx, ly + s * 0.05, s * 0.022, '#F7CD6B');
  }
  switch (g.room) {
    case 'yuva':
      for (let k = 0; k < 9; k++) {
        const a = Math.PI * (k / 8), rx = s * 0.36;
        fillEll(ctx, fx - Math.cos(a) * rx, fy - Math.sin(a) * s * 0.05, s * 0.09, s * 0.04, ['#C58A44', '#B46A38', '#D3A253'][k % 3], -Math.cos(a) * 0.6);
      }
      fillEll(ctx, fx, fy, s * 0.38, s * 0.07, '#B98447');
      break;
    case 'havuz':
      fillEll(ctx, fx, fy, s * 0.42, s * 0.11, '#7D6250');
      fillEll(ctx, fx, fy - s * 0.01, s * 0.36, s * 0.07, '#6A5244');
      fillEll(ctx, fx + s * 0.3, fy - s * 0.02, s * 0.08, s * 0.03, '#7E9C5E');
      break;
    case 'magara':
      ctx.fillStyle = '#B3ABA0';
      for (let k = 0; k < 7; k++) {
        const side = k % 2 ? I.x + I.w * 0.04 : I.x + I.w * 0.96;
        fillEll(ctx, side, I.y + I.h * (0.3 + (k >> 1) * 0.18), s * 0.09, s * 0.07, k % 3 ? '#B8B0A5' : '#A69E93');
      }
      fillEll(ctx, fx, fy + s * 0.01, s * 0.44, s * 0.07, '#E8DCC6');
      break;
    case 'oda':
      fillEll(ctx, fx, fy, s * 0.4, s * 0.08, '#D9B75C');
      ctx.strokeStyle = '#B9963F'; ctx.lineWidth = 1;
      for (let k = 0; k < 9; k++) { const xx = fx - s * 0.32 + k * s * 0.08; ctx.beginPath(); ctx.moveTo(xx, fy + s * 0.03); ctx.lineTo(xx + s * 0.04, fy - s * 0.05); ctx.stroke(); }
      break;
    case 'tunek':
      ctx.fillStyle = '#8A6646'; ctx.fillRect(I.x + I.w * 0.12, I.y + I.h * 0.24, I.w * 0.76, Math.max(3, s * 0.05));
      fillEll(ctx, fx, fy, s * 0.24, s * 0.05, '#8FA06C');
      break;
  }
}

// Little things buried in the soil, so the empty hill is worth looking at.
function drawSoilDecor(ctx, i) {
  const R = cellRect(i), { r } = cellRC(i), s = Math.min(R.w, R.h);
  const kind = Math.floor(hash(i * 13.7 + 1) * 7);
  const cx = R.x + R.w * (0.3 + hash(i * 3.3) * 0.4), cy = R.y + R.h * (0.38 + hash(i * 5.1) * 0.3);
  ctx.save();
  if (kind <= 1 || r === ROWS - 1) {
    const n = 2 + (r >> 1);
    for (let k = 0; k < n; k++) fillEll(ctx, cx + (k - n / 2) * s * 0.13, cy + (k % 2) * s * 0.07, s * (0.07 + hash(i + k) * 0.05), s * 0.05, k % 2 ? 'rgba(120,105,95,0.45)' : 'rgba(140,125,112,0.45)');
  } else if (kind === 2) {
    ctx.strokeStyle = 'rgba(205,140,130,0.85)'; ctx.lineWidth = Math.max(2, s * 0.035); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - s * 0.14, cy);
    ctx.bezierCurveTo(cx - s * 0.08, cy - s * 0.07, cx - s * 0.02, cy + s * 0.07, cx + s * 0.05, cy);
    ctx.bezierCurveTo(cx + s * 0.09, cy - s * 0.05, cx + s * 0.13, cy - s * 0.02, cx + s * 0.15, cy - s * 0.04); ctx.stroke();
    fillCirc(ctx, cx + s * 0.155, cy - s * 0.045, Math.max(1.2, s * 0.022), 'rgba(185,115,105,0.9)');
  } else if (kind === 3) {
    fillEll(ctx, cx, cy + s * 0.04, s * 0.16, s * 0.07, 'rgba(90,65,45,0.3)');
    drawNut(ctx, cx - s * 0.07, cy + s * 0.02, s * 0.045); drawNut(ctx, cx + s * 0.05, cy + s * 0.03, s * 0.045); drawNut(ctx, cx - s * 0.01, cy - s * 0.03, s * 0.045);
  } else if (kind === 4) {
    ctx.strokeStyle = 'rgba(235,225,205,0.55)'; ctx.lineWidth = Math.max(1.5, s * 0.025);
    ctx.beginPath();
    for (let a = 0; a < 14; a += 0.3) { const rr = s * 0.012 * a; const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr; if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
  } else if (kind === 5 && r < 2) {
    ctx.strokeStyle = 'rgba(95,70,50,0.3)'; ctx.lineWidth = Math.max(1.5, s * 0.03); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, R.y); ctx.quadraticCurveTo(cx - s * 0.15, R.y + R.h * 0.35, cx + s * 0.05, R.y + R.h * 0.65);
    ctx.moveTo(cx - s * 0.06, R.y + R.h * 0.28); ctx.quadraticCurveTo(cx + s * 0.1, R.y + R.h * 0.36, cx + s * 0.2, R.y + R.h * 0.3); ctx.stroke();
  }
  ctx.restore();
}

function drawShovel(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6);
  ctx.fillStyle = 'rgba(60,40,25,0.45)';
  ctx.fillRect(-s * 0.06, -s * 0.7, s * 0.12, s * 0.9);
  ctx.beginPath(); ctx.moveTo(-s * 0.28, s * 0.15); ctx.lineTo(s * 0.28, s * 0.15); ctx.lineTo(s * 0.2, s * 0.55); ctx.quadraticCurveTo(0, s * 0.75, -s * 0.2, s * 0.55); ctx.closePath(); ctx.fill();
  ctx.fillRect(-s * 0.2, -s * 0.8, s * 0.4, s * 0.1);
  ctx.restore();
}
function drawPlus(ctx, x, y, s) {
  fillCirc(ctx, x, y, s, 'rgba(255,250,240,0.55)');
  ctx.fillStyle = 'rgba(60,40,25,0.55)';
  ctx.fillRect(x - s * 0.5, y - s * 0.09, s, s * 0.18);
  ctx.fillRect(x - s * 0.09, y - s * 0.5, s * 0.18, s);
}

// ---- animals ----------------------------------------------------------------
// drawAnimal(ctx, sp, x, base, s, o): x = centre, base = floor line, s = size.
// o: { awake, grumpy, t, shiver, snore, blanket (true/false/undefined),
//      bcol (blanket colours), walk, scale }

const SP_SCALE = { fare: 0.74, kirpi: 0.8, kurbaga: 0.78, ayi: 1.0, porsuk: 0.88, yarasa: 0.7 };

function eye(ctx, x, y, s, o) {
  if (o.awake && !o.grumpy) {
    fillCirc(ctx, x, y, s * 0.045, PAL.ink);
    fillCirc(ctx, x + s * 0.015, y - s * 0.015, s * 0.015, '#fff');
  } else {
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1.2, s * 0.028); ctx.lineCap = 'round';
    ctx.beginPath();
    if (o.grumpy) { ctx.moveTo(x - s * 0.05, y - s * 0.02); ctx.lineTo(x + s * 0.05, y + s * 0.01); }
    else ctx.arc(x, y - s * 0.01, s * 0.045, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
}
function cheek(ctx, x, y, s) { fillEll(ctx, x, y, s * 0.05, s * 0.03, 'rgba(225,120,110,0.35)'); }

// A knitted blanket draped over the body like a dome, tucked in at the floor.
function drawBlanket(ctx, cx, base, rx, ry, cols, breathe) {
  const [c1, c2] = cols;
  const k = 1 + (breathe || 0);
  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.ellipse(cx, base, rx * 1.02, ry * k, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
  // hem along the top and a row of Nordic stitches
  ctx.strokeStyle = c2; ctx.lineWidth = Math.max(1.5, ry * 0.09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(cx, base, rx * 0.86, ry * k * 0.84, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  ctx.fillStyle = c2;
  const n = Math.max(3, Math.round(rx / 7)), d = Math.max(1.6, ry * 0.08);
  for (let j = 0; j < n; j++) {
    const a = Math.PI * (1.2 + 0.6 * j / Math.max(1, n - 1));
    const xx = cx + Math.cos(a) * rx * 0.62, yy = base + Math.sin(a) * ry * k * 0.56;
    ctx.beginPath(); ctx.moveTo(xx, yy - d); ctx.lineTo(xx + d, yy); ctx.lineTo(xx, yy + d); ctx.lineTo(xx - d, yy); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(cx - rx, base - Math.max(1.5, ry * 0.08), rx * 2, Math.max(1.5, ry * 0.08));
}
const BLANKET = { fare: [0.13, 0.36, 0.44], kirpi: [0.15, 0.37, 0.36], ayi: [0.15, 0.43, 0.38], porsuk: [0.15, 0.41, 0.35] };
function drawFallenBlanket(ctx, x, base, w, cols) {
  ctx.fillStyle = cols[0];
  rrPath(ctx, x, base - w * 0.16, w, w * 0.16, w * 0.07); ctx.fill();
  ctx.fillStyle = cols[1]; ctx.fillRect(x + w * 0.1, base - w * 0.11, w * 0.8, Math.max(1, w * 0.035));
}

function drawAnimal(ctx, sp, x, base, s, o) {
  o = o || {};
  const t = o.t || 0;
  ctx.save();
  let jx = 0, sy = 1;
  if (o.shiver) jx = Math.sin(t * 60) * s * 0.018;
  if (o.snore) sy = 1 + Math.sin(t * 5) * 0.05;
  else if (!o.awake) sy = 1 + Math.sin(t * 1.6 + x) * 0.02;
  if (o.walk) { base -= Math.abs(Math.sin(t * 9)) * s * 0.06; }
  ctx.translate(x + jx, base);
  if (o.flip) ctx.scale(-1, 1);
  ctx.scale(1, sy);
  // soft shadow
  if (sp !== 'yarasa') fillEll(ctx, 0, 0, s * 0.42, s * 0.05, 'rgba(60,40,25,0.16)');
  ANIMALS[sp](ctx, s, o);
  ctx.restore();
}

const ANIMALS = {
  fare(ctx, s, o) {
    const r = s * 0.34, cy = -r * 0.98;
    // tail wraps round the front
    ctx.strokeStyle = '#B97E3E'; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, cy + r * 0.15, r * 0.95, -0.15 * Math.PI, 0.55 * Math.PI); ctx.stroke();
    fillCirc(ctx, 0, cy, r, '#D49B57');
    fillEll(ctx, -r * 0.25, cy + r * 0.35, r * 0.55, r * 0.4, '#EBD2A6');
    // tail front
    ctx.strokeStyle = '#C98D47'; ctx.lineWidth = s * 0.15;
    ctx.beginPath(); ctx.arc(0, cy + r * 0.2, r * 0.92, 0.5 * Math.PI, 0.95 * Math.PI); ctx.stroke();
    // ears
    fillCirc(ctx, -r * 0.35, cy - r * 0.85, r * 0.26, '#C88E4C');
    fillCirc(ctx, -r * 0.35, cy - r * 0.85, r * 0.14, '#E9B8A6');
    fillCirc(ctx, r * 0.1, cy - r * 0.95, r * 0.22, '#C88E4C');
    eye(ctx, -r * 0.42, cy - r * 0.2, s, o);
    fillCirc(ctx, -r * 0.92, cy + r * 0.02, s * 0.035, '#C96E6A');
    cheek(ctx, -r * 0.55, cy + r * 0.1, s);
    if (o.awake) { fillEll(ctx, -r * 0.4, -s * 0.02, s * 0.06, s * 0.03, '#B97E3E'); fillEll(ctx, r * 0.3, -s * 0.02, s * 0.06, s * 0.03, '#B97E3E'); }
  },
  kirpi(ctx, s, o) {
    const w = s * 0.92, h = s * 0.5, cy = -h * 0.5;
    // spikes
    ctx.fillStyle = '#6F5D4E';
    ctx.beginPath();
    const n = 13;
    for (let k = 0; k <= n; k++) {
      const a = Math.PI + (k / n) * Math.PI, rr = (k % 2 ? 1.12 : 0.92);
      const px = Math.cos(a) * w * 0.5 * rr + w * 0.06, py = cy + Math.sin(a) * h * 0.95 * rr;
      if (k === 0) ctx.moveTo(px, py + h * 0.4); ctx.lineTo(px, py);
    }
    ctx.lineTo(w * 0.56, 0); ctx.lineTo(-w * 0.4, 0); ctx.closePath(); ctx.fill();
    fillEll(ctx, w * 0.06, cy + h * 0.1, w * 0.46, h * 0.62, '#8A7563');
    for (let k = 0; k < 6; k++) fillEll(ctx, w * (-0.15 + k * 0.08), cy - h * 0.2 + (k % 2) * h * 0.12, w * 0.02, h * 0.12, '#5E4E42', 0.4);
    // face
    ctx.fillStyle = '#E6D2B5';
    ctx.beginPath(); ctx.moveTo(-w * 0.22, cy - h * 0.3); ctx.quadraticCurveTo(-w * 0.62, cy + h * 0.05, -w * 0.58, cy + h * 0.38); ctx.quadraticCurveTo(-w * 0.3, -h * 0.02, -w * 0.12, cy + h * 0.6); ctx.closePath(); ctx.fill();
    fillCirc(ctx, -w * 0.6, cy + h * 0.35, s * 0.04, PAL.ink);
    eye(ctx, -w * 0.33, cy + h * 0.05, s, o);
    cheek(ctx, -w * 0.36, cy + h * 0.32, s);
    if (o.awake) { fillEll(ctx, -w * 0.2, -s * 0.015, s * 0.05, s * 0.025, '#5E4E42'); fillEll(ctx, w * 0.25, -s * 0.015, s * 0.05, s * 0.025, '#5E4E42'); }
  },
  kurbaga(ctx, s, o) {
    const w = s * 0.86, h = s * 0.44, cy = -h * 0.52;
    fillEll(ctx, 0, cy, w * 0.5, h * 0.55, '#86A568');
    fillEll(ctx, 0, cy + h * 0.22, w * 0.36, h * 0.3, '#C3D39A');
    for (const sx of [-1, 1]) {
      fillCirc(ctx, sx * w * 0.24, cy - h * 0.42, s * 0.11, '#86A568');
      if (o.awake && !o.grumpy) { fillCirc(ctx, sx * w * 0.24, cy - h * 0.44, s * 0.07, '#F7F3E6'); fillCirc(ctx, sx * w * 0.24, cy - h * 0.44, s * 0.04, PAL.ink); }
      else eye(ctx, sx * w * 0.24, cy - h * 0.42, s, o);
    }
    ctx.strokeStyle = '#4E6A3E'; ctx.lineWidth = Math.max(1, s * 0.022);
    ctx.beginPath(); ctx.arc(0, cy - h * 0.05, w * 0.16, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    cheek(ctx, -w * 0.28, cy - h * 0.02, s); cheek(ctx, w * 0.28, cy - h * 0.02, s);
    fillEll(ctx, -w * 0.42, -s * 0.02, s * 0.09, s * 0.035, '#7A9A5D'); fillEll(ctx, w * 0.42, -s * 0.02, s * 0.09, s * 0.035, '#7A9A5D');
  },
  ayi(ctx, s, o) {
    const w = s, h = s * 0.5, cy = -h * 0.5;
    fillEll(ctx, w * 0.1, cy, w * 0.46, h * 0.52, '#8A5B3D');
    fillEll(ctx, w * 0.42, -h * 0.12, w * 0.12, h * 0.15, '#7A4E33');
    // head
    const hx = -w * 0.32, hy = cy - h * 0.12, hr = s * 0.24;
    fillCirc(ctx, hx - hr * 0.6, hy - hr * 0.72, hr * 0.32, '#7A4E33');
    fillCirc(ctx, hx + hr * 0.62, hy - hr * 0.72, hr * 0.32, '#7A4E33');
    fillCirc(ctx, hx - hr * 0.6, hy - hr * 0.72, hr * 0.15, '#C9967A');
    fillCirc(ctx, hx, hy, hr, '#8F5F40');
    fillEll(ctx, hx - hr * 0.3, hy + hr * 0.35, hr * 0.52, hr * 0.38, '#CFA67F');
    fillEll(ctx, hx - hr * 0.42, hy + hr * 0.18, hr * 0.17, hr * 0.12, PAL.ink);
    eye(ctx, hx - hr * 0.2, hy - hr * 0.25, s, o);
    eye(ctx, hx + hr * 0.38, hy - hr * 0.22, s, o);
    cheek(ctx, hx + hr * 0.3, hy + hr * 0.25, s);
    fillEll(ctx, -w * 0.18, -h * 0.08, w * 0.12, h * 0.13, '#7A4E33');
