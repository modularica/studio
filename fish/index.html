<style>
/* Layout: a full-bleed pond seen from above; HUD pinned to the top corners, the food chain along the bottom edge, menus floating on the water */
:root{
  --water:#0f3d40;
  --scrim-0:rgba(8,36,39,.06);
  --scrim-1:rgba(8,36,39,.76);
  --glass:rgba(7,33,36,.62);
  --glass-line:rgba(214,236,226,.18);
  --ink:#eef3ea;
  --ink-dim:#a7c3ba;
  --on-light:#12302f;
  --koi:#f27a32;
  --koi-deep:#b4501a;
  --koi-ink:#2a1205;
  --danger:#ff8068;
  --danger-soft:rgba(255,128,104,.16);
  --danger-line:rgba(255,128,104,.5);
  --food:rgba(238,243,234,.92);
  --font-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--water);color:var(--ink);
  font-family:var(--font-ui);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* HUD */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:5;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;
}
.readout{display:grid;gap:3px;text-shadow:0 1px 3px rgba(3,20,22,.6)}
.readout .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.readout .val{font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout .unit{font-size:15px;font-weight:700;margin-left:4px;color:var(--ink-dim)}
.tools{display:flex;align-items:center;gap:8px;pointer-events:auto}
.lives{display:flex;gap:3px;margin-right:4px}
.life{width:26px;height:13px;fill:var(--koi)}
.life.lost{fill:none;stroke:var(--ink-dim);stroke-width:1.3;opacity:.55}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible{outline:2px solid var(--koi);outline-offset:2px}

.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);
  z-index:7;padding:9px 15px;border-radius:999px;max-width:calc(100% - 32px);
  background:var(--glass);border:1px solid var(--glass-line);color:var(--ink);
  font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.toast.bad{border-color:var(--danger-line)}

/* Food chain strip */
.chain{
  position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.chain-inner{max-width:560px;margin:0 auto;position:relative;padding-top:24px}
.marker{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;transition:left .25s ease-out}
.marker span{
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--koi);color:var(--koi-ink);padding:2px 7px 3px;border-radius:6px;line-height:1.2;
}
.marker::after{content:"";width:0;height:0;border:5px solid transparent;border-top-color:var(--koi);border-bottom:0}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.seg{
  height:24px;border-radius:5px;display:grid;place-items:center;min-width:0;
  font-size:clamp(9.5px,2.75vw,11.5px);font-weight:700;white-space:nowrap;overflow:hidden;
  border:1px solid transparent;transition:background .3s,color .3s,border-color .3s;
}
.seg.eat{background:var(--food);color:var(--on-light)}
.seg.near{background:rgba(238,243,234,.14);color:var(--ink);border-color:var(--glass-line)}
.seg.avoid{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.legend{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-shadow:0 1px 2px rgba(3,20,22,.6)}
.legend .keys{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px}
.dot.eat{background:var(--food)}
.dot.avoid{background:var(--danger-soft);border:1px solid var(--danger-line);margin-left:6px}

/* Menus */
.overlay{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 50% 42%,var(--scrim-0),var(--scrim-1));
}
.panel{width:100%;max-width:440px;display:grid;justify-items:center;gap:16px;text-align:center}
.title{
  margin:0 0 4px;font-family:var(--font-display);font-weight:400;
  font-size:clamp(100px,31vw,184px);line-height:.82;color:var(--koi);
  text-shadow:0 8px 0 rgba(5,26,28,.45);display:flex;
}
.title span{display:inline-block;animation:bob 2.8s ease-in-out infinite}
.title span:nth-child(2){animation-delay:-.7s}
.title span:nth-child(3){animation-delay:-1.4s}
.title span:nth-child(4){animation-delay:-2.1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.lede{margin:0;font-size:17px;line-height:1.45;max-width:31ch;text-wrap:balance;text-shadow:0 1px 3px rgba(3,20,22,.6)}
.how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.how span{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink-dim)}
@media (pointer:coarse){.how .kbd{display:none}}
.btn{
  font:800 17px/1 var(--font-ui);letter-spacing:.01em;
  background:var(--koi);color:var(--koi-ink);border:0;border-radius:999px;
  padding:17px 30px;min-height:54px;cursor:pointer;
  box-shadow:0 4px 0 var(--koi-deep);margin-top:4px;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--koi-deep)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.best{margin:0;font-size:13px;font-weight:600;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.best.new{color:var(--koi);font-weight:800;letter-spacing:.04em}
.over-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(42px,12vw,64px);line-height:.95;text-wrap:balance;text-shadow:0 5px 0 rgba(5,26,28,.4)}
.over-title em{font-style:normal;color:var(--danger)}
.stat{margin:0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.eyebrow{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.notes li{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-variant-numeric:tabular-nums}
.notes .sw{width:10px;height:10px;border-radius:50%;flex:none}

@media (prefers-reduced-motion:reduce){
  .title span{animation:none}
  .marker{transition:none}
}
</style>

<canvas id="pond" role="img" aria-label="A pond seen from above, with fish swimming"></canvas>

<header class="hud" id="hud" hidden>
  <div class="readout">
    <span class="lbl">Length</span>
    <span class="val"><span id="lenNum">10.0</span><span class="unit" id="lenUnit">cm</span></span>
  </div>
  <div class="tools">
    <div class="lives" id="lives" role="img" aria-label="3 lives left"></div>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true"></button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
  </div>
</header>

<div class="toast" id="toast" role="status" hidden></div>

<div class="chain" aria-hidden="true">
  <div class="chain-inner">
    <div class="marker" id="marker"><span>you</span></div>
    <div class="track" id="track"></div>
    <div class="legend"><span>Food chain</span><span class="keys"><i class="dot eat"></i>food<i class="dot avoid"></i>avoid</span></div>
  </div>
</div>

<section class="overlay" id="startOv">
  <div class="panel">
    <h1 class="title" aria-label="Fish"><span>F</span><span>i</span><span>s</span><span>h</span></h1>
    <p class="lede">You are a 10&nbsp;cm koi in a crowded pond. Eat fish smaller than you, keep away from bigger ones, and see how big you can grow.</p>
    <div class="how"><span>Drag anywhere to swim</span><span class="kbd">Arrow keys work too</span></div>
    <button class="btn" id="startBtn" type="button">Start swimming</button>
    <p class="best" id="startBest" hidden></p>
  </div>
</section>

<section class="overlay" id="pauseOv" hidden>
  <div class="panel">
    <h2 class="over-title">Paused</h2>
    <p class="stat" id="pauseStat"></p>
    <button class="btn" id="resumeBtn" type="button">Keep swimming</button>
  </div>
</section>

<section class="overlay" id="overOv" hidden>
  <div class="panel">
    <h2 class="over-title" id="overTitle">Eaten</h2>
    <p class="stat" id="overStat"></p>
    <div>
      <p class="eyebrow">Field notes</p>
      <ul class="notes" id="notes"></ul>
    </div>
    <p class="best" id="overBest"></p>
    <button class="btn" id="againBtn" type="button">Swim again</button>
  </div>
</section>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const wrapA = a => { a %= TAU; if (a > Math.PI) a -= TAU; else if (a < -Math.PI) a += TAU; return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* ---------- species: real pond fish, real lengths in cm ---------- */
const PROF = {
  std:  [0.58, 0.9, 1, 0.97, 0.88, 0.75, 0.6, 0.45, 0.31, 0.2],
  deep: [0.62, 0.93, 1, 1, 0.94, 0.82, 0.66, 0.48, 0.32, 0.2],
  slim: [0.4, 0.64, 0.8, 0.92, 1, 0.96, 0.84, 0.64, 0.43, 0.26],
  flat: [0.92, 1, 0.97, 0.9, 0.8, 0.68, 0.55, 0.42, 0.3, 0.2]
};
const SPECIES = [
  { name: 'minnow', plural: 'minnows', min: 3,   max: 10,  body: '#a0ad7f', back: '#56633f', fin: 'rgba(196,198,156,.85)', w: .11,  prof: 'std',  pat: 'none',   tail: 'fork' },
  { name: 'bleak',  plural: 'bleak',   min: 10,  max: 18,  body: '#c6d8d8', back: '#6a8b95', fin: 'rgba(222,233,230,.8)',  w: .095, prof: 'std',  pat: 'none',   tail: 'fork' },
  { name: 'rudd',   plural: 'rudd',    min: 18,  max: 30,  body: '#d8b457', back: '#86692b', fin: '#df5a3e',               w: .13,  prof: 'deep', pat: 'none',   tail: 'fork', pelvic: true },
  { name: 'perch',  plural: 'perch',   min: 30,  max: 45,  body: '#b4b754', back: '#556126', fin: '#ef8a3e',               w: .12,  prof: 'std',  pat: 'bars',   tail: 'fork', pelvic: true },
  { name: 'carp',   plural: 'carp',    min: 45,  max: 80,  body: '#bb9049', back: '#6e532a', fin: 'rgba(170,132,74,.9)',   w: .15,  prof: 'deep', pat: 'scales', tail: 'fork', barbels: .05 },
  { name: 'pike',   plural: 'pike',    min: 80,  max: 130, body: '#7f974a', back: '#435727', fin: 'rgba(176,160,90,.9)',   w: .085, prof: 'slim', pat: 'spots',  tail: 'fork', snout: true },
  { name: 'wels catfish', short: 'wels', plural: 'wels catfish', min: 130, max: 1e9, body: '#808a7e', back: '#3c4640', fin: 'rgba(110,121,110,.95)', w: .14, prof: 'flat', pat: 'mottle', tail: 'round', barbels: .2 }
];
const KOI = { name: 'koi', body: '#f6f1e7', back: '#f6f1e7', fin: 'rgba(250,242,232,.7)', patch: '#ee602c', w: .125, prof: 'std', pat: 'koi', tail: 'fork', pelvic: true };

function speciesFor(l) { for (const s of SPECIES) if (l < s.max) return s; return SPECIES[SPECIES.length - 1]; }
function fmtLen(l) { return l < 100 ? { n: l.toFixed(1), u: 'cm' } : { n: (l / 100).toFixed(2), u: 'm' }; }
function fmtLenStr(l) { const f = fmtLen(l); return f.n + ' ' + f.u; }

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const cv = $('pond'), ctx = cv.getContext('2d');
const hud = $('hud'), lenNum = $('lenNum'), lenUnit = $('lenUnit'), livesEl = $('lives');
const soundBtn = $('soundBtn'), pauseBtn = $('pauseBtn'), toast = $('toast');
const marker = $('marker'), track = $('track');
const startOv = $('startOv'), pauseOv = $('pauseOv'), overOv = $('overOv');

/* ---------- canvas sizing ---------- */
let W = 1, H = 1, DPR = 1, minDim = 1, waterGrad = null, vignette = null;
function resize() {
  W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  minDim = Math.min(W, H);
  waterGrad = ctx.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .5, Math.hypot(W, H) * .62);
  waterGrad.addColorStop(0, '#18595c'); waterGrad.addColorStop(1, '#0a2f33');
  vignette = ctx.createRadialGradient(W / 2, H / 2, minDim * .38, W / 2, H / 2, Math.hypot(W, H) * .62);
  vignette.addColorStop(0, 'rgba(5,24,27,0)'); vignette.addColorStop(1, 'rgba(5,24,27,.6)');
}
function baseLenPx() { return minDim / (W < H ? 6.2 : 8); }
function targetScale(L) { return baseLenPx() * Math.pow(L / 10, 0.15) / L; } // px per cm

/* ---------- caustic light texture (tileable worley) ---------- */
let causticPat = null;
const cOff = [0, 0, 0, 0];
function makeCaustics() {
  try {
    const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
    const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
    const pts = []; for (let i = 0; i < 16; i++) pts.push(Math.random() * N, Math.random() * N);
    for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
      let f1 = 1e9, f2 = 1e9;
      for (let i = 0; i < pts.length; i += 2) {
        let dx = Math.abs(px - pts[i]); if (dx > N / 2) dx = N - dx;
        let dy = Math.abs(py - pts[i + 1]); if (dy > N / 2) dy = N - dy;
        const dd = dx * dx + dy * dy;
        if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
      }
      const v = Math.exp(-(Math.sqrt(f2) - Math.sqrt(f1)) * 0.28);
      const o = (py * N + px) * 4; d[o] = 196; d[o + 1] = 240; d[o + 2] = 226; d[o + 3] = Math.round(255 * v * v);
    }
    x.putImageData(img, 0, 0);
    causticPat = ctx.createPattern(c, 'repeat');
  } catch (e) { causticPat = null; }
}

/* ---------- state ---------- */
const cam = { x: 0, y: 0, scale: 1 };
let mode = 'attract';   // attract | play | paused | over
let fish = [];
let tally = {}, eatenCount = 0, killer = null;
let best = +store.get('fish.best', 0) || 0;
let soundOn = store.get('fish.sound', true) !== false;
let time = 0, flash = 0, toastT = 0, spawnT = 0;
const ripples = [], bubbles = [], labels = [];
const specks = [];
const TARGET = 15;

const P = { x: 0, y: 0, angle: -Math.PI / 2, speed: 0, l: 10, lShow: 10, spine: null, phase: 0, invuln: 0, grace: 0, gulp: 0,
  lives: 3, alive: true, autoA: -Math.PI / 2, autoT: 2, marks: null, g: null, sp: KOI, topIdx: 0 };

/* ---------- spine (follow-the-leader chain) ---------- */
function initSpine(f, l) {
  const seg = l / 9; f.spine = [];
  for (let i = 0; i < 10; i++) f.spine.push({ x: f.x - Math.cos(f.angle) * seg * i, y: f.y - Math.sin(f.angle) * seg * i });
}
function updateSpine(f, l) {
  const s = f.spine, seg = l / 9;
  s[0].x = f.x; s[0].y = f.y;
  let prevA = f.angle + Math.PI;
  for (let i = 1; i < 10; i++) {
    const a = s[i - 1], b = s[i];
    let ang = Math.atan2(b.y - a.y, b.x - a.x);
    const d = wrapA(ang - prevA), lim = i === 1 ? .35 : .42;
    if (d > lim) ang = prevA + lim; else if (d < -lim) ang = prevA - lim;
    b.x = a.x + Math.cos(ang) * seg; b.y = a.y + Math.sin(ang) * seg;
    prevA = ang;
  }
}
function turnToward(o, a, rate) { const d = wrapA(a - o.angle); o.angle += clamp(d, -rate, rate); }

function koiMarks() {
  const m = [{ fi: rand(.3, .9), side: rand(-.15, .15), a: rand(.08, .11), b: rand(.75, 1) }];
  let fi = rand(2.2, 3);
  while (fi < 7.4) { m.push({ fi, side: rand(-.45, .45), a: rand(.07, .12), b: rand(.6, 1) }); fi += rand(1.3, 2.2); }
  return m;
}
function makeMarks(sp) {
  const m = [];
  if (sp.pat === 'spots') for (let i = 0; i < 16; i++) m.push({ fi: rand(1.5, 8.5), side: rand(-.8, .8), r: rand(.008, .014) });
  if (sp.pat === 'mottle') for (let i = 0; i < 12; i++) m.push({ fi: rand(1, 8.5), side: rand(-.8, .8), a: rand(.03, .06), b: rand(.25, .5) });
  return m;
}
function makeFish(sp, l, x, y, a) {
  const f = { sp, l, x, y, angle: a, speed: l * rand(.7, 1.1), cruise: l * rand(.7, 1.15), phase: Math.random() * TAU,
    spine: null, wander: a, wanderT: rand(1, 3), mode: 'wander', chaseT: 0, cool: rand(0, 2), hungry: Math.random() < .65,
    juke: 0, jukeT: 0, dead: false, marks: makeMarks(sp), g: null };
  initSpine(f, l);
  return f;
}

/* ---------- spawning ---------- */
